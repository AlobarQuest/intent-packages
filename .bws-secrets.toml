# Secrets this repo consumes, by stable BWS UUID. Never token values.
#
# Consumption here is genuinely mixed, not uniform. The first two entries are
# consumed only as GitHub Actions secrets by .github/workflows/factory-runner-pilot.yml,
# which the orchestrator triggers to run a factory work unit against this repo
# (WS-6.4a onboarding, 2026-07-09) -- they are never read at runtime by this
# repo's own code. The last two ARE read at runtime: they are fetched by
# intent_packages.factory.credentials.resolve_token via `bws secret get <uuid>`
# when ORCHESTRATOR_{SYSTEM,VERIFIER}_TOKEN is unset (WS-P2.9 task 1,
# 2026-07-29). UUIDs only -- the fetched token value is never persisted.
#
# `consumption` is a single repo-wide toggle and this manifest has two
# consumption stories, so one entry has to be the fixed choice. Keeping
# "environment-injection" (rather than "code-reference") is deliberate: it is
# in the scanner's EXTERNAL_CONSUMPTION_MODES, which suppresses
# *stale*-entry detection, and the first two secrets below are never
# referenced in this repo's code by design (they only ever reach it as
# injected Actions secrets) -- "code-reference" mode would report them stale,
# a false positive. The runtime-fetched pair is safe either way, since
# credentials.py's `bws secret get <uuid>` calls are themselves what the
# scanner's reference check matches on.
consumption = "environment-injection"

# Worker-role orchestrator M2M bearer token. Shared across all six fan-out repos,
# so rotating it is a six-repo operation -- this manifest is how you find them.
[[secret]]
uuid = "d2a4c0fc-128b-4bf5-8e25-b481010e1be0"
name = "orchestrator-factory-runner-github-M2M_TOKEN"
project = "Ops / Platform"

# Spend-capped key used only by factory runners, never the primary key.
[[secret]]
uuid = "b56cf0df-27bc-46a8-8e94-b48201478aff"
name = "anthropic-key-sys-orchestrator"
project = "Ops / Platform"

# Durable orchestrator M2M bearer tokens, fetched at runtime by
# intent_packages.factory.credentials.resolve_token via `bws secret get <uuid>`
# when ORCHESTRATOR_{SYSTEM,VERIFIER}_TOKEN is unset (WS-P2.9 task 1, 2026-07-29).
# Same secrets the orchestrator repo's own manifest names as
# ORCHESTRATOR_M2M_CREDENTIALS and orchestrator-verifier-bearer.
#
# They live in the `SDS Operator` BWS project as of 2026-07-30, readable only by the
# read-only `sds-operator` machine account. credentials.py needs no code change -- it
# reads BWS_ACCESS_TOKEN from the environment -- but the shell that invokes `factory`
# must now bootstrap that token from Keychain account BWS_ACCESS_TOKEN_SDS, via
# ~/Projects/orchestrator/scripts/sds-token.sh, NOT the vps-backup helper.
#
# `role` is the stable lookup key intent_packages.factory.credentials.secret_uuid
# selects on -- deliberately NOT `name`, which is a mutable BWS label a rename
# would silently break a by-name lookup against (secret-handling standard rule 3).
[[secret]]
uuid = "221a48d5-3f29-4898-b300-b4820140c880"
name = "ORCHESTRATOR_M2M_CREDENTIALS"
project = "SDS Operator"
role = "orchestrator-system"

[[secret]]
uuid = "660d5846-abcb-4751-be86-b483012899eb"
name = "orchestrator-verifier-bearer"
project = "SDS Operator"
role = "orchestrator-verifier"
