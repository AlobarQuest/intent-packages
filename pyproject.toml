[project]
name = "intent-packages"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pyyaml>=6.0.3", "ruff>=0.1"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pyyaml>=6.0.3",
  "ruff==0.15.21",
  "pyright==1.1.411",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingModuleSource = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/alembic", "**/migrations"]
