[project]
name = "intent-packages"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]

[project.scripts]
factory = "intent_packages.factory_cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pyyaml>=6.0.3",
  "ruff>=0.16.3",
  "pyright==1.1.411",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
# "." lets tests import the repo-root `scripts/` package directly (no __init__.py
# needed -- PEP 420 namespace package), mirroring how orchestrator's tests import
# its sibling script: tests/__init__.py there makes pytest's rootless-import walk
# insert the repo root itself; this repo's tests/ has no __init__.py, so the
# equivalent has to be declared explicitly here instead.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# ruff 0.16 formats Python code blocks inside Markdown; 0.15 did not. The affected
# files here are ADRs and historical plan documents — the record, not code — so the
# formatter is excluded from them rather than allowed to rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingModuleSource = "none"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/alembic", "**/migrations"]
