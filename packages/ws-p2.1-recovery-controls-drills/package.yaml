package_id: ws-p2.1-recovery-controls-drills
title: "WS-P2.1 — recovery controls and scripted drills: reconciliation-on-ingest, dead-letter recovery, and a report-only reconciliation runner"
revision: 1
status: draft
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-11T01:14:02Z"
supersedes: null
profile: software-delivery
profile_fields:
  repo: AlobarQuest/orchestrator
  branch: sds/wsp21-recovery-controls-drills
  deploy_target: null
  required_checks:
    - Quality
  rollback_plan: "Before deployment, revert or abandon the WS-P2.1 branch and close the draft pull request while retaining this approved package, its evidence, and the review findings. All reconciliation and database behavior is exercised only in disposable local or ephemeral databases under this package; production deployment and runner production-wiring are separately scoped, so there is no production change to roll back here."
outcome:
  what: "The orchestrator detects when pushed external reality (pull-request, CI, and deployment observations) disagrees with its stored lifecycle state and surfaces a reconciliation_required condition for an operator; a dead-letter view plus public-API/CLI recovery actions make terminal failures visible and actionable; a lease-expired worker can attach evidence it already produced without redoing the work; a separate, report-only reconciliation runner actively pulls external reality and pushes it back as observations; and four recovery failure modes are exercised by re-runnable scripted drills."
  why: "Program Phase 2 Wave 1 makes the control plane dependable: the failure path must be as designed as the happy path. The delta over the Phase-1 primitives (leases, idempotent dispatch, circuit breaker, fail-closed gates) is reconciliation against external reality and operator recovery — closing program exit criteria 5 (crash/retry/reconciliation drills pass and are scripted) and 7 (operator status and recovery controls exist)."
  beneficiary: "Devon as the operator who must recover the factory when reality and the orchestrator disagree, and the software delivery system, which gains a designed recovery path instead of relying on lease-expiry timeout plus manual retry."
  success_signal: "Conflict detection records reconciliation_required on divergent pull-request, CI, and deployment observations without auto-mutating completed units; a lease-expired-but-finished worker attaches its evidence without redoing work; the dead-letter view enumerates terminal failures and an operator retries, requeues, or cancels through the public API/CLI within the existing transition guards; the reconciliation runner pushes observed reality back through the public API while the orchestrator process makes no outbound GitHub or Coolify call and gains no background loop; and the four scripted drills run and pass."
scope:
  included:
    - "Author and approve this intent package before any design or work unit is created."
    - "Implement conflict detection on github_pr, github_check, and deployment observation ingest that records a reconciliation_required condition when pushed reality disagrees with stored lifecycle state, treating an externally-merged pull request on a not-yet-completed unit as a never-auto-merge alarm."
    - "Implement append-only supersession for a github_check whose result flips after verification read it, surfacing the flip for operator decision without auto-un-completing a completed unit."
    - "Implement a defined, attributable path to attach evidence produced by a worker whose lease expired before submission, without re-executing the work and without letting the worker declare completion."
    - "Implement a dead-letter view over terminally-failed work units, failed and blocked dispatch records, and open failure-signature circuit breakers, queryable through the public API and CLI."
    - "Implement operator retry, requeue, and cancel actions from the dead-letter view through the public API/CLI, flowing through the existing deterministic transition and authority guards."
    - "Audit duplicate-event protection across every event, evidence, and observation ingress path and add a duplicate-delivery regression test to any path that lacks one."
    - "Implement a projection-vs-source consistency check as an operator-invocable audit that reports any divergence between a live projection and its source tables."
    - "Build a separate, operator-invoked reconciliation runner that pulls pull-request, CI, deployment, and health state for in-flight units and pushes the observed reality back through the orchestrator's public observation API, reporting only."
    - "Write the four recovery drills — orchestrator dies after dispatch, evidence submission fails after worker completion, a pull request is merged outside the session, and deployment succeeds while verification times out — as re-runnable scripted checks in the restore-drill.sh mold, documented for the quarterly cadence."
    - "Prove every acceptance criterion against an ephemeral orchestrator and fixture or recorded observations rather than live third-party calls."
  excluded:
    - "Production deployment of the orchestrator or the reconciliation runner; a separate deploy step handles it, as it did for the orchestrator core."
    - "Production-wiring the reconciliation runner: its schedule, its GitHub App credentials, and its live sds.alobar.net target."
    - "Any outbound call to GitHub or Coolify from the orchestrator process itself."
    - "Any autonomous background loop, scheduler, or cron inside the orchestrator process."
    - "Any automatic merge, or any worker, agent, CI, or orchestrator path that merges a pull request."
    - "Any event-replay or event-sourced projection-rebuild engine; the append-only tables remain the source of truth and only a consistency check is in scope."
    - "Auto-un-completing a completed unit or auto-resolving a conflict on late external state changes; conflicts are surfaced for operator decision."
    - "A cron or scheduled trigger for the reconciliation runner; it is operator-invoked in this package and scheduling is a separate later decision."
    - "Factory SLOs and observability (WS-P2.2), acceptance-criterion adjudication completeness (WS-P2.3), and cost controls (WS-P2.4)."
    - "Any change that makes Linear, Todoist, or GitHub canonical lifecycle state."
  non_goals:
    - "Making the orchestrator pull external reality itself; the runner does the pulling and the orchestrator stays push-only."
    - "Reconciling anything the trusted observation ingress cannot already express."
    - "Proving that the underlying deploys or pull requests are correct; the repositories' own checks and Devon decide that."
  assumptions:
    - "The orchestrator's push-only design and its documented invariant that the observation, release, and post-deploy paths must not call GitHub or Coolify remain in force and are the boundary the runner respects."
    - "External reality reaches the orchestrator only as observations submitted by an authorized SYSTEM actor, and the reconciliation runner is such an actor."
    - "PostgreSQL is the concurrency and idempotency authority; duplicate-delivery tests run against PostgreSQL, not SQLite."
    - "The append-only tables, protected by the database append-only trigger, remain canonical, so there is no derived state that requires event-replay reconstruction."
    - "Devon alone approves this package revision, approves the design, approves the decomposition, and merges the pull request."
  open_questions: []
