    - "Whether the dead-letter view is the smallest legible surface that makes terminal failures visible."
    - "Whether conflict-detection surfacing reliably avoids ever auto-mutating canonical state."
    - "Whether the evidence-attach recovery authorizes the correct actor and handles the superseded-attempt case without re-opening the worker-completion gap."
