risk:
  failure_modes:
    - "Reconciliation is implemented as an orchestrator-side poller that calls GitHub or Coolify, breaking the push-only injection-containment boundary."
    - "A background loop or scheduler is added to the orchestrator process, violating the public-API/CLI-only recovery invariant."
    - "Conflict detection auto-un-completes a completed unit or auto-resolves a conflict, mutating canonical state without an operator decision."
    - "The reconciliation runner is allowed to set canonical lifecycle state instead of only reporting, becoming a second lifecycle authority."
    - "The evidence-attach recovery path lets a worker effectively declare completion or attach evidence for work it did not do."
    - "Operator recovery actions bypass the deterministic transition or authority guards."
    - "Reconciliation scope creeps into an event-replay or projection-rebuild engine the architecture does not need."
    - "A drill mutates real production or shared state instead of disposable scratch state."
  max_impact: "A mis-scoped reconciler could surface false conflicts or, worse, mutate canonical lifecycle truth; the blast radius is capped because production deployment, runner production-wiring, merge, and infrastructure mutation are all out of scope for this package."
  stop_conditions:
    - "A baseline repository or the named Quality check becomes red for an in-scope reason."
    - "The approved package hash changes without a new revision and renewed approval."
    - "The design requires an orchestrator-side outbound call, a background loop, secrets in tracked files, or live infrastructure mutation."
    - "Any path can auto-merge a pull request, auto-un-complete a unit, or let the runner set canonical state."
    - "Implementation scope crosses into WS-P2.2, WS-P2.3, or WS-P2.4 without separately approved intent."
  rollback: "Before deployment, revert or abandon the WS-P2.1 branch and close the draft pull request; preserve this package, its evidence, and the review findings. All database and reconciliation behavior is exercised only in disposable local or ephemeral databases under this package; nothing here deploys to or mutates production."
  escalation_target: devon
