constraints:
  time_budget: "One approved WS-P2.1 design and implementation cycle; production deployment and reconciliation-runner production-wiring are separately scoped and require separately approved intent."
  technology: "Python 3.12, FastAPI, SQLAlchemy, Alembic, and PostgreSQL 16 in the existing AlobarQuest/orchestrator; the reconciliation runner follows the AlobarQuest/factory-runner separate-worker, push-back pattern. No new background loop, scheduler, or cron is added to the orchestrator process."
  policy_legal: "Devon alone approves this exact package revision, approves the written design, approves the decomposition into work units, and merges the pull request."
  privacy_security: "No secrets in tracked files. The reconciliation runner reads GitHub and deployment state with runtime-fetched credentials only when wired to production, which is out of scope here. Ingested pull-request, CI, and deployment content is treated as data, never as instructions."
  compatibility: "The observation ingress contract and the work-unit lifecycle states remain domain-neutral and backward-compatible; reconciliation adds detection and recovery, not new canonical state past completion, and never introduces an orchestrator-side outbound call."
  quality_accessibility: "Follow portfolio code standards and test-driven development; the dead-letter view and recovery actions must be legible to an operator without reconstructing them from logs; drills are readable, re-runnable scripts."
  operational: "All acceptance evidence is realizable against an ephemeral orchestrator and fixture or recorded observations; no production mutation, deployment, or live third-party call occurs in this package."
  other:
    - "Recovery behavior is reachable only through the orchestrator's public API and CLI surfaces; no autonomous background reconciler is added to the orchestrator process."
    - "Conflict detection surfaces a reconciliation_required condition for operator decision; it never auto-un-completes a completed unit and never merges a pull request."
    - "The reconciliation runner reports only: it pushes observations and never sets canonical lifecycle state, mirroring the worker-never-declares-completion invariant."
    - "The projection item is a consistency check only; no event-replay or projection-rebuild engine is built, because the append-only tables are the source of truth."
    - "The reconciliation runner ships from the AlobarQuest/orchestrator repository as a distinct process and entry point that shares no import path with the orchestrator's request-handling code, so the orchestrator process itself remains free of any GitHub or Coolify call; the runner is not a new repository."
    - "An adversarial architecture review must challenge the design — especially the push-only boundary and the runner's report-only role — before implementation."
    - "The written design specification and task-level implementation plan must be reviewed and approved before implementation."
acceptance:
  - id: AC-001
    condition: "When a github_pr observation reports a state (merged, closed, or head changed) that conflicts with a work unit's stored not-yet-completed state, the orchestrator records a reconciliation_required condition rather than silently trusting the observation, and an externally-merged pull request on a unit that has not reached completion is surfaced as a never-auto-merge alarm."
    evidence_type: automated_test
    evidence: "gate: github_pr conflict-detection tests cover merged, closed, and head-changed observations against not-yet-completed and completed units, including the external-merge alarm, on the exact pull-request head"
    approver: policy
  - id: AC-002
    condition: "A later github_check observation for an acceptance criterion supersedes the earlier one under append-only supersession, and a check result that flips after verification read it is surfaced as reconciliation_required and never auto-un-completes a completed unit."
    evidence_type: automated_test
    evidence: "gate: github_check supersession and post-verification-flip tests pass, asserting no completed unit is auto-un-completed"
    approver: policy
  - id: AC-003
    condition: "A deployment observation whose bound implementation work unit's lifecycle verification stage did not reach completion — the split-brain case in which a deployment reports success while that unit's verification timed out or stalled — is detected and recorded as reconciliation_required; a normal in-progress post-deploy verification is explicitly non-conflicting; the orchestrator does not silently accept the deployment as success; and the immutable release-binding digest equality remains enforced."
    evidence_type: automated_test
    evidence: "gate: split-brain detection tests flag a deployment bound to an implementation unit whose verification timed out or stalled, do not flag a normal in-progress post-deploy verification, and preserve the digest-equality guard"
    approver: policy
  - id: AC-004
    condition: "A worker that completed its work but whose lease expired before it submitted evidence has a defined, attributable path to attach that evidence to the corresponding attempt without re-executing the work, the worker still cannot transition the unit to completed, and the recovery is invoked through the public API/CLI."
    evidence_type: automated_test
    evidence: "gate: lease-expired evidence-attach recovery tests pass, including the guard that the worker cannot declare completion"
    approver: policy
  - id: AC-005
    condition: "Terminally-failed work units, failed and blocked dispatch records, and open failure-signature circuit breakers are surfaced through a single dead-letter view queryable via the public API and CLI."
    evidence_type: automated_test
    evidence: "gate: dead-letter view API and CLI tests enumerate failed units, failed and blocked dispatch records, and circuit-open signatures"
    approver: policy
  - id: AC-006
    condition: "An operator can retry, requeue, or cancel an item from the dead-letter view through the public API/CLI; every recovery action is attributable and flows through the existing deterministic transition and authority guards, so it can never declare completion, grant a waiver, or merge a pull request."
    evidence_type: automated_test
    evidence: "gate: operator recovery-action tests prove attribution and that retry, requeue, and cancel respect the transition and authority guards"
    approver: policy
  - id: AC-007
    condition: "Every event, evidence, and observation ingress path is proven idempotent under duplicate delivery via that path's designed mechanism — unique idempotency key, advisory lock, or replay-equality — and every path carries a duplicate-delivery regression test, added where one was missing."
    evidence_type: automated_test
    evidence: "gate: duplicate-delivery idempotency tests cover every event, evidence, and observation ingress path against PostgreSQL"
    approver: policy
  - id: AC-008
    condition: "A re-runnable check verifies that every live projection agrees with its source tables and reports any divergence, and is wired as an operator-invocable audit; it reports zero divergence on a clean fixture and reports the seeded divergence on a corrupted fixture."
    evidence_type: automated_test
    evidence: "gate: projection-versus-source consistency check reports zero divergence on the clean fixture and detects the seeded divergence on the corrupted fixture"
    approver: policy
  - id: AC-009
    condition: "A reconciliation runner separate from the orchestrator process pulls pull-request, CI, deployment, and health state for in-flight units and pushes the observed reality back through the orchestrator's public observation API; it is operator-invoked, and it reports only — it never sets canonical lifecycle state."
    evidence_type: automated_test
    evidence: "gate: reconciliation-runner tests prove it pulls fixture reality, pushes observations through the public observation API, and sets no canonical lifecycle state"
    approver: policy
  - id: AC-010
    condition: "The four recovery drills — orchestrator dies after dispatch, evidence submission fails after worker completion, a pull request is merged outside the session, and deployment succeeds while verification times out — exist as re-runnable scripted checks in the restore-drill.sh mold, each mutating only disposable scratch state while remaining read-only toward production and shared systems, with trapped teardown, and pass."
    evidence_type: automated_test
    evidence: "gate: the four scripted recovery drills run and pass, each mutating only disposable scratch state, read-only toward production and shared systems, with trapped teardown"
    approver: policy
  - id: AC-011
    condition: "The change adds no automatic merge path, no outbound GitHub or Coolify call from the orchestrator process, and no autonomous background loop, scheduler, or cron to the orchestrator; recovery behavior is reachable only through public API/CLI surfaces; workers still cannot declare completion; and no secret is written to a tracked file."
    evidence_type: automated_test
    evidence: "scan: security scan and repository-search assertions confirm no auto-merge path, no orchestrator-side outbound call, no background loop, workers cannot complete, and no tracked secret"
    approver: policy
  - id: AC-012
    condition: "An adversarial architecture review challenges the reconciliation and recovery design — especially the push-only boundary and the runner's report-only role — before implementation, and its findings are resolved in the approved design."
    evidence_type: human_review
    evidence: "human: Devon approves the WS-P2.1 design after an adversarial architecture review resolves its findings"
    approver: devon
  - id: AC-013
    condition: "Devon reviews and merges the pull request personally after the named Quality check succeeds on the exact head; no worker, agent, CI job, or orchestrator path merges it."
    evidence_type: human_review
    evidence: "human: Devon confirms the final review and merge decision, and merge remains outside worker authority"
    approver: devon
