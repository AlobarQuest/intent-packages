profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its
    bws-machine-token adapter, from its Keychain instance on the Mac, which holds the token
    (ADR-0055 amendment 12). The decomposition is the adapter's fixed plan: a human act in which
    Devon creates a new access token for the same machine account in the Bitwarden web app and runs
    rotation-worker stage, which takes it at a hidden prompt into the staging Keychain item
    rotation/bws-tok-ops-mini-20260730/<occurrence>/staging and prints its fingerprint; unit store
    (verify_new, store, distribute), which writes the keeper BWS_ACCESS_TOKEN_VPS_BACKUP first and
    then BWS_ACCESS_TOKEN_INFRA_DRIFT and BWS_ACCESS_TOKEN_INFRAOPS; unit verify (verify_consumers),
    which reads every Keychain item back, waits unclaimed until each of the eighteen registered
    readers has run since the switch, and proves the old token still logs in; a human act in which
    Devon, only after the verify unit completes, ends every Claude Code session started before the
    switch (each runs an infraops MCP server that read the token once, at start), restarts veritok's
    two launch agents with launchctl kickstart -k, then revokes the old token in the web app, and
    resolving the act attests the restarts; and unit confirm (confirm_dead),
    which the executor claims no earlier than 75 minutes after the revoke is recorded. No unit
    writes a hosted service, so each sets touches_no_hosted_service. The probe is a fresh login: a
    new Bitwarden SDK client in a child process with an empty HOME and the token on stdin, which
    logs in for a live token and answers invalid_client for a revoked or random one. The token is
    the broad Developer Machines identity, read by about thirty scripts. Eighteen scheduled readers
    are verified by a read: the vps-backup chain and factory-events by the recovery_floor
    observation each run posts with the token, and change-window, portfolio-scan and every
    orchestrator lane by its Healthchecks check, which needs the Keychain instance's read-only
    Healthchecks key. The rest read their Keychain item fresh each run and are verified by its
    read-back alone (Devon, 2026-10-23). Evidence carries fingerprints, probe status codes and notes
    only.
  external_systems:
  - >-
    Bitwarden Secrets Manager — a fresh login with the token as the probe, and the web app
    (Machine accounts, Access tokens), where Devon creates and revokes tokens
  - >-
    The Mac's login Keychain — the keeper Claude/BWS_ACCESS_TOKEN_VPS_BACKUP, the items
    Claude/BWS_ACCESS_TOKEN_INFRA_DRIFT and Claude/BWS_ACCESS_TOKEN_INFRAOPS, and the executor's
    staging, quarantine and Healthchecks key items under its own service
  - >-
    Healthchecks — the last runs of change-window's, portfolio-scan's and every orchestrator lane's
    checks, read with the Keychain instance's read-only key
  - >-
    The orchestrator — the recovery_floor observations the vps-backup chain and factory-events
    post
