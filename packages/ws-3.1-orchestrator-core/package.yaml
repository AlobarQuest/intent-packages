constraints:
  time_budget: "One approved WS-3.1 design and implementation cycle; later Phase-3 work requires separately approved intent."
  technology: "Python 3.12, FastAPI, SQLAlchemy, Alembic, PostgreSQL 16, Pydantic, Jinja/HTMX, and one deployable container; harvest proven change-manager patterns without importing its domain."
  policy_legal: "Devon alone approves exact intent revisions and merges pull requests."
  privacy_security: "No secrets in tracked files; API clients authenticate M2M identities mapped to the Phase-1 registry; human UI trusts only the configured Alobar ID forward-auth boundary; authorization is capability- and transition-specific."
  compatibility: "Core lifecycle and storage remain domain-neutral; package content stays canonical in intent-packages; external systems remain projections."
  quality_accessibility: "Follow portfolio code standards, TDD, explicit invalid-edge and concurrency tests, readable operator UI, and keyboard-usable review actions."
  operational: "Use migrations; run concurrency acceptance against PostgreSQL; expose liveness and database/migration readiness; do not deploy or mutate infrastructure in this package."
  other:
    - "Application code may begin only after Devon approves this exact package revision."
    - "Design specification and task-level implementation plan must be reviewed before implementation."
    - "An adversarial architecture review must challenge the design before implementation."
acceptance:
  - id: AC-001
    condition: "One central transition module declares the complete approved state graph and tests every legal edge plus every invalid source-target pair, including the five named forbidden transitions."
    evidence_type: automated_test
    evidence: "gate: exhaustive state-graph test report from the exact PR revision"
    approver: policy
  - id: AC-002
    condition: "An unapproved Draft work unit cannot become Ready, Claimed, or Executing; dependencies and authority inputs produce explainable ready, blocked, or not-authorized decisions."
    evidence_type: automated_test
    evidence: "gate: readiness, approval, dependency, and authority decision tests pass against PostgreSQL"
    approver: policy
  - id: AC-003
    condition: "Two concurrent workers cannot both acquire one live claim; lease renewal is owner- and attempt-bound; expiry permits one safe reclaim and increments attempt state; maximum attempts are enforced."
    evidence_type: automated_test
    evidence: "gate: PostgreSQL concurrency and deterministic-clock lease tests pass on the exact PR revision"
    approver: policy
  - id: AC-004
    condition: "A worker identity can claim, execute, block, request approval, fail, and submit artifacts/evidence as authorized, but cannot transition a unit to Completed or grant a waiver."
    evidence_type: automated_test
    evidence: "gate: role and transition authorization tests pass for worker, verifier, and human identities"
    approver: policy
  - id: AC-005
    condition: "Every lifecycle transition atomically appends an attributable local event, and failed transactions leave neither a state change nor a transition event."
    evidence_type: automated_test
    evidence: "gate: transaction-bound state/event tests pass, including rollback injection"
    approver: policy
  - id: AC-006
    condition: "Evidence is immutable, correctable only by append-only supersession, and can be associated with package revision, work unit, AC, actor, recorded time, event ID, source revision, evidence type, and payload or stable reference."
    evidence_type: automated_test
    evidence: "gate: evidence constraint, association, immutability, and supersession tests pass"
    approver: policy
  - id: AC-007
    condition: "AC adjudication storage distinguishes passed, failed, waived, and not-applicable; a waiver requires a named human approver, rationale, failed evidence, risk, follow-up, and optional scope/expiry, while workers cannot create it."
    evidence_type: automated_test
    evidence: "gate: adjudication schema and authorization tests pass without implementing verifier decision logic"
    approver: policy
  - id: AC-008
    condition: "A package or work-unit authority expansion invalidates prior readiness until a new human approval is recorded; WS-3.3 same-scope subscription behavior is not implemented."
    evidence_type: automated_test
    evidence: "gate: authority-diff and approval-invalidation tests pass"
    approver: policy
  - id: AC-009
    condition: "API and CLI expose equivalent lifecycle outcomes and error semantics for create/register, ready, claim, start, block, request-approval, approve, submit, verify, review, complete, fail, cancel, evidence, and history operations."
    evidence_type: automated_test
    evidence: "ci: API/CLI contract tests and the Quality workflow pass on the exact PR revision"
    approver: policy
  - id: AC-010
    condition: "Migrations apply from an empty PostgreSQL database, schema-head checks pass, liveness succeeds without a database, and readiness reports database and migration state honestly."
    evidence_type: automated_test
    evidence: "health: migration, schema-head, liveness, and readiness checks pass against an ephemeral PostgreSQL database"
    approver: policy
  - id: AC-011
    condition: "The human GUI supports reviewing units, evidence, dependencies, approvals, adjudication facts, and event history behind the Alobar ID forward-auth contract without exposing M2M-only actions to unauthenticated callers."
    evidence_type: human_review
    evidence: "human: Devon reviews the rendered local UI and authentication/authorization behavior"
    approver: devon
  - id: AC-012
    condition: "The design records explicit decisions for ownership, package storage, leases, evidence correction, waivers, identity mapping, event-store failure safety, UI scope, local database, and deployment target, with WS-3.2–3.4 seams and non-goals preserved."
    evidence_type: human_review
    evidence: "human: Devon approves the written WS-3.1 design after adversarial architecture review"
    approver: devon
  - id: AC-013
    condition: "The repository contains no automatic merge path, no production-infrastructure mutation path, no tracked secret, and no worker capability that declares canonical completion."
    evidence_type: automated_test
    evidence: "scan: security scan, repository search assertions, and final whole-branch architecture review pass"
    approver: policy
  - id: AC-014
    condition: "Devon alone reviews and merges the pull request after the exact named Quality check succeeds; the worker does not merge it."
    evidence_type: human_review
    evidence: "human: Devon confirms the final review and merge decision; merge remains outside worker authority"
    approver: devon
