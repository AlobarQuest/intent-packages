    - "PostgreSQL concurrency tests cannot run."
    - "Any named acceptance criterion lacks realized evidence or an explicit adjudication."
    - "The Quality check is absent, failing, or not tied to the exact PR revision."
    - "A change would create an automatic merge, production mutation, tracker-canonical, worker-completion, or autonomous-approval path."
risk:
  failure_modes:
    - "The orchestrator duplicates mutable intent content and creates two canonical sources."
    - "Claim races or ambiguous expiry permit duplicate execution."
    - "A worker bypasses submission, verification, human approval, or completion authority."
    - "Evidence or waivers can be silently edited, detached, or granted by a worker."
    - "Events are emitted separately from state commits and audit history diverges."
    - "Software-specific assumptions enter the generic lifecycle core."
    - "WS-3.2–3.4 behavior is pulled into WS-3.1 without separate approval."
  max_impact: "Incorrect canonical lifecycle truth could authorize duplicate or unreviewed work; production mutation remains out of scope to cap blast radius."
  stop_conditions:
    - "A baseline repository or required check becomes red for an in-scope reason."
    - "The approved package hash changes without revision and renewed approval."
    - "Atomic claim exclusivity or state/event transactionality cannot be demonstrated on PostgreSQL."
    - "A design requires secrets in tracked files, destructive database action, or live infrastructure mutation."
    - "A worker, CLI, API, CI workflow, or UI path can merge a PR or unilaterally set Completed."
    - "Implementation scope crosses into WS-3.2, WS-3.3, WS-3.4, Phase 4, or Phase 5 without separately approved intent."
  rollback: "Before deployment, revert or abandon WS-3.1 commits and close the draft PR; preserve this package, evidence, and review findings. Database changes are tested only in disposable local databases under this package."
  escalation_target: devon
verification:
  independent_review:
    - "Run an adversarial architecture review of the approved design before implementation."
    - "Review every coherent implementation slice against the approved package and plan."
    - "Run portfolio code review on the whole branch against ~/Developer/code-standards/STANDARDS.md."
    - "Run a final whole-branch security and architecture review before Devon's merge decision."
  non_mechanical:
    - "Whether the package-content ownership boundary avoids dual canonical truth."
    - "Whether lease and failure semantics are operable rather than merely testable."
    - "Whether the UI is the smallest credible human review surface."
    - "Whether later WS-3.2–3.4 seams avoid a schema rewrite without implementing those workstreams early."
follow_up:
