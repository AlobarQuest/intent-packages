    - "Claim expiry, reclaim, or duplicate-execution anomalies"
    - "Schema changes requested by WS-3.2 intake, WS-3.3 protocol, or WS-3.4 event wiring"
  owner: devon
applicable_standards:
  project: "1.0"
  code: "1.0"
  security: "1.0"
