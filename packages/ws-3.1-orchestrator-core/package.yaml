  rollback_plan: "Before deployment, abandon or revert the feature branch and retain the approved intent package. Any later database rollback must use a reviewed forward migration or restore procedure; destructive production rollback is out of scope."
outcome:
  what: "A minimum persistent orchestrator owns canonical, attributable work-unit lifecycle truth through a domain-neutral API, CLI, and small human review surface."
  why: "Phase 3 requires a deterministic control plane between approved intent and execution runtimes, without making workers or external trackers lifecycle authorities."
  beneficiary: "Devon, future factory workers and verifiers, and both software and non-software factory workflows."
  success_signal: "The complete declared work-unit graph, atomic lease behavior, dependency and approval gates, evidence association, API/CLI parity, migrations, health checks, and human-only completion controls pass locally and in the named CI check."
scope:
  included:
    - "Create the new AlobarQuest/orchestrator repository using the proven Flavor-B FastAPI, PostgreSQL, Alembic, single-container, Alobar ID forward-auth, M2M API, Jinja/HTMX review-UI, and CLI shape."
    - "Implement persistent work_packages, work_package_revisions, work_units, dependencies, claims, approvals, evidence, and events models with materially useful database constraints."
    - "Implement the exact canonical work-unit states and legal edges from companion document section 6 in one deterministic transition module, including explicit invalid-edge tests."
    - "Implement atomic, exclusive, expiring, renewable, attempt-aware claims with deterministic clock injection, idempotency rules, stale-claim rejection, lease-expiry reclaim, and bounded attempts."
    - "Enforce that Draft units cannot become Ready without an approved immutable package revision and satisfied dependencies, and that workers can submit evidence but cannot set Completed."
    - "Store immutable evidence associated with package revision, work unit, acceptance criterion, actor, recorded time, event ID, source revision, and structured payload or stable reference."
    - "Represent acceptance-criterion outcomes and human-approved waivers sufficiently for Phase 5 adjudication without implementing Phase 5 verifier decisions."
    - "Represent external dependencies and explain readiness as ready, blocked, or not-authorized from declared dependencies, approval, and authority inputs."
    - "Invalidate readiness when authority expands without a new human approval; defer WS-3.3 same-scope subscription semantics."
    - "Append an attributable local event in the same database transaction as every lifecycle transition, leaving factory-event/v1 publication to WS-3.4."
    - "Provide health and migration checks, API and CLI lifecycle parity, a small approval/review GUI, and documentation covering architecture, local development, operations, and no-auto-merge policy."
  excluded:
    - "WS-3.2 immutable package intake automation and agent-proposed, human-approved work-unit decomposition."
    - "WS-3.3 standing-context preflight, skill-subscription semantics, protocol smoke suite, and status-ledger projection beyond tests strictly needed for WS-3.1 lifecycle behavior."
    - "WS-3.4 factory-event/v1 publication and append-only external event-store integration."
    - "Factory runners, automatic dispatch, GitHub Actions worker execution, independent verifier logic, production deployment automation, and post-deploy observation."
    - "Linear, Todoist, GitHub, or any other tracker becoming canonical lifecycle state."
    - "Automatic merge, autonomous intent approval, autonomous decomposition approval, brain learning, generalized workflow builders, new agent personas, and listing-specific profiles."
    - "Broad changes to change-manager, intent-packages, security-standards, brain, or live infrastructure."
  non_goals:
    - "Copying change-manager domain models or drift authority into the generic orchestrator."
    - "Completing all Phase 3 workstreams in WS-3.1."
    - "Deploying the service or mutating production infrastructure."
  assumptions:
    - "Intent-package YAML in git remains canonical for intent content and its exact-revision approval chain."
    - "The orchestrator stores immutable identity, hash, source reference, approval linkage, and normalized fields required to enforce work-unit lifecycle rules rather than becoming a second editable intent authoring store."
    - "PostgreSQL is the concurrency authority; SQLite is not a valid substitute for claim-concurrency acceptance tests."
    - "Devon remains the only actor authorized to merge pull requests."
  open_questions: []
