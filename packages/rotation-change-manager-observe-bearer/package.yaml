created_at: '2026-10-19T12:06:25Z'
supersedes: null
reach:
- external_system
- live_estate
profile: non-software-operational
profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its
    change-manager adapter, from the rotation-executor VM. The decomposition is the adapter's
    fixed plan: unit mint (mint, stage, host, verify_new, store, verify_consumers), then unit
    retire (verify_consumers, retire_old, confirm_dead), with Devon's completion of the first unit
    between them. Each unit restarts change-manager, so each is claimed only in the live_estate
    window, and a unit that writes waits unclaimed while any registered change-manager reader's
    Healthchecks check shows as started, then asks again before writing and before restarting.
    The executor mints a random bearer itself; host writes M2M_TOKEN_OBSERVE in both Coolify rows
    as the observe entry's new hash with the old hash as previous for seven days, built from the
    old and new values alone, because nothing reports what change-manager loaded. Before it
    writes, it reads the other three change-manager keepers and refuses a value any of them
    holds, since a shared previous stops change-manager booting. It confirms each write by
    probing GET /api/landing-policy (200 for an accepted bearer, 401 for a refused one, beside a
    random bearer), and writes Coolify with the token in Rotation / Coolify, read only while a
    step hosts or retires, and only the application and variable the approved destination names.
    There is no human act: the bearer's one scheduled reader, deploy-watcher, fetches the keeper
    by UUID when it runs hourly, and is verified by its Healthchecks check sds-deploy-watcher; the
    retire unit waits unclaimed until it has run since the keeper's revision. Evidence carries
    fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    change-manager — GET /api/landing-policy as the probe (200 for an accepted bearer, 401 for a
    refused one), behind Cloudflare with a named User-Agent
  - Production Coolify — the change-manager application's M2M_TOKEN_OBSERVE rows and restart
  - >-
    Bitwarden Secrets Manager — this keeper and the other three change-manager keepers in
    Rotation / Keepers, the staging and quarantine secrets in Rotation / Work, and the Coolify
    token in Rotation / Coolify
  - Healthchecks — the started state of every registered change-manager reader's check, and the
    last run of sds-deploy-watcher
  standing: true
  credential_id: change-manager-observe-bearer
  occurrence: '2026-10-19-requested'
  destinations:
  - 'bws-secret uuid="3b9503da-eb7e-401d-b4a7-b4a400c07efb"'
  - 'coolify-env-hash instance="prod" resource_type="application" uuid="re45tafypao3nly3qa9a79dp" key="M2M_TOKEN_OBSERVE" entry="observe"'
  - 'provider name="change-manager"'
  - 'runtime-fetch repo="orchestrator" ref="scripts/run-deploy-watcher.sh"'
outcome:
  what: >-
    The change-manager observe bearer (registry id change-manager-observe-bearer, scope observe,
    variable M2M_TOKEN_OBSERVE) is replaced by a bearer the executor mints, change-manager accepts
    only the new one, and the keeper holds it.
  why: >-
    Its value was set by hand when the scope was created, and it is the first of change-manager's
    four bearers to move to the rotation executor (ADR-0055 increment 6, "The change-manager
    adapter"). It has one hourly reader, so it is the cheapest first run of the adapter before
    the read, propose and full bearers.
  beneficiary: >-
    Devon, whose deploy-watcher lane posts to change-manager with a bearer the executor rotates
    rather than one set by hand.
  success_signal: >-
    Both units complete with each step's evidence filed, the keeper holds a value different from
    the one it started with, the old value probes 401 and the new one 200 beside a refused random
    bearer, change-manager serves with M2M_TOKEN_OBSERVE holding the new hash and no previous, no
    staging or quarantine secret is left in Rotation / Work, and the next security-drift run
    reports no rotation finding for change-manager-observe-bearer.
scope:
  included:
  - The change-manager adapter's two units, worked by the rotation executor.
  excluded:
  - >-
    change-manager's other three bearer variables (M2M_TOKEN, M2M_TOKEN_READ,
    M2M_TOKEN_PROPOSE). The executor writes only M2M_TOKEN_OBSERVE, and reads the other keepers
    only to refuse a shared value.
  - The read, propose and full bearers, each rotated by its own package after this one.
  - Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - Changing which lanes use the observe bearer, or change-manager's scopes.
  assumptions:
  - >-
    The rotation executor's timer is enabled in the VM at a revision carrying the change-manager
    adapter (orchestrator 3e94dc3 or later), with coolify_url and admin_secrets set.
  - >-
    All four change-manager keepers are in Rotation / Keepers, where the broad machine account
    behind BWS_ACCESS_TOKEN_VPS_BACKUP and BWS_ACCESS_TOKEN_INFRA_DRIFT reads each by a direct
    grant and the root reads and writes them, each confirmed with an empty HOME after the move
    (2026-10-19).
  - >-
    The executor reaches production Coolify over the tailnet, whose VPS node key no longer
    expires (2026-10-19).
  open_questions: []
