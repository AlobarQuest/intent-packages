schema_version: 1
package_id: ws-2.2-domain-profiles
title: "WS-2.2 — Domain profiles for intent packages"
revision: 2
status: approved
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-03T00:00:00Z"
supersedes: null
outcome:
  what: "Domain profiles (software-delivery and infrastructure-change) exist that extend the WS-2.1 universal intent-package envelope via profile_fields, without modifying the universal schema."
  why: "The universal envelope is deliberately domain-neutral; profiles add the domain-specific structure and validation each golden path needs, so a software package and an infra-change package can each be authored and mechanically checked."
  beneficiary: "The software factory and Devon — the intent-authoring flow (WS-2.3) and the pilots (WS-2.4) build on these profiles."
  success_signal: "A software-delivery package and an infrastructure-change package each validate under their profile and under the unchanged universal validator (schema_version still 1)."
scope:
  included:
    - "A software-delivery profile (fields + profile validator layered on the universal envelope)."
    - "An infrastructure-change profile (fields + profile validator)."
    - "Profile registration/dispatch so `validate` applies the right profile when a package declares `profile:`."
    - "An evidence-type vocabulary per profile: acceptance-criteria evidence is constrained to producers the stack already has (CI check IDs, code-standards Gate results, security-scan results, health-gate URLs, /code-review verdicts, human review); the profile validator rejects an evidence type no real producer can satisfy."
  excluded:
    - "The real-estate listing-launch profile and any pilot packages (WS-2.4)."
    - "The conversational intent-authoring skill (WS-2.3)."
    - "Any orchestrator / work-unit execution machinery (Phase 3)."
  non_goals:
    - "Modifying the universal envelope or its hash/lifecycle semantics."
    - "Introducing a package database."
  assumptions:
    - "The WS-2.1 universal schema, lifecycle, and CLI are stable and are the base every profile extends."
    - "Profile-specific fields live under the reserved `profile`/`profile_fields` keys the universal validator already tolerates."
  open_questions: []
sources:
  - location: "~/docs/software-delivery-system/2026-07-02-software-factory-master-plan.md (Phase 2, WS-2.2)"
    authority_level: authoritative
    required_version: "2026-07-02"
    trust: trusted_instruction
    sensitivity: internal
  - location: "docs/superpowers/specs/2026-07-03-ws21-intent-package-schema.md (universal envelope this extends)"
    authority_level: authoritative
    required_version: "2026-07-03"
    trust: trusted_instruction
    sensitivity: internal
  - location: "~/docs/software-delivery-system/2026-06-30-foundation-intent-orchestration-architecture.md §4 (profile model)"
    authority_level: supporting
    required_version: "2026-06-30"
    trust: trusted_instruction
    sensitivity: internal
constraints:
  time_budget: null
  technology: "Python 3.12+, zero-install PYTHONPATH module; extend the WS-2.1 validator, do not fork it."
  policy_legal: "Follow the portfolio code/security/project standards; reference registry capability terms, never invent a parallel vocabulary."
  privacy_security: "No secrets in tracked files (BWS write-guard)."
  compatibility: "Profiles must not change any universal-envelope field, enum, or hash input — the universal package must validate identically before and after."
  quality_accessibility: null
  operational: "Profile validation runs inside the existing `validate` CLI + CI gate."
  other:
    - "A package with no `profile` declared must continue to validate under the universal envelope alone."
acceptance:
  - id: AC-001
    condition: "The software-delivery and infrastructure-change profiles each validate their own example package with no errors."
    evidence_type: automated_test
    evidence: "pytest for each profile's validator passes on a valid example package under that profile."
    approver: policy
  - id: AC-002
    condition: "The universal envelope is unchanged: schema_version remains 1 and an existing universal-only package validates byte-identically to before WS-2.2."
    evidence_type: automated_test
    evidence: "The WS-2.1 universal validation test-suite still passes unmodified; a universal-only package's hash is unchanged."
    approver: policy
  - id: AC-003
    condition: "Profiles are domain-neutral additions: a package declaring `profile: software-delivery` gets software-specific checks, while one declaring no profile is unaffected."
    evidence_type: human_review
    evidence: "Devon reviews the two profiles and confirms no software/infra assumption leaked into the universal envelope."
    approver: devon
  - id: AC-004
    condition: "Each profile constrains acceptance-criteria evidence to a vocabulary of producers the stack actually has (CI check IDs, code-standards Gate results, security-scan results, health-gate URLs, /code-review verdicts, human review), and the profile validator rejects an evidence type no real producer can satisfy."
    evidence_type: automated_test
    evidence: "A profile-validator test asserts a valid producer-backed evidence type passes and an evidence type with no real producer is rejected with an actionable error."
    approver: policy
