    - "A profile leaks a domain assumption into the universal envelope, breaking domain-neutrality."
    - "Profile validation diverges from the universal validator's error/actionability conventions."
  max_impact: "Rework of the profile layer; the universal envelope stays intact (compatibility constraint prevents envelope damage)."
  stop_conditions:
