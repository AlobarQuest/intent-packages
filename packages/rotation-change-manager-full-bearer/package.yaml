created_at: '2026-10-23T13:00:00Z'
supersedes: null
reach:
- external_system
- live_estate
profile: non-software-operational
profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its change-
    manager-attested adapter, from the rotation-executor VM. The decomposition is the adapter's
    fixed plan: unit mint (mint, stage, host, verify_new, store, verify_consumers), then a human
    act in which Devon attests drift-audit.sh's switch at /review with the new value's fingerprint,
    then unit retire (verify_consumers, retire_old, confirm_dead), with Devon's completion of the
    first unit between them. Each unit restarts change-manager, so each is claimed only in the
    live_estate window, and a unit that writes waits unclaimed while any registered change-manager
    reader's Healthchecks check shows as started, then asks again before writing and before
    restarting. The executor mints a random bearer itself; host writes M2M_TOKEN in both Coolify
    rows as the full entry's new hash with the old hash as previous for seven days, built from the
    old and new values alone, because nothing reports what change-manager loaded. Before it writes,
    it reads the other three change-manager keepers and refuses a value any of them holds, since a
    shared previous stops change-manager booting. It confirms each write by probing GET
    /api/landing-policy (200 for an accepted bearer, 401 for a refused one, beside a random
    bearer), and writes Coolify with the token in Rotation / Coolify, read only while a step hosts
    or retires, and only the application and variable the approved destination names. The
    bearer's three scheduled readers fetch the keeper by UUID when they run. Two are verified by
    their Healthchecks checks (change-window.sh, 04:00, check Change Manager OPs Check;
    factory-events-nightly.sh, 03:30, check factory-events), and the retire unit waits unclaimed
    until each has run since the keeper's revision. The third, drift-audit.sh (03:00), only logs a
    warning when its change-manager calls fail and pings success either way, so no read shows it
    switched: Devon attests it (ADR-0055 amendment 9, "The change-manager adapter", item 1).
    Evidence carries fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    change-manager — GET /api/landing-policy as the probe (200 for an accepted bearer, 401 for a
    refused one), behind Cloudflare with a named User-Agent
  - Production Coolify — the change-manager application's M2M_TOKEN rows and restart
  - >-
    Bitwarden Secrets Manager — this keeper and the other three change-manager keepers in
    Rotation / Keepers, the staging and quarantine secrets in Rotation / Work, and the Coolify
    token in Rotation / Coolify
  - Healthchecks — the started state of every registered change-manager reader's check, and the
    last runs of Change Manager OPs Check and factory-events
  standing: true
  credential_id: change-manager-full-bearer
  occurrence: '2026-10-23-requested'
  destinations:
  - 'bws-secret uuid="af0e4192-edc6-46ae-9e4f-b469011dbb8d"'
  - 'coolify-env-hash instance="prod" resource_type="application" uuid="re45tafypao3nly3qa9a79dp" key="M2M_TOKEN" entry="full"'
  - 'provider name="change-manager"'
  - 'runtime-fetch repo="infraops-mcp-server" ref="scripts/change-window.sh"'
  - 'runtime-fetch repo="infraops-mcp-server" ref="scripts/drift-audit.sh"'
  - 'runtime-fetch repo="security-standards" ref="scripts/factory-events-nightly.sh"'
outcome:
  what: >-
    The change-manager full bearer (registry id change-manager-full-bearer, scope full, variable
    M2M_TOKEN) is replaced by a bearer the executor mints, change-manager accepts only the new
    one, and the keeper holds it.
  why: >-
    It is the last of change-manager's four bearers on the rotation executor, after the observe,
    read and propose bearers (ADR-0055 increment 6). Its value was set by hand when change-manager
    was deployed.
  beneficiary: >-
    Devon, whose change window, nightly drift audit and factory-events run call change-manager
    with a bearer the executor rotates rather than one set by hand.
  success_signal: >-
    Both units complete with each step's evidence filed, Devon's attestation resolves the human
    act, the keeper holds a value different from the one it started with, the old value probes
    401 and the new one 200 beside a refused random bearer, change-manager serves with M2M_TOKEN
    holding the new hash and no previous, no staging or quarantine secret is left in Rotation /
    Work, and the next security-drift run reports no rotation finding for
    change-manager-full-bearer.
scope:
  included:
  - The change-manager-attested adapter's two units and its one human act.
  excluded:
  - >-
    change-manager's other three bearer variables (M2M_TOKEN_OBSERVE, M2M_TOKEN_PROPOSE,
    M2M_TOKEN_READ). The executor writes only M2M_TOKEN, and reads the other keepers only to
    refuse a shared value.
  - The observe, read and propose bearers, each rotated by its own package.
  - Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - >-
    Changing which lanes use the full bearer, change-manager's scopes, or drift-audit.sh's
    handling of a failed change-manager call.
  assumptions:
  - >-
    The rotation executor's timer is enabled in the VM at a revision carrying the change-manager
    adapter (orchestrator 3e94dc3 or later), with coolify_url and admin_secrets set.
  - >-
    All four change-manager keepers are in Rotation / Keepers, where the broad machine account
    behind BWS_ACCESS_TOKEN_VPS_BACKUP and BWS_ACCESS_TOKEN_INFRA_DRIFT reads each by a direct
    grant and the root reads and writes them, each confirmed with an empty HOME after the move
    (2026-10-19).
  - >-
    factory-events fetches the keeper from BWS on each run, so no static copy of the full bearer
    is left in ~/.factory/env (ADR-0055 amendment 9, item 2).
  open_questions: []
