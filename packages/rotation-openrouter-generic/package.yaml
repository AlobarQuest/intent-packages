schema_version: 1
package_id: rotation-openrouter-generic
title: Standing rotation of the generic OpenRouter API key (openrouter-generic)
revision: 3
status: approved
created_by: factory-create
owner: devon
created_at: '2026-10-07T12:42:59Z'
supersedes: null
reach:
- external_system
profile: non-software-operational
profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its
    openrouter adapter, from the rotation-executor VM. The decomposition is the adapter's fixed
    plan: unit mint (mint, stage, verify_new, store, verify_consumers), then unit retire
    (verify_consumers, retire_old, confirm_dead), with Devon's completion of the first unit
    between them. There is no human act: the keeper is the credential's only consumer, and the
    executor reads it back. The executor checks each unit against git before claiming it and
    works every step through its contract, which holds ADR-0055 decision 3's invariants. It
    mints with the OpenRouter management key, which it reads from Rotation / Admin only while a
    step mints or revokes; every minted key carries a $5 credit limit and an expiry 400
    days out. Evidence carries fingerprints, probe status codes and notes only.
  external_systems:
  - OpenRouter — the management API that mints and deletes keys, key-info, and a zero-cost chat
    completion on a :free model as the probe
  - Bitwarden Secrets Manager — the keeper in Rotation / Keepers, the staging and quarantine
    secrets in Rotation / Work, and the management key in Rotation / Admin
  standing: true
  credential_id: openrouter-generic
  occurrence: '2026-10-12-requested'
  destinations:
  - 'bws-secret uuid="9661da8f-ac66-4e97-a31f-b42500bb849c"'
  - 'provider name="openrouter"'
outcome:
  what: >-
    The generic OpenRouter API key (registry id openrouter-generic, class openrouter-key) is
    replaced by a key the executor mints, and the old key is deleted at OpenRouter and proven
    dead. The keeper, the key's only stored copy, holds the new key.
  why: >-
    ADR-0055 increment 5 rotates the first real credential through the executor, with every gate
    clicked. This credential goes first because its only consumer is its keeper, so rotating it
    redeploys nothing and no person has to attest a consumer.
  beneficiary: >-
    Devon, whose OpenRouter key stops resting on a key older than the rotation policy wants; and
    every later rotation, which inherits a real provider path proven on production.
  success_signal: >-
    Both units complete with each step's evidence filed, the keeper holds a key different from
    the one it started with, the old key probes dead and the new one live beside a refused
    malformed key, no staging or quarantine secret is left in Rotation / Work, and the next
    security-drift run reports no rotation finding for openrouter-generic.
scope:
  included:
  - The openrouter adapter's two units, worked by the rotation executor.
  excluded:
  - >-
    BRAIN_OPENROUTER_API_KEY, the brains' separate OpenRouter key: its values in brain-app and
    brain-open were shown by hash to be a different key. It is its own credential.
  - Any hosted consumer; the inventory found none.
  - Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - Changing what uses OpenRouter; nothing on the Mac reads the key after increment 5.
  assumptions:
  - The rotation executor's timer is enabled in the VM at a revision carrying the adapter.
  - The executor's root reads Rotation / Admin and writes Rotation / Keepers (ADR-0055 amendment 6).
  open_questions: []
sources:
- location: >-
    orchestrator docs/decisions/0055-credential-rotation-runs-in-a-pull-based-executor.md,
    amendment 1 (the OpenRouter provider facts) and the per-class table as amended for
    increment 5 (the executor retires today's key).
  authority_level: authoritative
  required_version: '2026-10-12'
  trust: trusted_instruction
  sensitivity: internal
- location: >-
    orchestrator docs/superpowers/plans/2026-10-12-rotation-increment-5-openrouter-handoff.md
  authority_level: authoritative
  required_version: '2026-10-12'
  trust: trusted_instruction
  sensitivity: internal
- location: >-
    infraops-mcp-server .cred-consumers.toml, credential openrouter-generic: its consumer
    inventory of 2026-10-12, with the keeper as its only consumer.
  authority_level: authoritative
  required_version: '2026-10-12'
  trust: trusted_instruction
  sensitivity: internal
constraints:
  time_budget: One session.
  technology: The rotation executor at the orchestrator revision installed in the VM.
  policy_legal: null
  privacy_security: >-
    No key value, label or hash appears in a transcript, a tool argument, a log or evidence. Keys
    are identified by sha256 prefix and length only; a key's console label carries characters of
    the key.
  compatibility: null
  quality_accessibility: null
  operational: >-
    Every unit sets touches_no_hosted_service, so a claim asks no live_estate change window.
  other: []

# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: >-
    A new key is minted with the management key, carrying its credit limit and expiry, and its
    fingerprint differs from the keeper's current value.
  evidence_type: external_attestation
  evidence: >-
    external: the mint step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-002
  condition: >-
    The new key is staged in Rotation / Work.
  evidence_type: external_attestation
  evidence: >-
    external: the stage step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-003
  condition: >-
    The new key answers 200 to a zero-cost completion, beside a malformed key refused 401 by the
    same probe.
  evidence_type: external_attestation
  evidence: >-
    external: the verify_new step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-004
  condition: >-
    The old key is quarantined in Rotation / Work and the keeper reads back the new key.
  evidence_type: external_attestation
  evidence: >-
    external: the store step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-005
  condition: >-
    Every destination holds the new key: the keeper reads it back.
  evidence_type: external_attestation
  evidence: >-
    external: the mint unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-006
  condition: >-
    Every destination still holds the new key, re-read before anything is revoked.
  evidence_type: external_attestation
  evidence: >-
    external: the retire unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-007
  condition: >-
    The old key answered 200 at key-info beside a refused malformed key, and the provider
    confirmed the id derived from it before deleting it.
  evidence_type: external_attestation
  evidence: >-
    external: the retire_old step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-008
  condition: >-
    The old key is refused and the new one answers 200 to a zero-cost completion, each beside a
    refused malformed key, and the staging and quarantine secrets are deleted.
  evidence_type: external_attestation
  evidence: >-
    external: the confirm_dead step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
authority:
  allowed:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  requires_approval: []
  prohibited:
  - repository_write
  - infra_mutation
  - outward_publish
  - email_send
  budgets:
    max_attempts: 3
    max_llm_calls: null
deliverables:
  artifacts:
  - A rotated key in the keeper, and terminal work units carrying each step's evidence.
  destination: the production ledger
  recipient: devon
  definition_of_done: >-
    Both units are completed, every acceptance criterion carries evidence and an adjudication,
    and security-drift reports no rotation finding for openrouter-generic.
  operator_responsibilities:
  - Devon approves this revision, the change record, the decomposition, and each /review gate.
dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0055 and Devon's increment 5 decisions of 2026-10-12: the executor retires today's key,
    a $5 limit and a 400-day expiry, and the shell export dropped.
  required_people_systems:
  - The rotation executor in the rotation-executor VM
  - OpenRouter
  - Bitwarden Secrets Manager
  required_capabilities:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  blocking_conditions:
  - The executor refuses a unit at its checks; the refusal names the reason.
risk:
  failure_modes:
  - >-
    A contract refusal fails a unit partway; the executor resumes from BWS on a retry after a
    requeue.
  - >-
    No :free model answers a probe determinately, so the step stops as indeterminate; requeue it
    later.
  - >-
    A mint whose staging fails leaves a weak orphan key at OpenRouter ($5 limit, 400-day expiry);
    delete it at the console.
  max_impact: >-
    Loss of the stored OpenRouter key until the next attempt. Nothing reads the key but its
    keeper, so no service is affected.
  stop_conditions:
  - A value appears anywhere it should not.
  rollback: >-
    Before retire_old nothing is undone: both keys are live and the old one is held in the
    quarantine secret. After retire_old the recovery is forward: run the rotation again.
  escalation_target: devon
verification:
  independent_review:
  - Devon adjudicates each criterion against its evidence at /review.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of openrouter-generic, which arrives as a new revision.
  signals: []
  owner: devon
applicable_standards:
  project: '1.0'
  security: '1.0'
