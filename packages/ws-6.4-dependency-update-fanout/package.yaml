    - "Devon approval to enable production dispatch for the dependency-update change class, kill-switch-verified first."
    - "Devon decision on the standing dispatch posture for the change class after the fan-out completes."
  required_people_systems:
    - "Devon for package approval, decomposition approval, per-unit authority approval, dispatch enablement, pull-request review, and merge"
    - "The orchestrator at sds.alobar.net as canonical lifecycle owner"
    - "AlobarQuest/factory-runner as the WS-4.1 worker, invoked by workflow_dispatch"
    - "The Alobar SDS Dispatch GitHub App, installed on exactly the six target repositories"
    - "GitHub Actions for each repository's named checks"
    - "Alobar ID forward-auth for every human action"
  required_capabilities:
    - repository_read
    - repository_write
    - test_execution
    - pr_open
    - event_emit
  blocking_conditions:
    - "This exact package revision is not approved and chain-verified."
    - "The orchestrator running in production cannot mint a GitHub App installation token."
    - "The kill switch has not been observed blocking a dispatch on live production."
    - "Devon has not explicitly approved enabling production dispatch for the change class."
    - "Any work unit lacks its own named human authority approval."
    - "Any work unit's conformance was hand-typed, or its accepted_standards echoes its standards_touched."
    - "A work unit was created through the direct revision path rather than the decomposition path."
    - "Any path exists by which a worker, agent, workflow, or the orchestrator could merge a pull request."
risk:
  failure_modes:
    - "A unit is dispatched to the wrong repository, opening a dependency pull request against a repository it was not authorized for."
    - "Batch approval is introduced to reduce the friction of N named authority approvals, collapsing the per-unit human gate."
    - "Conformance is hand-typed or accepted_standards echoes standards_touched, turning the admission gate into a tautology that admits everything."
    - "Dispatch is enabled for more than the single approved change class, or for an empty or wildcard target-repository allowlist."
    - "The kill switch is enabled before it has been observed blocking anything, so the guardrail is asserted rather than proven."
    - "A dependency pull request is merged by automation, or a GitHub App permission grants a merge path."
    - "Six concurrent pull requests collide with in-flight work in busy repositories."
  max_impact: "Six unwanted pull requests that Devon closes. Dispatch cannot merge, cannot mutate production infrastructure, cannot write secrets, and is bounded to one capability, one change class, and an explicit repository allowlist."
  stop_conditions:
    - "The canary's guardrail observations do not match the expected admission, routing, idempotency, or circuit-breaker behavior."
    - "Any dispatch record names a repository other than its unit's own constraints.target_repository."
    - "A work unit reaches a dispatchable state without a named human authority approval."
    - "The approved package hash changes without a new revision and renewed approval."
    - "Any change would create an automatic merge, automatic Brain approval, tracker canonicalization, graduation automation, or automatic follow-up generation."
  rollback: "Disable dispatch by unsetting ORCHESTRATOR_DISPATCH_ENABLED and restarting; close any unwanted pull requests; cancel the affected work units. Dispatch mutates only the six target repositories' branches, never their default branch, and never production infrastructure."
  escalation_target: devon
verification:
  independent_review:
    - "The WS-5.1 verifier adjudicates each unit's evidence independently of the worker that produced it."
    - "Each target repository's own named checks gate its own pull request."
    - "Devon reviews each pull request before merging it."
  non_mechanical:
    - "Whether the canary's guardrail observations are strong enough to justify dispatching the remaining five."
    - "Whether each dependency update is desirable in that repository right now, which is a judgment the checks cannot make."
    - "Whether the friction of N named authority approvals is the correct price for the per-unit human gate, or a signal that the fan-out is too wide."
follow_up:
  required: true
  revisit_when: "After the sixth pull request is merged or explicitly closed, and before the Phase 6 exit checklist is written."
  signals:
    - "A named human authority approval was felt to be a formality rather than a decision"
    - "A dependency update needed judgment that no acceptance criterion represented"
    - "The dispatch guardrails behaved differently in production than in their tests"
    - "The standing dispatch posture decision proves difficult to reverse"
  owner: devon
applicable_standards:
  project: "1.0"
  code: "1.0"
  security: "1.0"
