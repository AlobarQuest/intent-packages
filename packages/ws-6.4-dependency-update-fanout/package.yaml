outcome:
  what: "Re-prove the six repositories sequentially under the repaired dependency-update authority contract. Revision 7 realizes only the AC-003 target: one Security Standards work unit updates the ruff pinned dependency from 0.15.21 to 0.15.22 at both pyproject.toml pin sites (dependency-groups.dev and optional-dependencies.dev), regenerates uv.lock, opens one pull request, and proves the named check green while Devon retains every approval and merge decision."
  why: "Historical 6/6 completion labels are not lifecycle or evidence authority. Each repository must be separately re-proven under the repaired, fingerprinted mutation_commands contract before its acceptance criterion can be treated as realized."
  beneficiary: "Devon gets a bounded, reviewable proof that the repaired factory path works on a uv repository whose dependency is pinned across multiple jointly-resolved sections (Security Standards) before the remaining unproven repositories are attempted."
  success_signal: "Exactly one AC-003 Security Standards unit is created from a Devon-approved revision and decomposition; its approved authority envelope permits only the exact preflight-proven command sequence, moving every ruff pin site so the lockfile stays satisfiable; its pull request's named check reports the repository's full gate green on the exact head; the WS-5.1 verifier adjudicates the evidence; and no agent, workflow, API, CLI, or orchestrator path approves in batch or merges anything."
scope:
  included:
    - "Author and approve this intent package before any work unit is created."
    - "Treat all historical 6/6 completion claims as non-authoritative; revision 4 proved AC-006 for Change Manager, revision 5 proved AC-001 for Orchestrator, and revision 6 proved AC-002 for Brain. Revision 7 maps only AC-003 to Security Standards while AC-004, AC-005, and AC-007..AC-011 remain retained and incomplete."
    - "Before authoring the Security Standards authority envelope, prove it against the real target repository: confirm a real dependency upgrade is available (ruff 0.15.21 to 0.15.22), confirm the ordered allowed_commands mutator yields a real diff on the target's pyproject.toml and uv.lock, confirm the mutator is idempotent under a second execution, and confirm every ruff pin site moves (the pin is dual-site: dependency-groups.dev and optional-dependencies.dev) so no jointly-resolved section is left behind and the lockfile stays satisfiable."
    - "Create exactly one Draft Security Standards work unit through the WS-3.2 decomposition path, so that the unit is stamped with its own constraints.work_unit_id."
    - "Authorize the complete Security Standards outcome with target_repository AlobarQuest/security-standards, change_class dependency-update, required_capability repo.edit, allowed_commands ordered as the two frozen mutators uv add --frozen --dev 'ruff>=0.15.22' then uv add --frozen --optional dev 'ruff>=0.15.22' then uv lock then the verifier uv lock --check, and mutation_commands containing the two frozen uv add mutators and uv lock."
    - "Attest conformance for the Security Standards unit from the target repository's real state via security_scan.cli.scan and portfolio.compliance.build_rows."
    - "Record one named human authority approval bound to the Security Standards unit's own authority fingerprint."
    - "Prove the WS-4.2 kill switch blocks the Security Standards unit on live production before the revision-7 target scope is enabled."
    - "Replace the previous Brain-only production target scope with the single target AlobarQuest/security-standards, while retaining only change class dependency-update and capability repo.edit, after Devon's explicit approval."
    - "Dispatch Security Standards once and observe admission, target routing, idempotency, and failure-signature circuit-breaker behavior."
    - "Let factory-runner open one Security Standards pull request that updates pyproject.toml and uv.lock and runs the named check."
    - "Submit AC-003 evidence and let the WS-5.1 verifier adjudicate it."
    - "Record the Security Standards dispatch identifier, pull-request URL, exact-head named-check result, verifier outcome, and guardrail observations without projecting them onto the retained acceptance criteria."
  excluded:
    - "Any automatic merge, or any worker, agent, API, CLI, CI, or orchestrator path that merges a pull request."
    - "Any automatic Brain approval or knowledge promotion."
    - "Tracker canonicalization: no Linear, Todoist, or GitHub state becomes canonical lifecycle state."
    - "Graduation automation beyond the one Devon-approved change-class enablement."
    - "Automatic follow-up generation from this package's follow_up block."
    - "New observation collectors."
    - "Validation-harness work or any new validation machinery."
    - "Batch approval of work-unit authority, which would collapse N named human approvals into one."
    - "Any further authority-envelope contract expansion not already approved and merged as part of the coordinated mutation_commands contract revision."
    - "Dependency updates in AlobarQuest/factory-runner itself, which has no dependabot configuration and is excluded from the target set."
  non_goals:
    - "Proving that dependency updates are correct; the repositories' own checks and Devon's review decide that."
    - "Making dispatch automation permanent; the standing posture after this fan-out is a separate Devon decision."
    - "Extending the fan-out beyond the change class dependency-update."
    - "Building queueing, batching, or scheduling machinery for fan-out units."
  assumptions:
    - "The orchestrator authenticates to GitHub as the Alobar SDS Dispatch app, installed on Security Standards, minting hourly installation tokens."
    - "Security Standards hosts the reviewed caller workflow .github/workflows/factory-runner-pilot.yml on its default branch and carries the required Actions secret names (FACTORY_RUNNER_TOKEN, FACTORY_RUNNER_CREDENTIAL_KEY_ID, ANTHROPIC_API_KEY, FACTORY_PR_TOKEN); factory-runner's active reusable workflow at main installs and runs the factory-runner console script. This is verified against Security Standards before dispatch enablement."
    - "AlobarQuest/factory-runner is public, so a caller's GITHUB_TOKEN can install it, and its reusable workflow invokes the installed console script rather than a repository-local script."
    - "Current Security Standards conformance will be computed from live repository state before proposal; no status or accepted_standards value is carried forward from historical evidence."
    - "Devon alone approves this package revision, approves the decomposition, approves each work unit's authority, approves enabling dispatch, and merges every pull request."
  open_questions: []
