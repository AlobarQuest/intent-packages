risk:
  failure_modes:
    - "A unit is dispatched to the wrong repository, opening a dependency pull request against a repository it was not authorized for."
    - "Batch approval is introduced to reduce the friction of sequential named authority approvals, collapsing the per-unit human gate."
    - "Conformance is hand-typed or accepted_standards echoes standards_touched, turning the admission gate into a tautology that admits everything."
    - "Dispatch is enabled for more than dependency-update and repo.edit, or for any target other than AlobarQuest/brain."
    - "The kill switch is enabled before it has been observed blocking anything, so the guardrail is asserted rather than proven."
    - "A dependency pull request is merged by automation, or a GitHub App permission grants a merge path."
    - "The Brain pull request collides with in-flight work in that repository."
    - "An authority envelope is authored that cannot accomplish its own outcome, so a well-behaved agent obeys its authority, changes nothing, exits successfully, and the run dies at the change-detection guard, consuming a package revision and every named human approval bound to it."
    - "An envelope command that succeeds in the coding phase fails when factory-runner re-executes the ordered list at finalize, so the unit can never open a pull request no matter how many attempts it is granted."
    - "A retired or mis-authored work unit is left in a state from which no actor can retire it, and is later dispatched by an operator who mistook it for its corrected replacement."
  max_impact: "One unwanted Brain pull request that Devon closes. Dispatch cannot merge, cannot mutate production infrastructure, cannot write secrets, and is bounded to repo.edit, dependency-update, and AlobarQuest/brain."
  stop_conditions:
    - "Routine local invocation mistakes are recoverable after refreshing state and proving they did not mutate factory state."
    - "Stop when the factory process behaves incorrectly, including admission, routing, idempotency, circuit-breaker, command-enforcement, result-classification, evidence, or lifecycle behavior that differs from the approved contract."
    - "The Brain dispatch record names any repository other than AlobarQuest/brain."
    - "A work unit reaches a dispatchable state without a named human authority approval."
    - "The approved package hash changes without a new revision and renewed approval."
    - "Any change would create an automatic merge, automatic Brain approval, tracker canonicalization, graduation automation, or automatic follow-up generation."
  rollback: "Disable dispatch by unsetting ORCHESTRATOR_DISPATCH_ENABLED and restarting; close the unwanted Brain pull request; cancel the affected work unit. Revision-6 dispatch mutates only a Brain feature branch, never its default branch, and never production infrastructure."
  escalation_target: devon
verification:
  independent_review:
    - "The WS-5.1 verifier adjudicates each unit's evidence independently of the worker that produced it."
    - "Each target repository's own named checks gate its own pull request."
    - "Devon reviews each pull request before merging it."
  non_mechanical:
    - "Whether the Brain guardrail observations are strong enough to justify treating AC-002 as realized."
    - "Whether the Brain dependency update is desirable right now, which is a judgment the checks cannot make."
    - "Whether the friction of sequential named authority approvals is the correct price for the per-unit human gate."
follow_up:
  required: true
  revisit_when: "After the Brain pull request is merged or explicitly closed and AC-002 is adjudicated, before selecting the next unproven repository proof."
  signals:
    - "A named human authority approval was felt to be a formality rather than a decision"
    - "A dependency update needed judgment that no acceptance criterion represented"
    - "The dispatch guardrails behaved differently in production than in their tests"
    - "The standing dispatch posture decision proves difficult to reverse"
  owner: devon
applicable_standards:
  project: "1.0"
  code: "1.0"
  security: "1.0"
