outcome:
  what: "Re-prove the six repositories sequentially under the repaired dependency-update authority contract. Revision 6 realizes only the AC-002 target: one Brain work unit updates the fastapi pinned dependency from 0.139.0 to 0.139.2 in requirements.txt, opens one pull request, and proves the named Quality check green while Devon retains every approval and merge decision."
  why: "Historical 6/6 completion labels are not lifecycle or evidence authority. Each repository must be separately re-proven under the repaired, fingerprinted mutation_commands contract before its acceptance criterion can be treated as realized."
  beneficiary: "Devon gets a bounded, reviewable proof that the repaired factory path works on a pip/requirements.txt repository (Brain) before the remaining unproven repositories are attempted."
  success_signal: "Exactly one AC-002 Brain unit is created from a Devon-approved revision and decomposition; its approved authority envelope permits only the exact preflight-proven command sequence; its pull request's named Quality check reports the repository's full gate green on the exact head; the WS-5.1 verifier adjudicates the evidence; and no agent, workflow, API, CLI, or orchestrator path approves in batch or merges anything."
scope:
  included:
    - "Author and approve this intent package before any work unit is created."
    - "Treat all historical 6/6 completion claims as non-authoritative; revision 4 proved only AC-006 for Change Manager, revision 5 proved AC-001 for Orchestrator, and revision 6 maps only AC-002 to Brain while AC-003..AC-005 and AC-007..AC-011 remain retained and incomplete."
    - "Before authoring the Brain authority envelope, prove it against the real target repository: confirm a real dependency upgrade is available (fastapi 0.139.0 to 0.139.2), confirm the ordered allowed_commands mutator yields a real diff on the target's requirements.txt, confirm the mutator is idempotent under a second execution, and confirm the pin is single-site so no lockfile or dev-requirements site is left behind."
    - "Create exactly one Draft Brain work unit through the WS-3.2 decomposition path, so that the unit is stamped with its own constraints.work_unit_id."
    - "Authorize the complete Brain outcome with target_repository AlobarQuest/brain, change_class dependency-update, required_capability repo.edit, allowed_commands ordered as the sed mutator sed -i 's/^fastapi==0.139.0$/fastapi==0.139.2/' requirements.txt then the assertion grep -qx 'fastapi==0.139.2' requirements.txt, and mutation_commands containing only that sed mutator."
    - "Attest conformance for the Brain unit from the target repository's real state via security_scan.cli.scan and portfolio.compliance.build_rows."
    - "Record one named human authority approval bound to the Brain unit's own authority fingerprint."
    - "Prove the WS-4.2 kill switch blocks the Brain unit on live production before the revision-6 target scope is enabled."
    - "Replace the previous Orchestrator-only production target scope with the single target AlobarQuest/brain, while retaining only change class dependency-update and capability repo.edit, after Devon's explicit approval."
    - "Dispatch Brain once and observe admission, target routing, idempotency, and failure-signature circuit-breaker behavior."
    - "Let factory-runner open one Brain pull request that updates requirements.txt and runs the named Quality check."
    - "Submit AC-002 evidence and let the WS-5.1 verifier adjudicate it."
    - "Record the Brain dispatch identifier, pull-request URL, exact-head Quality result, verifier outcome, and guardrail observations without projecting them onto the retained acceptance criteria."
  excluded:
    - "Any automatic merge, or any worker, agent, API, CLI, CI, or orchestrator path that merges a pull request."
    - "Any automatic Brain approval or knowledge promotion."
    - "Tracker canonicalization: no Linear, Todoist, or GitHub state becomes canonical lifecycle state."
    - "Graduation automation beyond the one Devon-approved change-class enablement."
    - "Automatic follow-up generation from this package's follow_up block."
    - "New observation collectors."
    - "Validation-harness work or any new validation machinery."
    - "Batch approval of work-unit authority, which would collapse N named human approvals into one."
    - "Any further authority-envelope contract expansion not already approved and merged as part of the coordinated mutation_commands contract revision."
    - "Dependency updates in AlobarQuest/factory-runner itself, which has no dependabot configuration and is excluded from the target set."
  non_goals:
    - "Proving that dependency updates are correct; the repositories' own checks and Devon's review decide that."
    - "Making dispatch automation permanent; the standing posture after this fan-out is a separate Devon decision."
    - "Extending the fan-out beyond the change class dependency-update."
    - "Building queueing, batching, or scheduling machinery for fan-out units."
  assumptions:
    - "The orchestrator authenticates to GitHub as the Alobar SDS Dispatch app, installed on Brain, minting hourly installation tokens."
    - "Brain hosts the reviewed caller workflow .github/workflows/factory-runner-pilot.yml on its default branch and carries the required Actions secret names; factory-runner's active reusable workflow installs and verifies implementation commit 5ac7981dfd8be17e74d7a62c7a677c089a48ba3a. This is verified against Brain before dispatch enablement."
    - "AlobarQuest/factory-runner is public, so a caller's GITHUB_TOKEN can install it, and its reusable workflow invokes the installed console script rather than a repository-local script."
    - "Current Brain conformance will be computed from live repository state before proposal; no status or accepted_standards value is carried forward from historical evidence."
    - "Devon alone approves this package revision, approves the decomposition, approves each work unit's authority, approves enabling dispatch, and merges every pull request."
  open_questions: []
