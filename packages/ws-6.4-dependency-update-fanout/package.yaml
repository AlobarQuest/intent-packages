    - spend_money
    - calendar_write
    - third_party_contact
    - data_delete
    - external_system_write
  budgets:
    max_attempts: 3
    max_llm_calls: 4
deliverables:
  artifacts:
    - "Six Draft work units, one per target repository, created from one approved decomposition proposal"
    - "Six pull requests opened by factory-runner, one per target repository"
    - "Six dispatch records, plus the kill-switch skipped record that precedes them"
    - "Verifier adjudications for each unit"
    - "A Phase 6 exit checklist closing both exit criteria, with dates, commits, image tags and digests, migration heads, and record identifiers"
  destination: "The six target repositories receive the pull requests; the lifecycle records live in the orchestrator at sds.alobar.net; this governing package remains in AlobarQuest/intent-packages."
  recipient: devon
  definition_of_done: "All acceptance criteria have realized evidence and explicit adjudication, every pull request is merged by Devon or explicitly closed by him, the Phase 6 exit checklist exists, and no permanent gate was weakened anywhere."
  operator_responsibilities:
    - "Approve or reject this exact intent revision and hash."
    - "Approve the decomposition proposal that creates the six Draft work units."
    - "Approve each work unit's authority envelope by its own fingerprint."
    - "Approve enabling production dispatch for the single dependency-update change class."
    - "Review and merge each pull request personally."
    - "Decide the standing dispatch posture for the change class after the fan-out."
