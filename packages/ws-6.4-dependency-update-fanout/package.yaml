schema_version: 1
package_id: ws-6.4-dependency-update-fanout
title: "WS-6.4 — one systemic dependency update fans out across six repositories, autonomously up to the merge gate"
revision: 1
status: approved
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-09T21:57:24Z"
supersedes: null
outcome:
  what: "A single approved systemic intent produces one Draft work unit per target repository, each dispatched to factory-runner, each opening a pull request that updates that repository's pinned dependencies and proves its checks green, with Devon merging every pull request personally."
  why: "Phase 6 exit criterion 2 requires that one systemic event fan out across at least five repositories autonomously up to the merge gate. This is the flagship proof that intent, decomposition, per-unit authority, bounded dispatch, and independent verification compose into a factory rather than a demo."
  beneficiary: "Devon, who stops hand-applying the same dependency change across six repositories, and the software delivery system, which gets its first real exercise of the WS-4.2 guardrails under production conditions."
  success_signal: "Six per-repository Draft work units exist from one approved decomposition; each carries its own named human authority approval and its own conformance attestation; the kill switch is observed blocking dispatch before it is enabled; the canary repository dispatches, opens a pull request, and is adjudicated by the WS-5.1 verifier before the remaining five fire; and no agent, workflow, or orchestrator path merges anything."
scope:
  included:
    - "Author and approve this intent package before any work unit is created."
    - "Create exactly one Draft work unit per target repository through the WS-3.2 decomposition path, so that each unit is stamped with its own constraints.work_unit_id."
    - "Attest conformance per work unit, computed from that unit's own target repository's real state via security_scan.cli.scan and portfolio.compliance.build_rows."
    - "Record one named human authority approval per work unit, because each unit's authority envelope has a distinct fingerprint."
    - "Prove the WS-4.2 kill switch blocks dispatch, on live production, before dispatch is enabled for any change class."
    - "Enable production dispatch for the single change class dependency-update, for the single capability repo.edit, and for exactly the six allowlisted target repositories, only after Devon's explicit approval."
    - "Dispatch the canary repository first and observe the admission gate, per-unit target routing, idempotency, and the failure-signature circuit breaker before dispatching the remaining five."
    - "Let factory-runner open one pull request per repository that updates that repository's pinned dependencies and runs its named checks."
    - "Submit evidence per unit and let the WS-5.1 verifier adjudicate it."
    - "Record fan-out evidence: dispatch record identifiers, pull-request URLs, verifier outcomes, merge facts, and the guardrail observations from the canary."
  excluded:
    - "Any automatic merge, or any worker, agent, API, CLI, CI, or orchestrator path that merges a pull request."
    - "Any automatic Brain approval or knowledge promotion."
    - "Tracker canonicalization: no Linear, Todoist, or GitHub state becomes canonical lifecycle state."
    - "Graduation automation beyond the one Devon-approved change-class enablement."
    - "Automatic follow-up generation from this package's follow_up block."
    - "New observation collectors."
    - "Batch approval of work-unit authority, which would collapse N named human approvals into one."
    - "Any change to the authority envelope contract shared with AlobarQuest/factory-runner."
    - "Dependency updates in AlobarQuest/factory-runner itself, which has no dependabot configuration and is excluded from the target set."
  non_goals:
    - "Proving that dependency updates are correct; the repositories' own checks and Devon's review decide that."
    - "Making dispatch automation permanent; the standing posture after this fan-out is a separate Devon decision."
    - "Extending the fan-out beyond the change class dependency-update."
    - "Building queueing, batching, or scheduling machinery for fan-out units."
  assumptions:
    - "The orchestrator authenticates to GitHub as the Alobar SDS Dispatch app, installed on exactly the six target repositories, minting hourly installation tokens."
    - "All six target repositories host the byte-identical caller workflow .github/workflows/factory-runner-pilot.yml on their default branch, and carry the runner token, credential key id, and spend-capped Anthropic key as Actions secrets."
    - "AlobarQuest/factory-runner is public, so a caller's GITHUB_TOKEN can install it, and its reusable workflow invokes the installed console script rather than a repository-local script."
    - "The portfolio is currently violations=0 accepted=0 unknown=0, so every unit's conformance attests status green with an empty accepted_standards list."
    - "Devon alone approves this package revision, approves the decomposition, approves each work unit's authority, approves enabling dispatch, and merges every pull request."
  open_questions: []
