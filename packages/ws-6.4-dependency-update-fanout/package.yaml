supersedes: null
outcome:
  what: "Re-prove the six repositories sequentially under the repaired dependency-update authority contract. Revision 4 realizes only the AC-006 target: one Change Manager work unit updates the httpx2 development dependency from 2.5.0 to at least 2.6.0, refreshes pyproject.toml and uv.lock, opens one pull request, and proves the named Quality check green while Devon retains every approval and merge decision."
  why: "Historical 6/6 completion labels are not lifecycle or evidence authority. Each repository must be separately re-proven under the repaired, fingerprinted mutation_commands contract before its acceptance criterion can be treated as realized."
  beneficiary: "Devon gets a bounded, reviewable proof of the repaired factory path against a real repository before any later repository proof is attempted."
  success_signal: "Exactly one AC-006 Change Manager unit is created from a Devon-approved revision and decomposition; its approved authority envelope permits only the exact mutation-first command sequence; its pull request's named Quality check reports Ruff, Pyright, and 105 passing tests on the exact head; the WS-5.1 verifier adjudicates the evidence; and no agent, workflow, API, CLI, or orchestrator path approves in batch or merges anything."
scope:
  included:
    - "Author and approve this intent package before any work unit is created."
    - "Treat all historical 6/6 completion claims as non-authoritative; the six repositories are being re-proven sequentially, and revision 4 maps only AC-006 to Change Manager while AC-001..AC-005 and AC-007..AC-011 remain retained and incomplete."
    - "Before authoring the Change Manager authority envelope, prove it against the real target repository in a clean clone: execute the ordered allowed_commands list twice in succession, confirm both passes are green, confirm the working tree then carries a real diff, and confirm the verifier executed its tools rather than skipping them."
    - "Create exactly one Draft Change Manager work unit through the WS-3.2 decomposition path, so that the unit is stamped with its own constraints.work_unit_id."
    - "Authorize the complete Change Manager outcome with target_repository AlobarQuest/change-manager, change_class dependency-update, required_capability repo.edit, allowed_commands ordered as uv add --dev 'httpx2>=2.6.0', uv sync --locked, then uv run make check, and mutation_commands containing only uv add --dev 'httpx2>=2.6.0'."
    - "Attest conformance for the Change Manager unit from the target repository's real state via security_scan.cli.scan and portfolio.compliance.build_rows."
    - "Record one named human authority approval bound to the Change Manager unit's own authority fingerprint."
    - "Prove the WS-4.2 kill switch blocks dispatch, on live production, before dispatch is enabled for any change class."
    - "Enable production dispatch for the single change class dependency-update, the single capability repo.edit, and only AlobarQuest/change-manager, after Devon's explicit approval."
    - "Dispatch Change Manager once and observe admission, target routing, idempotency, and failure-signature circuit-breaker behavior."
    - "Let factory-runner open one Change Manager pull request that updates pyproject.toml and uv.lock and runs the named Quality check."
    - "Submit AC-006 evidence and let the WS-5.1 verifier adjudicate it."
    - "Record the Change Manager dispatch identifier, pull-request URL, exact-head Quality result, verifier outcome, and guardrail observations without projecting them onto the other ten acceptance criteria."
  excluded:
    - "Any automatic merge, or any worker, agent, API, CLI, CI, or orchestrator path that merges a pull request."
    - "Any automatic Brain approval or knowledge promotion."
    - "Tracker canonicalization: no Linear, Todoist, or GitHub state becomes canonical lifecycle state."
    - "Graduation automation beyond the one Devon-approved change-class enablement."
    - "Automatic follow-up generation from this package's follow_up block."
    - "New observation collectors."
    - "Validation-harness work or any new validation machinery."
    - "Batch approval of work-unit authority, which would collapse N named human approvals into one."
    - "Any further authority-envelope contract expansion not already approved and merged as part of the coordinated mutation_commands contract revision."
    - "Dependency updates in AlobarQuest/factory-runner itself, which has no dependabot configuration and is excluded from the target set."
  non_goals:
    - "Proving that dependency updates are correct; the repositories' own checks and Devon's review decide that."
    - "Making dispatch automation permanent; the standing posture after this fan-out is a separate Devon decision."
    - "Extending the fan-out beyond the change class dependency-update."
    - "Building queueing, batching, or scheduling machinery for fan-out units."
  assumptions:
    - "The orchestrator authenticates to GitHub as the Alobar SDS Dispatch app, installed on Change Manager, minting hourly installation tokens."
    - "Change Manager hosts the reviewed caller workflow .github/workflows/factory-runner-pilot.yml on its default branch, pinned to factory-runner commit c88a3199df80ccd8d90f752edc57cc8b93ff6354, and carries the required Actions secrets."
    - "AlobarQuest/factory-runner is public, so a caller's GITHUB_TOKEN can install it, and its reusable workflow invokes the installed console script rather than a repository-local script."
    - "Current Change Manager conformance will be computed from live repository state before proposal; no status or accepted_standards value is carried forward from historical evidence."
    - "Devon alone approves this package revision, approves the decomposition, approves each work unit's authority, approves enabling dispatch, and merges every pull request."
  open_questions: []
