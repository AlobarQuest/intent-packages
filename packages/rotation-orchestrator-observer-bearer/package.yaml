dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0055 amendment 9: decision 5 (scheduled readers verified by their Healthchecks checks,
    weekly readers gating retire) and "Decision 3 revised" (Devon, 2026-10-18: the observer
    first, without an overlap, then the drift-reporter with one).
  required_people_systems:
