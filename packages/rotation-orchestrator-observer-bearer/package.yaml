outcome:
  what: >-
    The orchestrator observer bearer (registry id orchestrator-observer-bearer, key id
    orchestrator-observer, role OBSERVER) is replaced by a bearer the executor mints, the
    orchestrator accepts only the new one for orchestrator-observer, and the keeper holds it.
    The value it shared with the drift-reporter bearer stays in the drift-reporter's keeper and
    entry until that bearer's own rotation.
  why: >-
    The observer and drift-reporter bearers hold one value, so an exposure of either is an
    exposure of both. Rotating the observer first, without an overlap, splits them; the
    drift-reporter then rotates on its own with the usual overlap (ADR-0055 amendment 9,
    "Decision 3 revised", Devon 2026-10-18).
  beneficiary: >-
    Devon, whose eight observe-and-report lanes stop sharing a credential with the infra-drift
    and vps-backup scripts.
  success_signal: >-
    Both units complete with each step's evidence filed, the keeper holds a value different from
    the one it started with, the orchestrator's identities route shows the new hash with no
    previous, the old value probes 401 and the new one 200 beside a refused random bearer, no
    staging or quarantine secret is left in Rotation / Work, and the next security-drift run
    reports no rotation finding for orchestrator-observer-bearer. The drift-reporter's entry
    still holds its old hash and is accepted, untouched.
scope:
  included:
  - The orchestrator adapter's two units, worked by the rotation executor.
  excluded:
  - >-
    Every other entry in ORCHESTRATOR_M2M_CREDENTIALS. The executor rewrites only the
    orchestrator-observer entry and refuses to rotate its own.
  - >-
    The drift-reporter bearer, which rotates in its own package once this rotation's mint unit
    has completed, and change-manager's bearers.
  - Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - Changing which lanes use the observer bearer, or its role.
  assumptions:
  - >-
    The rotation executor's timer is enabled in the VM at a revision carrying the orchestrator
    adapter, with coolify_url, orchestrator_application and admin_secrets.orchestrator set.
  - >-
    The keeper is in Rotation / Keepers, where sds-operator reads it by a direct grant and the
    root reads and writes it, each confirmed with an empty HOME after the move.
  - >-
    At host, orchestrator-drift-reporter's served hash equals the observer's old hash; the
    executor refuses the no-overlap host otherwise.
  open_questions: []
