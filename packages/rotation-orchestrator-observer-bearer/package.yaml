profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its
    orchestrator adapter, from the rotation-executor VM. The decomposition is the adapter's fixed
    plan: unit mint (mint, stage, host, verify_new, store, verify_consumers), then unit retire
    (verify_consumers, retire_old, confirm_dead), with Devon's completion of the first unit
    between them. Each unit restarts the orchestrator, so each is claimed only in the live_estate
    window, and the executor confirms no dispatched run is live before each write and each
    restart. The executor mints a random bearer itself; host rewrites ORCHESTRATOR_M2M_CREDENTIALS
    in both Coolify rows from what the running orchestrator loaded (GET /api/v1/m2m-identities),
    changing only the orchestrator-observer entry. This bearer shares its value with
    orchestrator-drift-reporter, so the orchestrator's boot refuses the old hash as previous: the
    mint unit's envelope declares host_without_overlap, and host writes the new hash with no
    previous, which the executor allows only while another served entry holds the old hash as
    current (ADR-0055 amendment 9, "Decision 3 revised"). The old value stops authenticating as
    orchestrator-observer at host's restart and keeps authenticating as
    orchestrator-drift-reporter. It writes Coolify with the token in Rotation / Coolify, read only
    while a step hosts or retires, and only the application and variable the approved destination
    names. There is no human act: the bearer's eight scheduled readers fetch the keeper by UUID
    when they run, and each is verified by the Healthchecks check its registry row names; the
    retire unit waits unclaimed until every one has run since the keeper's revision. Evidence
    carries fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    The orchestrator — its M2M identities route, which shows the hash each entry loaded, and the
    status ledger as the probe (200 for an accepted bearer, 401 for a refused one)
  - Production Coolify — the orchestrator application's ORCHESTRATOR_M2M_CREDENTIALS rows and restart
  - >-
    Bitwarden Secrets Manager — the keeper in Rotation / Keepers, the staging and quarantine
    secrets in Rotation / Work, and the Coolify token in Rotation / Coolify
  - >-
    Healthchecks — read-only, with the key in Rotation / Healthchecks: each scheduled reader's
    check, read before retire to confirm the reader ran since the keeper's revision
