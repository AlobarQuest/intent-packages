  blocking_conditions:
  - The executor refuses a unit at its checks; the refusal names the reason.
  - A dispatched run is live; the executor waits rather than restart.
risk:
  failure_modes:
  - >-
    A contract refusal fails a unit partway; the executor resumes from BWS and the identities
    route on a retry after a requeue.
  - >-
    A mint unit stalls after host: the eight observer lanes fail from host's restart until
    store. Finish it with an authorised retry, or undo it as the runbook's "If a rotation stalls
    after host" says for a host without an overlap.
  - >-
    An observer lane runs between host's restart and store: that run fails and pings /fail, and
    the next run passes.
  - >-
    The restarted orchestrator doesn't boot: Coolify keeps no old container, so the orchestrator
    is down until the change is undone by hand in both rows and restarted (measured on a
    throwaway application, 2026-10-15).
  max_impact: >-
    The orchestrator down until a hand undo and restart, if a restart fails to boot; or the
    eight observer lanes failing until a stalled mint unit is finished or undone. Other
    identities' entries are never changed.
  stop_conditions:
  - A value appears anywhere it should not.
  - The orchestrator doesn't come back after a restart.
  rollback: >-
    Before store has created the quarantine secret, and only while orchestrator-drift-reporter
    hasn't rotated since host: set the observer entry's token_hash to the drift-reporter's, in
    both rows, restart, and delete the staging secret; the keeper still holds the old value.
    After that the recovery is forward: retry the unit.
  escalation_target: devon
verification:
  independent_review:
  - Devon adjudicates each criterion against its evidence at /review.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of orchestrator-observer-bearer, which arrives as a new revision.
  signals: []
  owner: devon
