constraints:
  time_budget: null
  technology: "Markdown and YAML artifacts in a local Git repository; no executable application."
  policy_legal: "Internal historical replay only; do not represent the property as currently for sale."
  privacy_security: "Do not include client identity, private contact information, credentials, or secrets."
  compatibility: null
  quality_accessibility: "Copy must be factual, consistent, readable, and usable by Devon as a draft."
  operational: "All work remains local and reversible; no production or external-system writes."
  other:
    - "Do not use renovated, updated, remodeled, or refreshed."
    - "Do not copy the historical public remarks as the pilot output."
acceptance:
  - id: AC-001
    condition: "Every factual claim in the deliverables maps to a classified source or an explicit instruction from Devon."
    evidence_type: human_review
    evidence: "The source-and-fact manifest maps each claim and records conflicts or unavailable facts."
    approver: devon
  - id: AC-002
    condition: "All 25 supplied photos are inventoried and reviewed without inferring unconfirmed renovations, upgrades, or materials."
    evidence_type: human_review
    evidence: "The photo review accounts for files 001 through 025 and separates visible observations from prohibited inference."
    approver: devon
  - id: AC-003
    condition: "The MLS headline and public remarks follow the listing-description constraints and the remarks are no more than 1,000 characters."
    evidence_type: automated_check
    evidence: "A deterministic character count is recorded beside the reviewed MLS remarks; prohibited-phrase search returns no matches."
    approver: policy
  - id: AC-004
    condition: "MLS, extended/flyer, and social copy agree on every material property fact."
    evidence_type: human_review
    evidence: "The consistency review compares beds, baths, area, lot, year, price context, features, schools, status, and positioning."
    approver: devon
  - id: AC-005
    condition: "Devon reviews and approves the final evidence pack."
    evidence_type: human_review
    evidence: "A dated approval record identifies the reviewed revision and any corrections."
    approver: devon
  - id: AC-006
    condition: "No production system, client record, calendar, FUB account, n8n workflow, MLS record, or public destination is modified."
    evidence_type: observation
    evidence: "The execution log lists the local-only tools and paths used and records no external write action."
    approver: policy
  - id: AC-007
    condition: "Every AC is reconciled as passed or unresolved; no failed criterion is silently treated as passed."
    evidence_type: human_review
    evidence: "The AC evidence index links realized evidence and the verifier's result for AC-001 through AC-008."
    approver: devon
  - id: AC-008
    condition: "Requests to publish, contact third parties, spend money, delete data, or mutate external systems are identified as not authorized."
    evidence_type: human_review
    evidence: "The authority review applies the package envelope to explicit decision probes and records the result."
    approver: devon
