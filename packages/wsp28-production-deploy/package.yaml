schema_version: 1
package_id: wsp28-production-deploy
title: "WS-P2.8 production deploy — follow-up scheduling, the /review intake form, and the first recorded release since Phase 5"
revision: 1
status: ready_for_review
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-28T21:00:00Z"
supersedes: null
profile: infrastructure-change
profile_fields:
  blast_radius: single-app
  change_window: "One dedicated, explicitly authorised production-mutation session on 2026-07-28. Two container restarts fall inside it: one to set the follow-up window to zero for the demonstration, one to restore the thirty-day default."
  backup_evidence: "A pre-migration pg_dump of the production orchestrator database was taken to /tmp/orch-pre-0020.dump inside container mv6bei4lwkj552kp20zo7603 at 2026-07-28 21:05 UTC, before migration 0020 was applied."
  rollback_plan: "Re-point the Coolify application at the previous tag 8da4af3-wsp27inc2-amd64 and redeploy; migration 0020 adds one nullable column and has a working downgrade, so the previous image runs against the migrated schema except for its readiness probe, which reports migration_drift until the tags agree. The demonstration adds only append-only ledger rows against units this package creates."
outcome:
  what: "The production orchestrator at sds.alobar.net runs image 24d5e2d-wsp28-amd64 at migration head 0020_wsp28_follow_up, serving package-declared follow-up scheduling and the browser intake form, and the release that delivered it is recorded in the orchestrator's own ledger as a traceable artifact and deployment."
  why: "Three payloads reached main without reaching production: WS-P2.8's follow-up scheduling, GAP-6's /review intake form, and the ability to record a real release. Production had recorded exactly one of its own releases, at the Phase-5 closeout on 2026-07-08, while roughly eight subsequent deploys went unrecorded; the capability worked the whole time and the practice was never made a runbook step. Merged is not deployed, and a capability that has never been exercised in production is a claim rather than a demonstration."
  beneficiary: "Devon as the operator of the software delivery system, and the Wave-2 exit statement, whose traceability and follow-up-scheduling clauses become demonstrated rather than shipped."
  success_signal: "The running container's image digest equals the digest the Release image workflow pushed; the traceability query anchored on the production environment returns this release as a second real chain; and exactly one follow-up review unit is minted for this package revision, adjudicated, and completed through the /review surface, after which a second pass mints nothing."
scope:
  included:
    - "Build the production image through the Release image workflow from merged main, and verify the running container's digest against the pushed digest."
    - "Apply migration 0020_wsp28_follow_up to the production database before the image swap."
    - "Record the release-artifact binding for the deployed image against this approved package revision."
    - "Record the deployment observation for the production environment, and settle the post-deploy verification unit it generates."
    - "Run the traceability query end-to-end on this release and retain its output as evidence."
    - "Intake this package through the /review intake form, which is that form's first real use."
    - "Demonstrate follow-up minting end-to-end against production: mint, adjudicate, complete, and prove the second pass is idempotent."
    - "Exercise the daily minting step that infraops-mcp-server's drift audit now carries, by executing it rather than by trusting its repository gate."
  excluded:
    - "Any change to orchestrator application code or to the image this package deploys."
    - "Any outbound dispatch: dispatch stays disabled and this package neither enables nor tests it."
    - "Any write to a work unit, package revision, or condition this package did not create, other than settling the post-deploy unit this package's own deployment observation generates."
    - "Rotating the production orchestrator database password, which is urged separately and is not a gate on this work."
    - "The first real dispatch, which is a separate decision Devon takes on its own."
  non_goals:
    - "Backfilling follow-up declarations onto revisions intaken before migration 0020, which is impossible by design."
    - "Proving that follow-up minting honours the author's stated revisit timing; every package currently gets the same configured window."
    - "Closing the Evidence Pack clause of the Wave-2 exit statement, which closes through the first real dispatch."
  assumptions:
    - "The image is built by the paved-road workflow rather than by hand, and the in-build registry-bundle digest gate passes."
    - "The standing orchestrator-system credential carries the system role, so recording a deployment observation needs no new credential, no environment write, and no restart."
    - "Dispatch remains disabled for the duration."
  open_questions: []
sources:
  - location: "docs/superpowers/specs/2026-07-28-wsp28-follow-up-scheduling-design.md section 16.2 in AlobarQuest/orchestrator — the session-2 sequence"
