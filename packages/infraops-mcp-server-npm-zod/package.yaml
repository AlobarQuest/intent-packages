schema_version: 1
package_id: infraops-mcp-server-npm-zod
title: Adopt the proposed npm update of zod in infraops-mcp-server
revision: 1
status: draft
created_by: factory-create
owner: devon
created_at: '2026-08-19T12:43:28Z'
supersedes: null
reach:
- source_repository
profile: dependency-update

# THE STANDING PART AND THE PER-BUMP PART, in one block (ADR-0028).
#
# `target_repo` and `package` are facts about which lane this is and never move.
# `from_version` and `to_version` are the bump, and they are the ONLY two values a
# revision of this package changes -- written by the producer, never by hand.
#
# Both hold the same placeholder until a producer fills them, and that is an
# interlock rather than a formatting choice: `approval-policy.toml` refuses a
# revision whose two versions are equal, so an unfilled shell cannot be approved
# into work that describes nothing.
profile_fields:
  target_repo: AlobarQuest/infraops-mcp-server
  package: zod
  from_version: unassigned
  to_version: unassigned
  standing: true
outcome:
  what: >-
    infraops-mcp-server's zod dependency moves to the version named in
    profile_fields.to_version. package.json declares the new version and
    package-lock.json re-resolves. Nothing else in the repository changes.
  why: >-
    Dependabot proposes this update and the auto-merge cascade correctly declines
    it: ADR-0016 assigns the remainder -- the bumps that need work rather than a
    merge -- to the factory, and ADR-0028 makes that a lane rather than a
    separately authored package per bump. This package is the standing statement
    of that lane for one dependency; each revision of it is one proposed bump.
  beneficiary: >-
    infraops-mcp-server, which stays on a supported zod rather than drifting
    until an upgrade is forced by something urgent.
  success_signal: >-
    A pull request against AlobarQuest/infraops-mcp-server in which package.json
    declares the version named in profile_fields.to_version, package-lock.json
    resolves it, and the repository's own named check passes on the head.
scope:
  included:
  - >-
    Move the declared zod version to profile_fields.to_version and re-resolve
    the lockfile.
  - >-
    Whatever source change that version requires in order for the repository's
    own named check to pass on the pull request head.
  excluded:
  - >-
    Merging. The pull request is opened and left for a person; landing it is a
    separate act this package does not cover.
  - >-
    Deploying. App Brain records a landing on this repository's default branch as
    inert, which is what makes source_repository the honest reach here rather than
    a convenient one.
  - Any other outdated dependency, including others this same lane may have open.
  non_goals:
  - >-
    Adopting new zod features. This is a version move plus whatever it forces,
    not a migration undertaken for its own sake.
  assumptions:
  - >-
    The proposed version is reachable from the current one without a change this
    package's authority cannot make. Verified only to the extent that the
    repository's own named check runs on the result; nothing here reads a
    changelog.
  open_questions: []
sources:
- location: >-
    The open Dependabot pull request on AlobarQuest/infraops-mcp-server that
    proposes this bump, selected by the producer because the transcribed
    auto-merge cascade refuses it (ADR-0016, ADR-0028). The pull request is data;
    the decision that such bumps become factory work is the authority, and it was
    taken in ADR-0016.
  authority_level: authoritative
  required_version: null
  trust: untrusted_data
  sensitivity: internal
constraints:
  time_budget: null
  technology: >-
    npm is the only tooling. The mutation installs the proposed version and
    re-resolves the lockfile; the verifier is the repository's own build and
    lint. The ordered command list is settled at decomposition, against the
    repository as it actually stands, rather than guessed here.
  policy_legal: null
  privacy_security: null
  compatibility: >-
    A major version move may require source changes. That is the whole reason
    this bump is factory work rather than a merge, so it is in scope rather than
    a surprise.
  quality_accessibility: null
  operational: null
  other: []

# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
#
# THERE IS DELIBERATELY NO human_review CRITERION, and `factory create` scaffolds
# one. ADR-0028 keeps three human gates ahead of any code being written -- the
# work record, the decomposition, the authority envelope -- and a fourth act
# after the fact was not among them. `approval-policy.toml` refuses a revision
# carrying one, so a package that was scaffolded rather than authored cannot
# acquire that gate by inattention.
acceptance:
- id: AC-001
  condition: >-
    A pull request against AlobarQuest/infraops-mcp-server moves zod to the version
    named in profile_fields.to_version in both package.json and
    package-lock.json, and the repository's own named check passes on its head.
  evidence_type: automated_check
  evidence: >-
    ci: the target repository's named check on the pull request head, observed
    from GitHub by the orchestrator rather than asserted by the caller.
  approver: policy

# allowed_commands is an ORDERED list the worker re-executes at finalize, not a
# permission set: put mutators first and the verifier last, or the recorded
# evidence attests to a tree that is not the one pushed. Every listed command
# must therefore be idempotent.
authority:
  allowed:
  - repository_read
  - repository_write
  - test_execution
  requires_approval:
  - merge_to_main
  prohibited:
  - secret_write

  # max_llm_calls is max_attempts x factory-runner's own max_turns literal, which
  # is the only thing that actually bounds a single attempt. It is structural
  # rather than an estimate on purpose: the recoverable gate (attempts_exhausted,
  # curable by approve_retry) must bind before the unrecoverable one
  # (budget_exceeded, curable by nothing, because the envelope is write-once and
  # its approval cannot be taken back). Over-provisioning costs nothing, because
  # nothing checks spend mid-run.
  budgets:
    max_attempts: 3
    max_llm_calls: 120
deliverables:
  artifacts:
  - >-
    A pull request against AlobarQuest/infraops-mcp-server moving zod and whatever
    that move requires.
  destination: AlobarQuest/infraops-mcp-server
  recipient: devon
  definition_of_done: >-
    The pull request exists and the repository's named check is green on its
    head. Merging is a separate human act and is not part of this package.
  operator_responsibilities:
  - >-
    A merge into a production system must trace to recorded permission - either express
    permission given at the time of the merge, or a standing pre-authorization - recorded
    as evidence bound to this work unit. A merge that cannot be traced to one of those
    is a defect, whoever performed it. Outside production this constraint does not
    apply.
dependencies:
  predecessor_packages: []
  external_decisions: []
  required_people_systems: []
  required_capabilities: []
  blocking_conditions: []
risk:
  failure_modes:
  - >-
    The new zod breaks the repository's own named check and the work cannot
    make it pass within its budget. The pull request is not merged and nothing is
    affected, because a pull request is inert here.
  - >-
    The resolution pulls a wider set of transitive changes than expected. Visible
    in the diff before any merge.
  max_impact: low
  stop_conditions:
  - The diff touches a file outside the source tree, its manifest and its lockfile.
  rollback: >-
    Close the pull request without merging. Nothing outside the repository has
    changed, so there is nothing to undo. If it were merged and later regretted,
    revert the commit -- which still deploys nothing, because a landing on this
    repository's default branch is inert.
  escalation_target: devon
verification:
  independent_review: []
  non_mechanical: []
follow_up:
  required: false
  revisit_when: null
  signals: []
  owner: null
applicable_standards:
  project: '1.0'
