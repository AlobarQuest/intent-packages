acceptance:
  - id: AC-001
    condition: "An unapproved, Draft, rejected, cancelled, failed, superseded, closed-without-executable-approval, or otherwise non-executable package revision cannot be registered as executable intake."
    evidence_type: automated_test
    evidence: "gate: package-intake rejection tests cover each non-executable lifecycle state and missing approval/hash facts"
    approver: policy
  - id: AC-002
    condition: "Repeated registration of the same approved package revision with the same hash, source, approval facts, and normalized projection is idempotent and returns the existing intake record."
    evidence_type: automated_test
    evidence: "gate: service, API, and CLI idempotency tests prove stable replay behavior"
    approver: policy
  - id: AC-003
    condition: "Submitting the same package ID and revision with a different hash, source repository, source path, source commit, approval facts, or projection facts is rejected with a stable conflict."
    evidence_type: automated_test
    evidence: "gate: conflict tests prove no mutable replacement or silent overwrite path exists"
    approver: policy
  - id: AC-004
    condition: "Package intake stores immutable authority facts and a normalized projection without creating a second editable package source of truth in the orchestrator."
    evidence_type: human_review
    evidence: "human: approved design and code review confirm hash/source authority anchor, projection scope, and no mutable package-content editor"
    approver: devon
  - id: AC-005
    condition: "An agent, worker, system actor, or human can submit a decomposition proposal, but proposal submission alone creates no canonical work units and grants no readiness."
    evidence_type: automated_test
    evidence: "gate: proposal creation tests assert work_units remain unchanged until a human approval decision"
    approver: policy
  - id: AC-006
    condition: "Only a named human approval can activate a decomposition proposal, and activation creates Draft work units through the existing central lifecycle and persistence path."
    evidence_type: automated_test
    evidence: "gate: authorization and service tests prove non-human approval is rejected and approved proposals call the existing unit-registration path"
    approver: policy
  - id: AC-007
    condition: "Rejected and revision-required decomposition proposals remain auditable, cannot create work units, and can be followed by a later proposal."
    evidence_type: automated_test
    evidence: "gate: proposal decision tests cover reject, revision-required, later proposal, and audit event history"
    approver: policy
  - id: AC-008
    condition: "At most one approved decomposition is active for a package revision unless a later named human decision explicitly supersedes it."
    evidence_type: automated_test
    evidence: "gate: uniqueness and supersession tests cover concurrent and repeated approvals"
    approver: policy
  - id: AC-009
    condition: "Internal dependencies between proposed units are represented structurally, cycle-checked, and transferred to the existing dependency model when Draft work units are created."
    evidence_type: automated_test
    evidence: "gate: internal dependency mapping, cycle rejection, and created dependency tests pass"
    approver: policy
  - id: AC-010
    condition: "External dependencies from the package are preserved structurally where appropriate and remain explainable in readiness decisions without making external trackers canonical."
    evidence_type: automated_test
    evidence: "gate: external dependency projection and readiness tests pass"
    approver: policy
  - id: AC-011
    condition: "Every package acceptance criterion maps to one or more work units or is explicitly retained as a package-level criterion with human-approved rationale before decomposition can be approved."
    evidence_type: automated_test
    evidence: "gate: AC mapping tests reject unmapped criteria without approved retained-package-level handling"
    approver: policy
  - id: AC-012
    condition: "Package-level authority and work-unit authority remain explainable, and authority expansion does not bypass existing WS-3.1 approval/readiness gates."
    evidence_type: automated_test
    evidence: "gate: authority projection and readiness tests pass for package-level and unit-level authority"
    approver: policy
  - id: AC-013
    condition: "API and CLI expose equivalent intake and decomposition behavior, including stable errors and idempotency semantics."
    evidence_type: automated_test
    evidence: "ci: API/CLI parity tests and Quality pass on the exact PR revision"
    approver: policy
  - id: AC-014
    condition: "The human UI can review a decomposition proposal sufficiently to approve, reject, or require revision without exposing unauthenticated or M2M-only human actions."
    evidence_type: human_review
    evidence: "human: Devon reviews the rendered local UI behavior and authentication/authorization boundaries"
    approver: devon
  - id: AC-015
    condition: "Every intake, proposal, decomposition approval, rejection, revision-required decision, supersession, and Draft work-unit creation appends an attributable local event in the same transaction as the canonical state change."
    evidence_type: automated_test
    evidence: "gate: transaction-bound event tests cover success, replay, and rollback injection"
    approver: policy
  - id: AC-016
    condition: "The two closed Phase-2 packages and the closed WS-3.1 package are usable as tests or acceptance examples for intake/decomposition without executing their real work in WS-3.2."
    evidence_type: automated_test
    evidence: "gate: fixtures or acceptance tests load representative software and non-software packages and prove domain-neutral projection behavior"
    approver: policy
  - id: AC-017
    condition: "Existing WS-3.1 transition, claim, evidence, adjudication, waiver, API, CLI, UI, migration, and architecture tests continue to pass."
    evidence_type: automated_test
    evidence: "gate: full local make check passes against the local PostgreSQL endpoint"
    approver: policy
  - id: AC-018
    condition: "The repository contains no automatic merge path, no production infrastructure mutation path, no factory-runner dispatch, no external factory-event publication, and no worker or agent path that approves intent, approves decomposition, or declares canonical completion."
    evidence_type: automated_test
    evidence: "scan: architecture guards, repository search assertions, and final whole-branch review pass"
    approver: policy
  - id: AC-019
    condition: "Devon reviews the PR after the exact named Quality check succeeds; the worker may mark the PR ready for review when asked, but Devon alone merges."
    evidence_type: human_review
    evidence: "human: Devon confirms review and merge decision; merge remains outside worker authority"
    approver: devon
