  deploy_target: null
  required_checks:
    - Quality
  rollback_plan: "Before deployment, abandon or revert the feature branch and retain the approved intent package. Database changes must remain forward-migratable and tested only against disposable local PostgreSQL during this package."
outcome:
  what: "The orchestrator can register approved immutable intent-package revisions and turn agent-proposed decomposition into canonical Draft work units only after named human approval."
  why: "Phase 3 needs a persistent intake and decomposition boundary between approved intent packages and executable work units, without letting mutable or unapproved package content become factory work."
  beneficiary: "Devon, factory workers, verifiers, and both software and non-software workflows using the orchestrator as canonical lifecycle owner."
  success_signal: "Unapproved or mutable package revisions cannot become executable intake; repeated approved intake is idempotent; conflicting hash/source facts are rejected; decomposition proposals remain non-canonical until human approval creates Draft work units with structural dependencies and acceptance-criterion mapping."
scope:
  included:
    - "Author and approve this WS-3.2 intent package before changing orchestrator application code."
    - "Write an approved WS-3.2 design specification in AlobarQuest/orchestrator that resolves package-intake boundary, approval verification limits, content storage, proposal storage, human approval semantics, AC mapping, fixture strategy, API/CLI/UI scope, migration strategy, and WS-3.3/WS-3.4 preparation."
    - "Run an adversarial architecture review of the design before implementation planning."
    - "Write and approve a task-level implementation plan before implementation."
    - "Add approved immutable package-revision intake to the orchestrator using package ID, revision, approved hash, source repository, source path, source commit, profile, status at intake, approval actor, approval time, and available approval event or ledger facts."
    - "Reject Draft, unapproved, superseded, cancelled, failed, rejected, and otherwise non-executable package revisions for executable intake unless a later approved revision explicitly adds analysis-only registration."
    - "Preserve deterministic idempotency for repeated registration of the same package revision and stable conflict behavior when hash, source, approval, or projection facts differ."
    - "Store an immutable authority anchor as hash plus source reference and store only the normalized package projection needed for readiness, authority, dependencies, acceptance criteria, and decomposition decisions."
    - "Add non-canonical decomposition proposal storage with actor, time, package revision, rationale, proposed units, dependencies, authority requirements, acceptance-criterion mapping, retained package-level criteria, and idempotency key."
    - "Allow multiple proposals per package revision while enforcing at most one active approved decomposition unless a later approved human action supersedes it."
    - "Add human-only decomposition decisions: approve, reject, and require revision, keeping rejected and revision-required proposals auditable."
    - "Create Draft work units only after approved decomposition, using the existing central persistence and lifecycle path rather than bypassing WS-3.1 invariants."
    - "Represent internal work-unit dependencies structurally and land external dependencies from the package into the existing dependency model where appropriate."
    - "Require every package acceptance criterion to map to one or more proposed work units or be retained as a package-level criterion with a human-approved explanation before decomposition can be approved."
    - "Expose equivalent API and CLI behavior for intake, proposal submission, proposal review, approval, rejection, revision-required, and created Draft units."
    - "Add the smallest credible human UI for reviewing proposal rationale, proposed units, dependencies, authority, AC mapping, retained package-level criteria, and approval/rejection/revision-required actions."
    - "Append attributable local events for every intake, proposal, decomposition decision, and Draft work-unit creation."
    - "Use the two closed Phase-2 packages and the WS-3.1 package as fixtures or acceptance examples without executing their real work in WS-3.2."
  excluded:
    - "Factory runner, automatic dispatch, GitHub Actions worker execution, and production deployment automation."
    - "Coolify deployment or any live infrastructure mutation."
    - "Phase-5 independent verifier logic or automatic acceptance-criterion adjudication."
    - "External factory-event/v1 publication beyond local event seams or design placeholders."
    - "WS-3.3 standing-context preflight, skill-subscription semantics, status-ledger projection, and protocol smoke tests."
    - "WS-3.4 evidence-event publication."
    - "Linear, Todoist, GitHub, or any tracker becoming canonical lifecycle state."
    - "Automatic merge or any worker, agent, API, CLI, CI, or UI path that merges pull requests."
    - "Autonomous intent approval or autonomous decomposition approval."
    - "Brain learning, promotion loop, additional agent personas, generalized visual workflow builder, listing-specific profile, or broad refactors of change-manager, intent-packages, security-standards, or brain."
    - "Project-standards or code-standards onboarding for orchestrator; the current matrix result is recorded as baseline but not repaired in this package."
  non_goals:
    - "Completing all remaining Phase 3 workstreams."
    - "Making the orchestrator a second editable source of truth for package content."
    - "Turning change-manager into the generic orchestrator or moving drift/sensitive-infrastructure authority out of change-manager."
    - "Registering packages as executable work without a named human approval of the package revision and of the decomposition."
  assumptions:
    - "intent-packages remains canonical for package content, revision numbering, hash behavior, package lifecycle, and approval ledger."
    - "The orchestrator may read package YAML to build a normalized projection, but the approved hash and source reference remain the authority anchor."
    - "The current WS-3.1 manual revision-registration and approved-unit creation services are implementation seams, not the final WS-3.2 user contract."
    - "PostgreSQL remains the concurrency and migration target for orchestrator acceptance tests."
    - "Devon alone approves exact package revisions, approves decomposition, moves PRs out of draft when applicable, and merges PRs."
  open_questions: []
