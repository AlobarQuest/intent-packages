risk:
  failure_modes:
    - "The orchestrator accepts mutable or unapproved package content as executable work."
    - "The orchestrator stores a second editable intent source of truth."
    - "A decomposition proposal becomes canonical before named human approval."
    - "Approved decomposition bypasses the existing work-unit lifecycle and readiness gates."
    - "Acceptance criteria are lost, silently waived, or mapped only in prose."
    - "Software-specific assumptions enter the domain-neutral intake and decomposition core."
    - "WS-3.3, WS-3.4, Phase 4, or Phase 5 behavior is pulled into WS-3.2 without approval."
  max_impact: "Incorrect intake or decomposition could authorize wrong work units; production mutation, dispatch, and merge remain out of scope to cap blast radius."
  stop_conditions:
    - "A baseline repository or required check becomes red for an in-scope reason."
    - "The approved package hash changes without revision and renewed approval."
    - "The design cannot prevent unapproved package intake or pre-approval work-unit creation."
    - "A design requires secrets in tracked files, destructive database action, live infrastructure mutation, or external-system writes."
    - "A worker, CLI, API, CI workflow, or UI path can merge a PR, approve intent, approve decomposition, dispatch work, publish external events, or unilaterally set Completed."
    - "Implementation scope crosses into WS-3.3, WS-3.4, Phase 4, or Phase 5 without separately approved intent."
  rollback: "Before deployment, revert or abandon WS-3.2 commits and close the PR; preserve this package, evidence, and review findings. Database changes are tested only in disposable local databases under this package."
  escalation_target: devon
verification:
