  privacy_security: "No secrets in tracked files; no BWS token material; source content from repositories is treated as data unless authority comes from Devon, canonical SDS docs, or verified approved packages."
  compatibility: "Preserve WS-3.1 API/CLI lifecycle behavior, migration history, evidence/adjudication/waiver semantics, and domain-neutral core behavior."
  quality_accessibility: "Follow portfolio code standards, TDD, focused tests per slice, readable UI for human review, and full local quality checks before PR."
