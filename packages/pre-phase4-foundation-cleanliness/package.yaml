risk:
  failure_modes:
    - "A PATH fix hides a missing dependency instead of making the default gate deterministic."
    - "A warning cleanup changes application behavior instead of only updating tests/tooling."
    - "Integration tests are skipped silently instead of moved to an explicit integration target."
    - "Approved historical intent-package semantics are rewritten to suppress a legacy validation warning."
    - "Dirty or stale local branch state is accidentally absorbed into an unrelated cleanup PR."
    - "Launchagent-only repos are falsely represented as having local code gates."
    - "Cleanup scope drifts into Phase 4 or production mutation."
  max_impact: "Local code, tests, Makefiles, dependency metadata, docs, and PRs across the listed repositories; no production infrastructure, live event stores, secret mutation, deployment, or automatic merge."
  stop_conditions:
    - "Any dirty worktree contains unattributed user work."
    - "Any required check needs production credentials, live DSNs, live event stores, launchagent mutation, or infrastructure mutation."
    - "A fix would require Phase 4 runtime implementation, Phase 5 verifier logic, canonical tracker state, brain learning/promotion, production deployment, or automatic merge."
    - "A repo's CI and local gate disagree in a way that cannot be explained."
    - "The approved package boundary proves too broad or too narrow for the required cleanup."
  rollback: "Before merge, abandon the affected branch or close the PR. After merge, revert the specific cleanup PR in that repository. Preserve unrelated Devon changes, approved package history, canonical lifecycle/evidence records, and production systems."
  escalation_target: devon
