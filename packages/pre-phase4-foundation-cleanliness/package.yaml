constraints:
  time_budget: "One pre-Phase-4 cleanup workstream with separate per-repo PRs where repositories are touched."
  technology: "Python 3.12, pytest, pyright, ruff, uv, FastAPI/Starlette/httpx test clients, TypeScript/Node/Vitest/tsc/prettier/eslint, Make, project-standards portfolio foundation, and intent-packages lifecycle."
  policy_legal: "Devon alone approves this exact intent revision/hash, approves any ambiguous dirty-state disposition, reviews PRs, and merges PRs. PR grouping follows repository ownership boundaries unless Devon revises the package."
  privacy_security: "No secrets in tracked files; no BWS token material, PATs, production credentials, live DSNs, live event-store credentials, or infrastructure mutation."
  compatibility: "Preserve existing public behavior and ownership boundaries; make only warning, skip, tool-resolution, dirty-state, and evidence changes needed for the cleanliness definition."
  quality_accessibility: "Default gates must be deterministic, warning-clean, skip-clean unless explicitly integration-gated, and runnable from a fresh shell without PATH accidents."
  operational: "Use disposable local databases or explicit integration-only gates; do not require production credentials, live DSNs, live event stores, launchagent mutation, or infra mutation for default checks."
  other:
    - "Application and standards code changes may begin only after Devon approves this exact package revision and hash."
    - "Stop and re-plan if a fix would require Phase 4 runtime behavior, Phase 5 verifier behavior, tracker canonicalization, brain promotion, production deployment, or infrastructure mutation."
