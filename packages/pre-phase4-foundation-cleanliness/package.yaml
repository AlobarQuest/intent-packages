outcome:
  what: "The foundation and Phase-3 add-on repositories are warning-clean, skip-clean unless explicitly integration-gated, toolchain-deterministic, and attributable in git before Phase 4 execution runtimes scale."
  why: "Phase 4 will increase autonomous execution volume; the foundation must be trusted by deterministic local gates rather than by a conformance matrix that only happens to pass."
  beneficiary: "Devon, the software factory, future execution runtimes, and reviewers who need reliable local evidence before runner dispatch and verifier work begin."
  success_signal: "Every listed repository has documented branch state, no unattributed dirty files, warning-free/type-clean/test-clean default gates, no hidden tool skips, explicit integration-only gates where needed, and project-standards still reports foundation violations=0 accepted=0 unknown=0."
scope:
  included:
    - "Author, validate, hash, and present this exact package revision for Devon approval before application or standards code changes."
    - "Re-establish baseline branch, status, remotes, and recent commits for /Users/devon/Developer/code-standards, /Users/devon/Projects/project-standards, /Users/devon/Projects/security-standards, /Users/devon/Projects/change-manager, /Users/devon/Projects/brain, /Users/devon/Projects/infraops-mcp-server, /Users/devon/Projects/intent-packages, /Users/devon/Projects/orchestrator, /Users/devon/Projects/alobar-id, and /Users/devon/Projects/vps-backup."
    - "Safely fast-forward only clean repositories to merged main; do not discard or absorb unrelated local changes."
    - "Normalize local gate tool resolution so default documented checks prefer repo-local .venv/bin and node_modules/.bin where applicable instead of accidental global binaries."
    - "Fix change-manager bare make check parity and remove its Starlette/httpx pytest warning."
    - "Remove orchestrator Starlette/httpx pytest warning without changing Phase-4 dispatch, deployment, verifier, tracker, merge, or event-store authority."
    - "Remove brain Starlette/httpx pytest warning and resolve the untracked uv.lock disposition only after attribution."
    - "Remove security-standards pyright missing-source warnings and move FACTORY_TEST_DSN factory-store tests out of the default gate into an explicit integration target if Devon approves that classification."
    - "Remove intent-packages pyright missing-source warnings and resolve the legacy package validation warning without rewriting approved historical semantics unless the validator already supports a safe metadata-only treatment."
    - "Remove project-standards pyright missing-source warnings."
    - "Fix infraops-mcp-server Makefile behavior so Node checks do not silently skip tsc, prettier, eslint, or vitest when local tools are installed."
    - "Resolve or explicitly document alobar-id PROJECT.md dirty-state disposition before claiming alobar-id is clean."
    - "Create final cleanliness evidence in orchestrator docs that records branch state, gate outputs, warnings/skips, integration-only checks, launchagent-only exceptions, CI/PR status, and the foundation matrix result."
  excluded:
    - "Factory-runner dispatch, GitHub Actions worker execution, workflow_dispatch, worker scheduling, or any Phase 4 execution-runtime implementation."
    - "Production deployment, Coolify mutation, VPS/DNS/Hetzner mutation, launchagent mutation, or live infrastructure mutation."
    - "Live factory-events mutation, production event-store writes, or event_emit use against a live append-only store."
    - "Phase-5 verifier logic, automatic acceptance-criterion adjudication, release approval, or artifact-to-intent binding."
    - "Linear, Todoist, GitHub, or any tracker becoming canonical lifecycle state."
    - "Brain learning, knowledge promotion, observation-to-lesson automation, or governed-learning pipeline changes."
    - "Automatic merge, merge_to_main by an agent, direct pushes to protected main, or worker-controlled canonical completion."
    - "Secrets, live DSNs, BWS token material, PATs, production credentials, or credential rotation."
    - "Broad refactors unrelated to warning, skip, tool-resolution, dirty-state, and evidence cleanup."
  non_goals:
    - "Starting or implementing Phase 4."
    - "Changing canonical lifecycle ownership among intent-packages, orchestrator, change-manager, security-standards, or brains."
    - "Making the foundation matrix broader than the existing conformance command unless a follow-up package separately authorizes that work."
    - "Retiring, archiving, or deleting any repository."
  assumptions:
    - "Phases 0, 1, 2, and 3 are complete before this package is approved."
    - "WS-3.4 closure is merged in intent-packages at 6a42e335ef86987bdc1dceb718ab9d23041bbbbd."
    - "The foundation matrix command currently reports violations=0 accepted=0 unknown=0."
    - "Repository content is evidence unless authority comes from Devon, approved intent packages, or the canonical SDS planning documents."
    - "Devon alone approves exact package revisions, reviews PRs, and merges PRs."
  open_questions: []
