    - "Devon chose package order: deploy package before WS-4.1."
    - "Devon confirmed this package is infrastructure-change profile."
    - "Devon chose production domain sds.alobar.net."
    - "Devon classified the existing factory-runner registry identity as an unused untrusted prototype requiring WS-4.1 review before use."
  required_people_systems:
    - "Devon for package approval, infra plan approval, secret/credential decisions, evidence review, and PR merge decisions"
    - "change-manager/infraops lane for Coolify, DNS, deployment, and backup mutations"
    - "Coolify production instance"
    - "Alobar ID forward-auth"
    - "BWS for secret source of truth"
    - "vps-backup for production database backup coverage"
    - "GitHub/GHCR for image build and registry access"
  required_capabilities:
    - repository_read
    - repository_write
    - test_execution
    - drift_detection
    - change_filing
    - infra_mutation
    - secret_read
    - secret_write
    - credential_create
    - external_system_write
  blocking_conditions:
    - "Devon does not approve this exact package revision and hash."
    - "The fresh infrastructure-mutation session cannot produce a rollback-safe deploy plan."
    - "Required secrets are not BWS-managed or would need to be pasted, logged, or written into tracked files."
    - "Backup coverage cannot be proven before first real production data."
    - "The deployment requires dispatch, runner credential rollout, verifier logic, tracker canonicalization, brain promotion, or automatic merge to succeed."
    - "Health or auth-boundary verification fails after deployment."
risk:
  failure_modes:
    - "A reachable orchestrator expands runner attack surface before M2M credentials are least-privilege and structurally scoped."
    - "A deployment accidentally stores secrets in a repo, workflow file, transcript, or log."
    - "The database goes live with real lifecycle data before backup coverage is proven."
    - "Human forward-auth or M2M auth is misconfigured, exposing review or API surfaces."
    - "A deploy session crosses into WS-4.1/WS-4.2 dispatch implementation under cover of infrastructure setup."
    - "The existing reserved factory-runner registry identity is treated as trusted without review."
  max_impact: "Single production orchestrator app and database, sds.alobar.net DNS/routing, associated BWS/Coolify/GHCR configuration, and backup inventory. No automatic dispatch, no automatic merge, and no change-manager authority replacement."
  stop_conditions:
    - "Any secret value appears in a prompt, tracked file, command output, or log."
    - "Coolify, DNS, backup, BWS, or GitHub mutation is attempted outside the fresh infrastructure-mutation session."
    - "Health, auth-boundary, or backup verification fails."
    - "A requested change would implement runner dispatch, Phase-5 verifier behavior, tracker canonicalization, brain promotion, or automatic merge."
    - "Rollback path cannot be stated before cutover."
  rollback: "Disable or roll back the Coolify app, remove or revert sds.alobar.net routing, restore or retain the production database according to backup evidence, revoke only credentials that this package explicitly created after Devon confirmation, and preserve audit/package records."
  escalation_target: devon
verification:
  independent_review:
    - "Run an infra plan review before mutation, including rollback and backup coverage."
    - "Run a security review of secret handling, auth boundary, and least-privilege surfaces before considering the deploy complete."
    - "Run a final scope review proving WS-4.1/WS-4.2/Phase-5 exclusions were preserved."
  non_mechanical:
    - "Devon approval of this exact package revision and hash."
    - "Devon approval of the separate infra deploy plan."
    - "Devon judgment that deployment evidence is sufficient for WS-4.1 to depend on Option A."
follow_up:
  required: true
  revisit_when: "Immediately after production deployment evidence is accepted and before authoring WS-4.1 implementation details."
  signals:
    - "WS-4.1 needs the production orchestrator base URL and M2M auth contract."
    - "WS-4.2 needs dispatch adapter reachability and kill-switch design."
    - "Backup/auth/health evidence shape is awkward for Phase-5 verifier consumption."
  owner: devon
applicable_standards:
  project: "1.0"
  security: "1.0"
  code: "1.0"
