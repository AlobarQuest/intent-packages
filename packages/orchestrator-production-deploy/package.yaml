schema_version: 1
package_id: orchestrator-production-deploy
title: "Deploy orchestrator to production Coolify for Phase 4 runner reachability"
revision: 1
status: draft
created_by: codex-interactive
owner: devon
created_at: "2026-07-06T00:00:00Z"
supersedes: null
profile: infrastructure-change
profile_fields:
  blast_radius: single-app
  change_window: "Dedicated infrastructure-mutation session after Devon approves this exact package revision and hash."
  backup_evidence: "Backup coverage must be proven before first real production orchestrator data is accepted."
  rollback_plan: "Before production use, disable the Coolify app and remove the new DNS route or restore the pre-change Coolify configuration. If database state has real orchestrator data, restore from the verified pre-change backup or retain the database read-only for audit while routing is disabled. Do not delete evidence, package history, or unrelated infrastructure."
outcome:
  what: "The Phase-3 orchestrator is reachable by GitHub-hosted factory runners at https://sds.alobar.net with production PostgreSQL, health checks, human forward-auth, and M2M API authentication."
  why: "Phase 4 runner design depends on workers fetching briefs and authority envelopes from the canonical orchestrator and submitting evidence back; GitHub-hosted runners cannot reach Devon's local Mac service."
  beneficiary: "Devon, Phase 4 factory-runner work, future dispatch adapter work, and reviewers who need structural claim, lease, evidence, and authority behavior to stay canonical."
  success_signal: "A production Coolify deployment answers health checks, the human surface is protected by Alobar ID forward-auth, the M2M API path rejects unauthenticated calls and accepts only configured bearer auth, backup coverage is proven, and no runner dispatch is implemented by this package."
scope:
  included:
    - "Plan the production deployment in a fresh infrastructure-mutation session before any Coolify, DNS, or backup changes."
    - "Deploy the existing AlobarQuest/orchestrator application to production Coolify as a Docker image application using the repository Dockerfile and a GHCR image flow."
    - "Provision a separate production PostgreSQL resource for the orchestrator."
    - "Configure https://sds.alobar.net for the orchestrator production app."
    - "Configure Alobar ID forward-auth for the human review surface."
    - "Configure M2M bearer authentication for machine API access without embedding secrets in tracked files or workflow files."
    - "Store and inject secrets through BWS/Coolify/GitHub-secret patterns using stable UUID references and manifests where repositories consume BWS secrets."
    - "Add vps-backup coverage for the production orchestrator database before first real production orchestrator data is accepted."
    - "Run health, auth-boundary, migration, backup, and rollback-readiness verification after deployment."
    - "Record deployment evidence and operational notes needed by WS-4.1 and WS-4.2."
  excluded:
    - "Factory-runner implementation, reusable workflow creation, claude-code-action execution, or pilot rollout."
    - "Orchestrator dispatch adapter, workflow_dispatch integration, automatic doing, or work-unit scheduling."
    - "Phase-5 verifier logic, release immutability, automatic acceptance adjudication, or post-deploy verification units."
    - "Tracker canonicalization, Linear/Todoist projection, brain learning, knowledge promotion, graduation automation, or automatic merge."
    - "Creating repo-scoped runner credentials for pilot repositories unless this package is revised; WS-4.1/WS-4.2 own runner credential surfaces."
    - "Changing change-manager authority over sensitive infrastructure work."
    - "Deleting local orchestrator data, approved intent-package history, event records, or unrelated Coolify resources."
  non_goals:
    - "Completing WS-4.1, WS-4.2, WS-4.3, or WS-4.4."
    - "Making production orchestrator deployment itself proof that autonomous dispatch is safe."
    - "Replacing change-manager or infraops as the sensitive-infrastructure execution lane."
  assumptions:
    - "Option A is the chosen Phase 4 reachability design: deploy orchestrator first, then build the factory runner against a reachable canonical service."
    - "The production domain is sds.alobar.net."
    - "The orchestrator remains canonical for work-unit lifecycle truth; production deployment only changes reachability."
    - "The existing reserved factory-runner registry identity is an untrusted prototype until WS-4.1 reviews and revises it."
    - "Secrets are BWS-managed and are never pasted into prompts, tracked files, workflow files, or logs."
    - "Devon alone approves exact package revisions, approves decomposition, and merges PRs."
  open_questions: []
