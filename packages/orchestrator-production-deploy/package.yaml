constraints:
  time_budget: "One infrastructure deploy package, executed in a fresh infrastructure-mutation session after approval."
  technology: "Python 3.12, FastAPI, PostgreSQL 16, Alembic, Docker image deployment on Coolify, GHCR, Alobar ID forward-auth, M2M bearer auth, BWS-managed secrets, vps-backup, and infraops/change-manager lane."
  policy_legal: "Devon approves this exact package revision and hash before any infrastructure mutation. All Coolify and backup operations happen through the infraops/change-manager lane in a separate session. Devon's merge gate remains permanent."
  privacy_security: "No secrets, BWS token material, PATs, database URLs, bearer tokens, or private keys in tracked files, workflow files, package text, prompts, or logs. Reference BWS secrets by stable UUID only where a consuming repo manifest requires it."
  compatibility: "Preserve Phase-3 orchestrator behavior, database migrations, M2M auth semantics, Alobar ID human surface, local development flow, and WS-3.4 event publication/export semantics."
  quality_accessibility: "Production deployment must expose clear health and auth-boundary evidence; human surface must remain usable behind forward-auth."
  operational: "Backups must be proven before first real production orchestrator data; rollback and DNS/app disable paths must be documented before cutover."
  other:
    - "Do not mix read-only research or runner implementation with infrastructure mutation."
    - "If the deploy requires new credentials or secret writes, stop for Devon confirmation and record the BWS UUID/consumer-map decision without exposing values."
    - "If default orchestrator gates or foundation checks fail, stop and resolve them before deploying."
acceptance:
  - id: AC-001
    condition: "A fresh infrastructure-mutation session produces a read-only deploy plan before any Coolify, DNS, backup, or secret changes."
    evidence_type: human_review
    evidence: "human: Devon reviews the infra plan, mutation boundary, rollback path, and confirms execution may proceed"
    approver: devon
  - id: AC-002
    condition: "The orchestrator repository is clean on merged main and the default gate passes before deployment work begins."
    evidence_type: automated_test
    evidence: "health: cd /Users/devon/Projects/orchestrator && make check passes before deploy"
    approver: policy
  - id: AC-003
    condition: "The production app is deployed to Coolify at https://sds.alobar.net using the approved image/deploy path and a separate PostgreSQL resource."
    evidence_type: automated_test
    evidence: "health: Coolify application and database resources exist, app deploy is successful, and https://sds.alobar.net/health/live returns success"
    approver: policy
  - id: AC-004
    condition: "The human review surface is protected by Alobar ID forward-auth while unauthenticated health behavior remains appropriate for monitoring."
    evidence_type: automated_test
    evidence: "health: protected human routes require forward-auth and configured health endpoint returns the expected monitoring response"
    approver: policy
  - id: AC-005
    condition: "The M2M API rejects missing or invalid bearer auth and accepts only the configured production machine credential."
    evidence_type: automated_test
    evidence: "health: authenticated and unauthenticated M2M API probes demonstrate the expected 401/403 and success responses without logging token values"
    approver: policy
  - id: AC-006
    condition: "All production secrets used by the deployment are sourced through BWS/Coolify/GitHub-secret patterns and no secret value is written to tracked files or logs."
    evidence_type: automated_test
    evidence: "change-log: security scan reports zero BLOCK findings and deployment notes list only non-secret UUID references or redacted secret names"
    approver: policy
  - id: AC-007
    condition: "vps-backup coverage exists and is verified for the production orchestrator database before first real production orchestrator data is accepted."
    evidence_type: automated_test
    evidence: "backup: backup inventory and restore/verify evidence include the orchestrator production database or explicitly documented backup target"
    approver: policy
  - id: AC-008
    condition: "Rollback readiness is demonstrated before cutover is considered complete."
    evidence_type: automated_test
    evidence: "change-log: rollback checklist records app disable/DNS route removal, database restore or retention path, and pre-change state references"
    approver: policy
  - id: AC-009
    condition: "The deployment emits or records attributable deployment evidence without making factory-events, GitHub, Linear, Todoist, or any tracker canonical lifecycle truth."
    evidence_type: automated_test
    evidence: "change-log: deployment evidence records actor, package revision, commit/image, Coolify resources, health probes, and backup evidence while preserving orchestrator as lifecycle authority"
    approver: policy
  - id: AC-010
    condition: "No factory-runner dispatch, workflow_dispatch, runner credential rollout, Phase-5 verifier, tracker canonicalization, brain learning/promotion, graduation automation, or automatic merge is implemented by this package."
    evidence_type: automated_test
    evidence: "change-log: final diff/scope review and deployment evidence confirm excluded surfaces were not implemented"
    approver: policy
  - id: AC-011
    condition: "Devon reviews the deployment evidence before WS-4.1 package implementation begins."
    evidence_type: human_review
    evidence: "human: Devon confirms the production orchestrator deployment evidence is sufficient for WS-4.1 to depend on Option A reachability"
    approver: devon
authority:
  allowed:
    - repository_read
    - repository_write
    - test_execution
    - drift_detection
    - change_filing
  requires_approval:
    - infra_mutation
    - secret_read
    - secret_write
    - credential_create
    - external_system_write
    - event_emit
    - merge_to_main
  prohibited:
    - credential_revoke
    - change_approval
    - outward_publish
    - third_party_contact
    - calendar_write
    - spend_money
    - data_delete
    - email_send
    - task_claim
  budgets:
    max_attempts: 3
    max_llm_calls: null
deliverables:
  artifacts:
    - "packages/orchestrator-production-deploy/package.yaml and lineage.yaml in AlobarQuest/intent-packages"
    - "Read-only infrastructure deploy plan produced in the separate infrastructure-mutation session"
    - "Production Coolify app for AlobarQuest/orchestrator at https://sds.alobar.net"
    - "Production PostgreSQL resource for the orchestrator"
    - "Backup coverage evidence for the production orchestrator database"
    - "Deployment evidence note with health/auth/rollback/resource/image facts and WS-4.1 dependency notes"
  destination: "Production Coolify plus intent-package governance records; implementation evidence should be stored in the relevant repo docs/evidence path chosen by the deploy session."
  recipient: devon
  definition_of_done: "Production orchestrator is reachable at sds.alobar.net, health/auth/backup/rollback evidence is recorded, no excluded Phase-4/Phase-5 surfaces are implemented, and Devon confirms WS-4.1 may depend on the deployment."
  operator_responsibilities:
    - "Approve or reject this exact package revision and hash."
    - "Approve the separate read-only infra deploy plan before mutation."
    - "Confirm any new credential or secret-write decision before it occurs."
    - "Review deployment evidence before WS-4.1 implementation depends on it."
