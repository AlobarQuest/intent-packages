schema_version: 1
package_id: rotation-bitbucket-mirror-token
title: Standing rotation of the mirror's Bitbucket token (bitbucket-mirror-token)
revision: 1
status: approved
created_by: factory-create
owner: devon
created_at: '2026-10-20T14:58:27Z'
supersedes: null
reach:
- external_system
profile: non-software-operational
profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its bitbucket
    adapter, from the rotation-executor VM. The decomposition is the adapter's fixed plan: a human
    act in which Devon creates a new Atlassian API token (Repository read and write on the
    alobarquest workspace) and pastes it into the staging secret rotation/bitbucket-mirror-
    token/<occurrence>/staging in Rotation / Work; unit store (verify_new, store); unit verify
    (verify_consumers), which waits unclaimed until the mirror has run with the new value; a human
    act in which Devon revokes the old token in the Atlassian console, only after the verify unit
    completes; and unit confirm (confirm_dead). No unit writes a hosted service, so each sets
    touches_no_hosted_service. The probe is GET /2.0/repositories/alobarquest?pagelen=1 with Basic
    auth (the registry's probe_email and the token): 200 for a live token, 401 for a random one. The
    mirror's Coolify application fetches the keeper from BWS with its own machine account at the
    start of each hourly cycle and is verified by its Healthchecks check github-to-bitbucket-mirror.
    Evidence carries fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    Bitbucket — GET /2.0/repositories/alobarquest?pagelen=1 with Basic auth as the probe
  - >-
    The Atlassian console (id.atlassian.com, Security, API tokens), where Devon creates and revokes
    tokens
  - >-
    Bitwarden Secrets Manager — the keeper in Rotation / Keepers and the staging and quarantine
    secrets in Rotation / Work
  - >-
    Healthchecks — the last run of github-to-bitbucket-mirror
  standing: true
  credential_id: bitbucket-mirror-token
  occurrence: '2026-10-20-requested'
  destinations:
  - 'bws-secret uuid="1078dcaf-c1cd-48a0-a794-b4030100cf24"'
  - 'provider name="bitbucket"'
  - 'runtime-fetch repo="github-to-bitbucket-mirror" ref="mirror.py"'
outcome:
  what: >-
    The mirror's Atlassian API token (registry id bitbucket-mirror-token) is replaced by a new token
    Devon creates, the keeper holds it, the mirror reads it, and the old token is revoked.
  why: >-
    The old token was exposed in the mirror's container logs on 2026-06-20. Increment 7 moved the
    mirror to fetch the keeper from BWS each cycle and built the bitbucket adapter, so the rotation
    is two console acts and the executor's checks (ADR-0055 amendment 10).
  beneficiary: >-
    Devon, whose GitHub-to-Bitbucket mirror pushes with a token the executor stores and proves dead
    after its revoke.
  success_signal: >-
    Every unit completes and both human acts are resolved, the keeper holds a value different from
    the one it started with, the mirror's check is up after a run since the keeper's revision, the
    old token answers 401 and the new one 200 at the probe, no staging or quarantine secret is left
    in Rotation / Work, and the next security-drift run reports no rotation finding for bitbucket-
    mirror-token.
scope:
  included:
  - >-
    The bitbucket adapter's two human acts and three units, worked by the rotation executor and
    Devon.
  excluded:
  - >-
    The mirror's GitHub PAT, rotated by its own package.
  - >-
    Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - >-
    Changing what the mirror mirrors.
  assumptions:
  - >-
    The rotation executor's timer is enabled in the VM at a revision carrying the bitbucket adapter
    (orchestrator 88f8407 or later).
  - >-
    The keeper 1078dcaf is moved to Rotation / Keepers before the first run, with a direct read
    grant for the mirror's machine account, and the root reads and writes it, confirmed with an
    empty HOME after the move. On 2026-10-20 it was in Ops / Platform and the root couldn't read it.
  - >-
    The mirror fetches both tokens from BWS each cycle (github-to-bitbucket-mirror #2) and pings its
    Healthchecks check only after a cycle that fetched and synced.
  open_questions: []
sources:
- location: >-
    orchestrator docs/decisions/0055-credential-rotation-runs-in-a-pull-based-executor.md, amendment
    10 (increment 7 decisions).
  authority_level: authoritative
  required_version: '2026-10-19'
  trust: trusted_instruction
  sensitivity: internal
- location: >-
    orchestrator docs/operations/rotation-executor.md, "GitHub PATs and the Atlassian token", "Mint
    and stage a value by hand" and "Scheduled readers".
  authority_level: authoritative
  required_version: '2026-10-20'
  trust: trusted_instruction
  sensitivity: internal
- location: >-
    infraops-mcp-server .cred-consumers.toml, credential bitbucket-mirror-token: its keeper,
    probe_email, probe_workspace, replacement_scope, and its scheduled reader with the Healthchecks
    check it pings.
  authority_level: authoritative
  required_version: '2026-10-20'
  trust: trusted_instruction
  sensitivity: internal
constraints:
  time_budget: >-
    The first human act whenever Devon is at the console; the store unit at its next pass; the
    verify unit once the mirror has run since the keeper's revision, which it does hourly; the
    revoke after verify completes; the confirm unit at its next pass.
  technology: The rotation executor at the orchestrator revision installed in the VM.
  policy_legal: null
  privacy_security: >-
    No token value appears in a transcript, a tool argument, a log or evidence. Values are
    identified by sha256 prefix and length only. A person pastes the new value into the staging
    secret in the Bitwarden console and clears the clipboard after.
  compatibility: null
  quality_accessibility: null
  operational: >-
    Every unit sets touches_no_hosted_service: none writes a hosted service, so none asks the
    live_estate window.
  other: []

# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: >-
    The staged token answers 200 at the probe, beside a random token refused 401 by the same probe.
  evidence_type: external_attestation
  evidence: >-
    external: the store unit's verify_new step's rotation-step/1 evidence, filed by the rotation
    executor.
  approver: devon
- id: AC-002
  condition: >-
    The old token is quarantined in Rotation / Work and the keeper reads back the new one.
  evidence_type: external_attestation
  evidence: >-
    external: the store step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-003
  condition: >-
    The keeper still holds the new token, and the mirror has run since the keeper's revision.
  evidence_type: external_attestation
  evidence: >-
    external: the verify unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-004
  condition: >-
    After Devon's revoke, the old token answers 401 at the probe and the new one 200, each beside a
    random token refused 401, and the staging and quarantine secrets are deleted.
  evidence_type: external_attestation
  evidence: >-
    external: the confirm_dead step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
authority:
  allowed:
  - secret_read
  - secret_write
  requires_approval: []
  prohibited:
  - credential_create
  - credential_revoke
  - repository_write
  - infra_mutation
  - outward_publish
  - email_send
  budgets:
    max_attempts: 3
    max_llm_calls: null
deliverables:
  artifacts:
  - A rotated token in the keeper, and terminal work units carrying each step's evidence.
  destination: the production ledger
  recipient: devon
  definition_of_done: >-
    Every unit is completed, every acceptance criterion carries evidence and an adjudication, every
    human act is resolved, and security-drift reports no rotation finding for bitbucket-mirror-
    token.
  operator_responsibilities:
  - >-
    Devon approves this revision, the change record and the decomposition, performs and resolves
    each human act, and adjudicates each /review gate.
dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0055 amendment 10: the bitbucket adapter, its human acts and the mirror's BWS fetch
    (2026-10-19).
  required_people_systems:
  - The rotation executor in the rotation-executor VM
  - Bitbucket
  - Bitwarden Secrets Manager
  - Healthchecks
  - Devon, at the Atlassian and Bitwarden consoles
  required_capabilities:
  - secret_read
  - secret_write
  blocking_conditions:
  - >-
    The executor refuses a unit at its checks; the refusal names the reason.
  - >-
    A mirror that stops pinging its check holds the verify unit unclaimed, and with it the revoke.
risk:
  failure_modes:
  - >-
    The new token lacks a scope the mirror needs: verify_new proves only that it reads the
    workspace, so the mirror's next cycle fails and pings /fail. Before the revoke the old token
    still works; create a corrected token and run again.
  - >-
    Devon revokes the old token before the verify unit completes: the mirror fails until it fetches
    the new value, at most one cycle.
  - >-
    A contract refusal fails a unit partway; the executor resumes from BWS on a retry after a
    requeue.
  max_impact: >-
    The mirror stops pushing until a corrected token is stored, if the new token's scope is wrong;
    after the revoke, the old token can't be restored.
  stop_conditions:
  - A value appears anywhere it should not.
  - The mirror's check goes down after store.
  rollback: >-
    Before Devon's revoke the old token stays valid; the recovery is a requeue or a new token. After
    the revoke the recovery is forward: create a new token and run the rotation again.
  escalation_target: devon
verification:
  independent_review:
  - Devon adjudicates each criterion against its evidence at /review.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of bitbucket-mirror-token, which arrives as a new revision.
  signals: []
  owner: devon
applicable_standards:
  project: '1.0'
  security: '1.0'
