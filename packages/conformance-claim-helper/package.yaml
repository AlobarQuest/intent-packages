risk:
  failure_modes:
    - "The helper reports green for a repository the real scanner would fail, producing a confident false attestation — strictly worse than the hand-typed claim it replaces, because it carries the authority of a machine."
    - "accepted_standards is derived in a way that can be made to echo standards_touched, which silently re-opens the tautology branch in the dispatch gate."
    - "The helper drifts from the scanners it wraps, so its answer and the gate's answer diverge over time."
  max_impact: "Bounded to the orchestrator repository and to the decomposition-authoring step. The helper is not called by the dispatch path, is read-only, and cannot mutate a work unit, an envelope, or production."
  stop_conditions:
    - "If the helper cannot derive accepted_standards from a real waiver source without echoing standards_touched, stop and escalate rather than shipping a claim that re-opens the tautology."
  rollback: "Revert the implementation commit and close the pull request; nothing else in the system depends on the helper."
  escalation_target: devon
verification:
  independent_review:
    - "An adversarial review before merge, per AC-007, targeting the two failure modes above."
  non_mechanical:
    - "Whether the helper's notion of 'the standards this change touches' matches what a human would mean by it — a judgment no test can make."
follow_up:
  required: true
  revisit_when: "When the orchestrator backlog's P3 item tightens the dispatch conformance gate's subset branch, since this helper is what would make requiring status green affordable."
  signals:
    - "A unit dispatches on a conformance claim this helper produced, and the repository's real scanner later disagrees."
  owner: devon
applicable_standards:
  project: "1.0"
  code: "1.0"
  security: "1.0"
