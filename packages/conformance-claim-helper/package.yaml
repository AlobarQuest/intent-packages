constraints:
  time_budget: null
  technology: "Python 3.12, matching the orchestrator's existing toolchain. The helper must import security_scan and portfolio from their existing local sources rather than vendoring or reimplementing either scanner."
  policy_legal: null
  privacy_security: "The helper reads repository state only. It must not read secrets, must not emit any file content into its output, and must not write to any tracked file."
  compatibility: "Additive only. No change to the authority envelope shape, which is a byte-pinned cross-repo contract with AlobarQuest/factory-runner."
  quality_accessibility: null
  operational: "Local-only and read-only: no network calls, no orchestrator API calls, no production configuration change."
  other: []
acceptance:
  - id: AC-001
    condition: "A helper computes standards_touched for a target repository from its real state, reporting the standards that actually apply rather than a hand-typed list."
    evidence_type: automated_test
    evidence: "gate: tests prove standards_touched is derived from repository state and that a repository touching a standard is reported as touching it"
    approver: policy
  - id: AC-002
    condition: "accepted_standards is derived exclusively from real waiver sources — project-standards exceptions frontmatter and the security-standards allowlist — and the helper cannot produce a claim in which accepted_standards merely echoes standards_touched."
    evidence_type: automated_test
    evidence: "gate: a named test proves the tautological claim is not producible, and that an accepted standard appears only when a real waiver source declares it"
    approver: policy
  - id: AC-003
    condition: "status is computed from the same scanners that would judge the repository (security_scan.cli.scan and portfolio.compliance.build_rows), and is green only when no unaccepted violation exists."
    evidence_type: automated_test
    evidence: "gate: tests prove status is green for a clean repository and not green when an unaccepted violation is present"
    approver: policy
  - id: AC-004
    condition: "A decomposition author can obtain the claim for a target repository through a single command without importing the module or hand-typing any part of the result."
    evidence_type: automated_test
    evidence: "gate: a test exercises the command surface and asserts it emits the complete claim"
    approver: policy
  - id: AC-005
    condition: "The change is additive and read-only: it adds no migration, no route, no lifecycle transition, and no production configuration change; it does not alter the authority envelope shape or the cross-repository envelope contract; and it introduces no path by which the orchestrator computes conformance for itself at dispatch time."
    evidence_type: automated_test
    evidence: "scan: the repository-wide scope guards, the cross-repository envelope contract test, and the security scan all pass"
    approver: policy
  - id: AC-006
    condition: "The repository's full quality gate passes on the pull-request head, with a non-zero collected test count."
    evidence_type: automated_test
    evidence: "gate: the Quality check passes on the pull-request head and its log reports a non-zero collected test count"
    approver: policy
  - id: AC-007
    condition: "An adversarial review challenges the helper before merge — specifically whether accepted_standards can be made to echo standards_touched by any input, and whether the helper's status can disagree with the scanner that would actually judge the repository — and its findings are resolved."
    evidence_type: human_review
    evidence: "human: Devon approves the implementation after an adversarial review resolves its findings"
    approver: devon
