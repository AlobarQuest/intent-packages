schema_version: 1
package_id: conformance-claim-helper
title: "Conformance claim helper — compute authority.conformance from real repo state"
revision: 1
status: draft
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-12T00:00:00Z"
supersedes: null
profile: software-delivery
profile_fields:
  repo: AlobarQuest/orchestrator
  branch: sds/conformance-claim-helper
  deploy_target: null
  required_checks:
    - Quality
  rollback_plan: "Revert the implementation commit on AlobarQuest/orchestrator (git revert) and close the pull request. The helper is additive and read-only: it introduces no migration, no route, no lifecycle transition, and no production configuration change, and nothing in the dispatch path calls it. Reverting it restores the status quo in which decomposition authors hand-type the conformance claim."
outcome:
  what: "A helper that computes a work unit's authority.conformance claim (standards_touched, accepted_standards, status) from real repository state, so a decomposition author no longer hand-types the claim the dispatch gate then trusts."
  why: "The dispatch conformance gate (services/dispatch.py::_conformance_blocked_reason) admits a unit when its envelope claims status green, or when standards_touched is a subset of accepted_standards. Today that claim is typed by hand by whoever authors the decomposition. A hand-typed attestation about machine-checkable facts is exactly the attestation-instead-of-refusal pattern the program has an open P1 to eliminate: nothing forces the claim to correspond to the repository it describes, and the subset branch is a tautology if an author ever echoes accepted = touched."
  beneficiary: "Devon, as the human who approves each unit's authority envelope and whose approval is what the conformance claim rides on."
  success_signal: "A decomposition author can obtain the conformance claim for a target repository by running one command, and the resulting claim is derived from the same scanners that would judge the repository, not from the author's memory."
scope:
  included:
    - "A helper that computes standards_touched, accepted_standards, and status for a given repository path and change surface."
    - "Derivation of accepted_standards from real waiver sources only (project-standards exceptions frontmatter and the security-standards allowlist), never echoed from standards_touched."
    - "A command-line surface so the claim can be produced without importing the module."
    - "Tests, including a test that the tautological claim (accepted echoing touched) cannot be produced by the helper."
  excluded:
    - "Any change to the dispatch conformance gate itself."
    - "Any change to how authority envelopes are approved or fingerprinted."
    - "Automatic insertion of the computed claim into a decomposition proposal."
    - "Tightening of the subset branch in _conformance_blocked_reason (tracked separately in the orchestrator backlog as a P3)."
  non_goals:
    - "Making the orchestrator call the scanners at dispatch time. The claim stays authored and human-approved; this package only removes the hand-typing."
    - "A new standards vocabulary. The helper reports the standards that already exist."
  assumptions:
    - "security_scan.cli and portfolio.compliance are importable and local-only, as recorded in the orchestrator backlog item that requests this helper. Verified importable 2026-07-12 before authoring."
    - "The helper runs on a local checkout of the target repository; it makes no network calls."
  open_questions: []
sources:
