constraints:
  time_budget: >-
    The mint unit in one live_estate window; the retire unit in a later window, once
    every scheduled reader has run since the keeper's revision; the slowest runs daily.
  technology: The rotation executor at the orchestrator revision installed in the VM.
  policy_legal: null
  privacy_security: >-
    No bearer value appears in a transcript, a tool argument, a log or evidence. Values are
    identified by sha256 prefix and length only; the hashes change-manager stores are never
    printed either.
  compatibility: >-
    The executor refuses any setting change-manager's boot would refuse that it can see: a value
    any other change-manager keeper holds, and a host without an overlap.
  quality_accessibility: null
  operational: >-
    No unit sets touches_no_hosted_service, so every claim asks the live_estate change window
    (02:00 to 06:00 America/New_York). A unit that writes waits while any registered
    change-manager reader's check shows as started, and asks again before each write and each
    restart. Distribute restarts the orchestrator, and refuses while a restart would strand a
    dispatched run.
  other: []

# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: >-
    A new bearer is minted, and its fingerprint differs from the keeper's current value.
  evidence_type: external_attestation
  evidence: >-
    external: the mint step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-002
  condition: >-
    The new bearer is staged in Rotation / Work.
  evidence_type: external_attestation
  evidence: >-
    external: the stage step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-003
  condition: >-
    Both Coolify rows of M2M_TOKEN_READ carry the new bearer's hash for the read entry with
    the old one as previous, change-manager restarted, and the new bearer answers 200 at the
    probe three times running.
  evidence_type: external_attestation
  evidence: >-
    external: the host step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-004
  condition: >-
    The new bearer answers 200 at /api/landing-policy, beside a random bearer refused 401 by the
    same probe.
  evidence_type: external_attestation
  evidence: >-
    external: the verify_new step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-005
  condition: >-
    The old bearer is quarantined in Rotation / Work and the keeper reads back the new bearer.
  evidence_type: external_attestation
  evidence: >-
    external: the store step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-006
  condition: >-
    Both Coolify rows of the orchestrator's ORCHESTRATOR_CHANGE_RECORD_TOKEN hold the new bearer,
    the orchestrator restarted with no dispatched run stranded, and its held-credentials route
    reports the new bearer's fingerprint.
  evidence_type: external_attestation
  evidence: >-
    external: the distribute step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-007
  condition: >-
    The keeper reads back the new bearer, the orchestrator reports it loaded for its held copy, and
    change-manager accepts it by probe beside a refused random bearer; the scheduled readers are
    counted, and each switches on its next run.
  evidence_type: external_attestation
  evidence: >-
    external: the mint unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-008
  condition: >-
    Every destination still holds the new bearer, re-read, re-probed and the held copy re-asked,
    and every scheduled reader has run since the keeper's revision.
  evidence_type: external_attestation
  evidence: >-
    external: the retire unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-009
  condition: >-
    The read entry's previous hash was the quarantined bearer's, the variable was written
    without it in both rows, change-manager restarted, and the old bearer is refused 401 three
    times running.
  evidence_type: external_attestation
  evidence: >-
    external: the retire_old step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-010
  condition: >-
    The old bearer is refused 401 and the new one answers 200, each beside a refused random
    bearer, and the staging and quarantine secrets are deleted.
  evidence_type: external_attestation
  evidence: >-
    external: the confirm_dead step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
authority:
  allowed:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  - infra_mutation
  requires_approval: []
  prohibited:
  - repository_write
  - outward_publish
  - email_send
  budgets:
    max_attempts: 3
    max_llm_calls: null
deliverables:
  artifacts:
  - A rotated bearer in the keeper, and terminal work units carrying each step's evidence.
  destination: the production ledger
  recipient: devon
  definition_of_done: >-
    Both units are completed, every acceptance criterion carries evidence and an adjudication,
    and security-drift reports no rotation finding for change-manager-read-bearer.
  operator_responsibilities:
  - Devon approves this revision, the change record, the decomposition, and each /review gate.
dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0055 amendment 9, "The change-manager adapter": one registry row per reader with its
    read, the probe route, and the restart wait (2026-10-18).
  - >-
    ADR-0055 amendment 13: the orchestrator's held copy is a destination, written at distribute and
    read back on its held-credentials route (2026-10-22).
  required_people_systems:
  - The rotation executor in the rotation-executor VM
  - change-manager and production Coolify
  - Bitwarden Secrets Manager
  - Healthchecks
  required_capabilities:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  - infra_mutation
  blocking_conditions:
  - The executor refuses a unit at its checks; the refusal names the reason.
  - >-
    A sibling change-manager keeper the root can't find or read fails host before anything is
    written.
  - A registered change-manager reader stays started past the wait; the step refuses.
  - A dispatched run is live when distribute would restart the orchestrator; the step refuses.
risk:
  failure_modes:
  - >-
    A contract refusal fails a unit partway; the executor resumes from BWS and the probe on a
    retry after a requeue.
  - >-
    A mint unit stalls after host with no attempts left: finish or undo it within the seven days
    the old value stays accepted, as the runbook's "If a change-manager rotation stalls after
    host" says.
  - >-
    A restart cuts short drift-audit.sh's change-manager sync, which has no check to wait on;
    that costs one night's sync, not the run.
  - >-
    A written value change-manager's boot refuses takes change-manager down until the variable
    is undone by hand in both rows and restarted; the executor refuses every such value it can
    see before writing.
  - >-
    Distribute stops after writing the orchestrator's copy and before its restart; change-manager
    accepts both values until retire, so nothing breaks, and a retry writes the copy again
    and restarts.
  max_impact: >-
    change-manager down until a hand undo and restart, if a restart fails to boot; or
    its readers refused if a stalled rotation passes its seven days. The other three bearer
    variables are never written.
  stop_conditions:
  - A value appears anywhere it should not.
  - change-manager doesn't come back after a restart.
  - The orchestrator doesn't come back after distribute's restart.
  rollback: >-
    Before retire_old: set M2M_TOKEN_READ to the read entry with previous.token_hash as its
    token_hash and no previous, in both rows, restart, and delete the staging secret; the keeper
    still holds the old value until store. After retire_old the recovery is forward: run the
    rotation again.
  escalation_target: devon
verification:
  independent_review:
  - Devon adjudicates each criterion against its evidence at /review.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of change-manager-read-bearer, which arrives as a new revision.
  signals: []
  owner: devon
applicable_standards:
  project: '1.0'
  security: '1.0'
