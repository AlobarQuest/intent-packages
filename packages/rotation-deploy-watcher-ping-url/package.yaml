# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: The executor reads the ping URL of the Healthchecks check named 'sds-deploy-watcher'
    from the Management key's check listing, before the unit is claimed; nothing is
    created.
  evidence_type: external_attestation
  evidence: 'external: the mint step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-002
  condition: The new value is staged in the executor's work store, with a fingerprint
    different from the old value's.
  evidence_type: external_attestation
  evidence: 'external: the stage step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-003
  condition: The new value is exactly the self-hosted instance's ping base followed
    by one UUID, and no other keeper of its type holds it; nothing pings it, because
    a ping marks the check up.
  evidence_type: external_attestation
  evidence: 'external: the verify_new step''s rotation-step/1 evidence, filed by the
    rotation executor.'
  approver: devon
- id: AC-004
  condition: The executor read the empty marker in the keeper before writing it, and
    the keeper reads back the new value; nothing is quarantined.
  evidence_type: external_attestation
  evidence: 'external: the store step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-005
  condition: Every consumer the registry names holds the new value, and the staging
    secret is deleted.
  evidence_type: external_attestation
  evidence: 'external: the verify_consumers step''s rotation-step/1 evidence, filed
    by the rotation executor.'
  approver: devon
