# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: The repository's named check passes on the pull-request head with the
    new tests present and collected.
  evidence_type: automated_check
  evidence: 'ci: the named check "Lint, type-check, and test" concludes success on
    the pull-request head'
  approver: policy
- id: AC-002
  condition: A reviewer confirms the new tests state the documented matching rules,
    cover more than one profile's tag map, and change no production behaviour.
  evidence_type: human_review
  evidence: 'review: devon confirms the tests lock case-sensitivity, the optional
    space after the colon, and leading-whitespace rejection across profiles, and that
    the diff adds tests only'
  approver: devon
