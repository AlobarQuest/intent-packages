schema_version: 1
package_id: evidence-tag-matching-guards
title: Lock the evidence-tag matching rules with tests
revision: 1
status: approved
created_by: factory-create
owner: devon
created_at: '2026-08-04T16:25:07Z'
supersedes: null
reach:
- source_repository
profile: software-delivery
profile_fields:
  repo: AlobarQuest/intent-packages
  branch: main
  deploy_target: null
  required_checks:
  - Lint, type-check, and test
  rollback_plan: The change is additive test code in tests/. Reverting the commit
    restores the previous state; no package, schema, or profile behaviour is touched,
    so nothing downstream depends on it.
outcome:
  what: Tests that lock how `check_evidence_tags` matches an acceptance item's evidence
    string against a profile's producer tags - that matching is case-sensitive, that
    the space after the colon is optional, and that leading whitespace is not tolerated
    - across every registered profile's tag map rather than one.
  why: >-
    The matching rule is a silent contract. `check_evidence_tags` matches with a bare
    `evidence.startswith(tag)`, so an uppercased tag is rejected as an unrecognized
    producer tag while both the spaced and unspaced lowercase forms are accepted.
    Nothing in the suite states any of that, so the behaviour could change under a
    refactor and no test would notice - and an author who uppercases a tag gets a
    message about unrecognized tags rather than about case. WS-P2.36 has just changed
    this module's neighbouring map, which is exactly when untested adjacent behaviour
    is most at risk.
  beneficiary: Package authors, who get a stable and documented matching rule instead
    of one that happens to hold; and any future session changing the tag maps, which
    can now refactor the matcher against a stated contract.
  success_signal: The new tests pass on the pull-request head, and each is shown to
    fail if the matcher is made case-insensitive or whitespace-tolerant.
scope:
  included:
  - Tests locking case-sensitive tag matching (an uppercased or mixed-case tag is
    rejected as unrecognized).
  - >-
    Tests locking that the space after a tag's colon is optional - the tag prefix is
    matched whether or not a space follows the colon, and both forms are accepted.
  - Tests locking that leading whitespace before a tag is not tolerated.
  - Coverage across every registered profile's tag map, not a single profile.
  excluded:
  - Any change to `check_evidence_tags` behaviour. The current matching is correct;
    this package only states it in tests. A diff that alters the matcher is out of
    scope.
  - Any change to any profile's TAG_TO_EVIDENCE_TYPE map, including the
    software-delivery map WS-P2.36 just corrected.
  - Merging the resulting pull request, which is Devon's own act.
  non_goals:
  - Making tag matching case-insensitive or whitespace-tolerant. The strictness is
    the intended behaviour; a lenient matcher would silently accept typo'd tags.
  - Centralizing the per-profile tag maps. Per-profile ownership is deliberate.
  assumptions:
  - The repository's named check is the job `Lint, type-check, and test`, which runs
    on pull_request.
  open_questions: []
sources:
- location: >-
    intent-packages PROJECT.md backlog, P3 added 2026-07-04: "profiles: no test locks
    evidence-tag case-sensitivity (e.g. an uppercased tag must be rejected as
    unrecognized) or the optional-space-after-colon convention across tags other than
    the one already covered".
  authority_level: authoritative
