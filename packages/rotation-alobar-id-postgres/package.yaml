  operational: null
  other: []

# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: The executor mints a new value with the provider's admin credential.
  evidence_type: external_attestation
  evidence: 'external: the mint step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-002
  condition: The new value is staged in the executor's work store, with a fingerprint
    different from the old value's.
  evidence_type: external_attestation
  evidence: 'external: the stage step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-003
  condition: The hosted service replaces the old value with the new one, and its dependents
    restart; they're unavailable until the restart finishes.
  evidence_type: external_attestation
  evidence: 'external: the host step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-004
  condition: The new value answers live at the provider's probe, beside a known-bad
    value the same probe refuses.
  evidence_type: external_attestation
  evidence: 'external: the verify_new step''s rotation-step/1 evidence, filed by the
    rotation executor.'
  approver: devon
- id: AC-005
  condition: The old value is quarantined and the keeper reads back the new one.
  evidence_type: external_attestation
  evidence: 'external: the store step''s rotation-step/1 evidence, filed by the rotation
    executor.'
  approver: devon
- id: AC-006
  condition: Every consumer the registry names holds the new value, or has run on
    it since it was stored.
  evidence_type: external_attestation
  evidence: 'external: the mint unit''s verify_consumers step''s rotation-step/1 evidence,
    filed by the rotation executor.'
  approver: devon
- id: AC-007
  condition: Every consumer the registry names holds the new value, or has run on
    it since it was stored.
  evidence_type: external_attestation
  evidence: 'external: the retire unit''s verify_consumers step''s rotation-step/1
    evidence, filed by the rotation executor.'
  approver: devon
- id: AC-008
  condition: The old value is revoked at the provider, proved live just before.
  evidence_type: external_attestation
  evidence: 'external: the retire_old step''s rotation-step/1 evidence, filed by the
    rotation executor.'
  approver: devon
- id: AC-009
  condition: The old value is refused and the new one answers live, each beside a
    refused known-bad value, and the staging and quarantine secrets are deleted.
  evidence_type: external_attestation
  evidence: 'external: the confirm_dead step''s rotation-step/1 evidence, filed by
    the rotation executor.'
  approver: devon
authority:
  allowed:
