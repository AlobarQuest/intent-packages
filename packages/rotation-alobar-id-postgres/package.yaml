  - provider name="postgres-role"
outcome:
  what: alobar-id-postgres (the authentik role in the Alobar ID Postgres container)
    is replaced by a new value, every destination the registry names holds it, and
    the old value is proved dead.
  why: The credential is due for rotation (2026-10-30-requested), and the registry
    hands its rotation to the SDS.
  beneficiary: Devon, whose credentials the SDS rotates.
  success_signal: Every unit completes, the keeper holds a value different from the
    one it started with, the old value is refused, and infraops reports no rotation
    finding for alobar-id-postgres.
scope:
  included:
  - The postgres-role plan's units, worked by the rotation executor.
  excluded:
  - Every other credential, each rotated by its own package.
  non_goals:
  - Changing what the credential can reach.
  assumptions:
  - The executor instance that keeps this credential runs the postgres-role adapter
    at a revision with derived plans (ADR-0055 amendment 15).
  open_questions: []
