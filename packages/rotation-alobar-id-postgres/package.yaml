  required_people_systems:
  - The rotation executor
  - Devon
  required_capabilities:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  - infra_mutation
  blocking_conditions:
  - The executor refuses a unit at its checks; the refusal names the reason.
risk:
  failure_modes:
  - A contract refusal fails a unit partway; the executor resumes from its store on
    a retry after a requeue.
  max_impact: The hosted service's dependents are unavailable while the service restarts
    on the new value, and the old value stops working at that step. The restart can
    happen at any hour of the change window.
  stop_conditions:
  - A value appears anywhere it should not.
  rollback: 'If the host step itself fails, the executor writes the old value back
    and restarts, leaving the keeper unchanged. Once host finishes, recovery is forward:
    a new value and the rotation run again.'
  escalation_target: devon
verification:
  independent_review:
  - The rotation verifier decides each criterion from the executor's step evidence.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of alobar-id-postgres, which arrives as a new revision.
  signals: []
  owner: devon
