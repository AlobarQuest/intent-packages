  - A rotated credential in its keeper, and terminal work units carrying each step's
    evidence.
  destination: the production ledger
  recipient: devon
  definition_of_done: Every unit is completed and every acceptance criterion carries
    evidence and an adjudication, and infraops reports no rotation finding for alobar-id-postgres.
  operator_responsibilities:
  - Devon approves this revision and the change record, and performs each act the
    executor announces.
dependencies:
  predecessor_packages: []
  external_decisions:
