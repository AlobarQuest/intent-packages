profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its
    bws-machine-token adapter, from its Keychain instance on the Mac, which holds the token
    (ADR-0055 amendment 12). The decomposition is the adapter's fixed plan: a human act in which
    Devon creates a new access token for the same machine account in the Bitwarden web app and runs
    rotation-worker stage, which takes it at a hidden prompt into the staging Keychain item
    rotation/bws-sds-operator-token/<occurrence>/staging and prints its fingerprint; unit store
    (verify_new, store, distribute); unit verify (verify_consumers), which reads the Keychain item
    back, waits unclaimed until each of the twelve registered readers has run since the switch, and
    proves the old token still logs in; a human act in which Devon revokes the old
    token in the web app, only after the verify unit completes; and unit confirm (confirm_dead),
    which the executor claims no earlier than 75 minutes after the revoke is recorded. No unit
    writes a hosted service, so each sets touches_no_hosted_service. The probe is a fresh login: a
    new Bitwarden SDK client in a child process with an empty HOME and the token on stdin, which
    logs in for a live token and answers invalid_client for a revoked or random one. The token is
    the read-only sds-operator identity, which reads only the SDS Operator project. Eleven
    orchestrator lanes and the portfolio scan read it each run and are verified by their
    Healthchecks checks, which needs the Keychain instance's read-only Healthchecks key.
    drift-audit.sh's mint-follow-ups step and the on-demand readers read the Keychain item fresh and
    are verified by its read-back alone (Devon, 2026-10-23). No reader holds it across runs.
    Evidence carries fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    Bitwarden Secrets Manager — a fresh login with the token as the probe, and the web app
    (Machine accounts, Access tokens), where Devon creates and revokes tokens
  - >-
    The Mac's login Keychain — the keeper Claude/BWS_ACCESS_TOKEN_SDS and the executor's staging,
    quarantine and Healthchecks key items under its own service
  - >-
    Healthchecks — the last runs of the portfolio-scan check and eleven orchestrator lanes' checks,
    read with the Keychain instance's read-only key
  standing: true
  credential_id: bws-sds-operator-token
  occurrence: '2026-10-23-requested'
  destinations:
  - 'keychain service="Claude" account="BWS_ACCESS_TOKEN_SDS"'
  - 'provider name="bitwarden-sm"'
  - 'runtime-fetch repo="orchestrator" ref="scripts/run-activation-sweep.sh"'
