dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0055 amendment 12: the Keychain instance, its identity and the bws-machine-token adapter
    (2026-10-21).
  required_people_systems:
  - The rotation executor's Keychain instance on the Mac
  - Bitwarden Secrets Manager
  - Devon, at the Bitwarden web app and the hidden prompt
  required_capabilities:
  - secret_read
  - secret_write
  blocking_conditions:
  - >-
    The executor refuses a unit at its checks; the refusal names the reason.
risk:
  failure_modes:
  - >-
    The new token belongs to another machine account: verify_new proves only that it logs in, so
    the keeper then holds a token that reads different projects, and the lanes' next runs fail;
    their checks show it before the revoke, so the old token is still live to fall back to.
  - >-
    Devon revokes the old token before the verify unit completes: verify refuses, because the old
    token no longer logs in, and the rotation stops before confirm.
  - >-
    A contract refusal fails a unit partway; the executor resumes from the Keychain on a retry after
    a requeue.
  max_impact: >-
    The keeper holds a token for the wrong account until a corrected one is stored; after the
    revoke, the old token can't be restored. Every SDS lane on the Mac fails until a working token
    is in the item.
  stop_conditions:
  - A value appears anywhere it should not.
  - A Keychain item reads back neither the old token nor the new one.
  - A registered reader's run after the switch fails.
  rollback: >-
    Before Devon's revoke the old token stays valid and is quarantined; the recovery is a requeue or
    a new token. After the revoke the recovery is forward: create a new token and run the rotation
    again.
  escalation_target: devon
verification:
  independent_review:
  - Devon adjudicates each criterion against its evidence at /review.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of bws-sds-operator-token, which arrives as a new revision.
  signals: []
  owner: devon
applicable_standards:
  project: '1.0'
  security: '1.0'
