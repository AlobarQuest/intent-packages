risk:
  failure_modes:
    - "A reused runner_attempt makes dispatch a silent no-op that returns an existing record with status dispatched and reason_code null while triggering nothing. Mitigated by verifying a new dispatch record id and a new Actions run rather than trusting the status field."
    - "Closing the dispatch window while the run is live restarts the orchestrator and strands the unit, because the runner calls the orchestrator at the end of its run and fail-run fails the same way. Mitigated by closing the window only once all three terminal conditions hold."
    - "The Quality workflow triggers on both push and pull_request for all branches, so the pull-request head carries two check runs of the same name. Neither the orchestrator nor factory verify queries GitHub, so which run is cited is chosen by the operator. Mitigated by recording both check-run identities in the report."
    - "A wrong authority envelope cannot be corrected: approve_decomposition_proposal refuses while an approved decomposition is unsuperseded, no supersede route exists, and unit authority has no mutation path. Mitigated by proving the whole ordered command list before authoring anything."
  max_impact: medium
  stop_conditions:
    - "Any of the Phase 1 preflight proofs fails."
    - "Dispatch does not produce a new record id and a new Actions run."
    - "The unit strands in executing after a window-close race."
  rollback: "The dependency change is confined to one pull request, which Devon can close unmerged. The dispatch window is closed by reverting the two environment variables and restarting. Nothing in this package mutates production data or schema."
  escalation_target: devon
verification:
  independent_review:
    - "Orchestrator's own Quality named check on the pull-request head, executed by GitHub Actions and not by the runner."
  non_mechanical:
    - "Devon's review of the pull-request diff before merge."
follow_up:
