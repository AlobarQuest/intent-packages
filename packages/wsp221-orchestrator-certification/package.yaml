package_id: wsp221-orchestrator-certification
title: "WS-P2.21 — certify orchestrator through the factory by moving uvicorn from 0.51.0 to 0.52.0"
revision: 1
status: approved
created_by: claude-code-interactive
owner: devon
created_at: '2026-07-31T22:12:06Z'
supersedes: null
profile: dependency-update
profile_fields:
  target_repo: AlobarQuest/orchestrator
  package: uvicorn
  from_version: '0.51.0'
  to_version: '0.52.0'
outcome:
  what: "One work unit moves uvicorn from 0.51.0 to 0.52.0 in AlobarQuest/orchestrator by editing the single pin site in pyproject.toml and regenerating uv.lock, and opens one pull request whose own Quality named check concludes success on the exact pull-request head."
  why: "Orchestrator is the third repository carried through the factory, and the only candidate whose certification proves something this system has never done. Its make check needs Postgres, a migrated database and SECURITY_STANDARDS_DIR, so it cannot honestly appear in an authority envelope — with no virtualenv it exits 0 having verified nothing, and with one it hard-fails at finalize. Verification must therefore come from the repository's own named check on the pull-request head, which is the automated_check plus verifier-owned named-check route that WS-P2.17 Increment 1 left able to resolve deterministically. Every acceptance criterion this system has settled so far was settled by a human."
  beneficiary: "Devon gets a third certified repository, and the first demonstration that an acceptance criterion in this factory can be decided by the verifier rather than by his judgment — or an honest, specific account of why it could not."
  success_signal: "Exactly one orchestrator work unit is created from a Devon-approved revision and decomposition; its approved authority envelope contains only the preflight-proven ordered command list; factory-runner opens one pull request that moves uvicorn 0.51.0 to 0.52.0; the Quality check concludes success on that pull request's head; and the WS-5.1 verifier evaluates AC-001 to passed without asking a human, or records a specific reason it could not."
scope:
  included:
    - "Author and approve this intent package before any work unit is created."
    - "Update exactly one dependency, uvicorn, from 0.51.0 to 0.52.0 in AlobarQuest/orchestrator. The update was confirmed genuinely available by uv lock --upgrade --dry-run, and is not covered by any open Dependabot pull request on that repository."
    - "Before authoring the authority envelope, prove the mutation against a clean clone of the real target repository — that the mutator yields a real diff, that the ordered command list is idempotent under repeated full execution in one checkout, that the verifier honestly executes rather than skipping, and that the verifier discriminates by failing on a known-bad tree — with a control run on an unmodified clone so an environmental failure is never mistaken for an update-induced one."
    - "Create exactly one Draft work unit through the WS-3.2 decomposition path, so the unit is stamped with its own constraints.work_unit_id."
    - "Record one named human authority approval bound to that unit's own authority fingerprint."
    - "Enable production dispatch for the minimum safe window: enable, verify from inside the container, dispatch the single unit, and close the window only after the Actions run has concluded, the unit has left executing, and cost actuals exist."
    - "Submit verifier-owned named-check evidence for AC-001 and let the WS-5.1 verifier adjudicate it, recording whether it resolved deterministically or fell to judgment_required, and the exact reason string either way."
  excluded:
    - "Any second work unit. This package authorizes one unit, one dispatch window, and one pull request."
    - "Any automatic merge, or any worker, agent, API, CLI, CI, or orchestrator path that merges a pull request. Devon alone merges the runner's pull request."
    - "Broadening the dispatch change-class allowlist beyond dependency-update, or the target beyond AlobarQuest/orchestrator."
    - "Any code change to the orchestrator, factory-runner, intent-packages, or the authority envelope contract. This is a governed run through the existing factory, not a build."
    - "Upgrading any dependency other than uvicorn, including the eleven other updates uv lock --upgrade currently offers."
    - "Recording certification evidence in the readiness kit. The kit's certification block has no evidence-recording affordance, so certified will remain false; that is a known open item rather than a result of this run."
  non_goals:
    - "Proving the dependency update is correct. Orchestrator's own Quality check and Devon's review decide that."
    - "Making dispatch automation permanent. The standing posture remains a separate Devon decision."
    - "Demonstrating throughput, concurrency, or queueing. One unit is the entire point."
  assumptions:
    - "AlobarQuest/orchestrator hosts the caller workflow at .github/workflows/factory-runner-pilot.yml on main, SHA-pinned to factory-runner ec509ae495f8a0eef16dd4986970f7c69a33bf51, and carries the four required Actions secrets FACTORY_RUNNER_TOKEN, FACTORY_RUNNER_CREDENTIAL_KEY_ID, ANTHROPIC_API_KEY and FACTORY_PR_TOKEN. All four were confirmed present."
    - "AlobarQuest/factory-runner is public, so a caller's GITHUB_TOKEN can install it."
    - "uvicorn is pinned at exactly one site in orchestrator, project.dependencies in pyproject.toml. The repository declares no project.optional-dependencies section at all, so the joint-resolution trap that makes a partially-updated pin unsatisfiable cannot apply here."
    - "uv lock --check is a verifier the bare hosted runner can honestly execute — it needs no service container, no environment variable and no migrated database. Confirmed by running it on a clean clone, and confirmed to discriminate by running it on a deliberately stale tree."
    - "Devon alone approves this package revision, registers the intake, approves the decomposition, approves the unit's authority, and merges the pull request."
  open_questions: []
