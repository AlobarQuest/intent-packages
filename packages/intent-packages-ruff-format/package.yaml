supersedes: null
reach:
- source_repository
profile: maintenance-remediation
profile_fields:
  repo: AlobarQuest/intent-packages
  remediation_source: >-
    Dependabot PR #50 (bump ruff 0.15.22 -> 0.16.1) has been blocked since
    2026-08-04: its `Lint, type-check, and test` check fails while `validate` and
    `Routing policy compatibility` pass. Measured 2026-08-07: the blocker is
    `ruff format --check`, NOT `ruff check` - the linter passes clean under
    0.16.1. ruff 0.16 changed inline-comment spacing (one space before `#`
    becomes two), and ruff formats Python code blocks embedded in markdown, so
    seven documentation files under docs/superpowers/ are the entire diff. This
    is the first execution of docs/operations/dependency-remediation.md in the
    orchestrator repo. Revision 1 was dispatched on 2026-08-07 and its attempt
    failed on max_turns without producing a diff: this repository pins ruff
    0.15.22, so `uv sync` gives the coding agent a formatter that considers the
    seven files already correct. The agent ran `make fix`, saw no change, ran
    `make check` seven times, and spent its turns trying to research what 0.16
    changed. Revision 2 names the mechanism instead of the goal - the reformat
    is produced by `uvx ruff@0.16.1 format .`, which fetches the proposed
    version without committing the bump, leaving the bump itself to Dependabot
    PR #50 as ADR-0016 intends.
  rollback_plan: >-
    Revert the PR. The change is whitespace inside fenced code blocks in seven
    markdown files; nothing imports them and no runtime behaviour depends on
    them.
  pr_url: 'https://github.com/AlobarQuest/intent-packages/pull/50'
outcome:
  what: >-
    `uvx ruff@0.16.1 format .` is run over the tree, which reformats exactly seven
    markdown files under docs/superpowers/ and leaves 103 files unchanged. Only
    whitespace inside fenced Python code blocks changes; no source file and no
    prose changes. Afterwards `ruff format --check .` passes under ruff 0.16.x as
    well as under the currently pinned 0.15.22. The repository's own `ruff` is
    0.15.22 and considers those files already correct, so `make fix` is a no-op
    here and is not the way to produce this change.
  why: >-
    ADR-0016 gives native auto-merge the routine dependency updates and gives the
    factory the ones that FAIL. This is that half, executed for the first time.
    The fix belongs on main rather than on Dependabot's branch: pushing to a
    producer's branch is overwritten by its next rebase. Verified forward- and
    backward-compatible on 2026-08-07 - after reformatting with 0.16.1, ruff
    0.15.22 reports every file already formatted, so main stays green before the
    version bump lands.
  beneficiary: >-
    Every future ruff bump in this repository, which stops being blocked by a
    formatter change nobody had applied.
  success_signal: >-
    A pull request against AlobarQuest/intent-packages whose diff is confined to
    those seven markdown files, on whose head the repository's own named check
    concludes success.
scope:
  included:
  - >-
    Run `uvx ruff@0.16.1 format .` over the tree so the seven affected markdown
    files adopt ruff 0.16's inline-comment spacing.
  excluded:
  - >-
    Bumping ruff itself. Dependabot PR #50 does that and already has auto-merge
    available; this package removes its blocker and lets the native lane finish.
  - >-
    The identical blocker in AlobarQuest/factory-runner (PR #33). That repository
    deliberately has no caller workflow (ADR-0015), so it is permanently outside
    this recipe and is remediated by hand.
  non_goals:
  - >-
    Any behaviour change. The entire diff is whitespace inside fenced code blocks
    in documentation.
  assumptions:
  - >-
    `ruff format` remains part of this repository's `make check`. If the gate
    stops running the formatter, this package's premise is gone and it should be
    re-authored rather than forced through.
  - >-
    `uvx` is available on the runner. The reusable workflow installs `uv` via
    setup-uv, and `uvx` ships with it; the coding agent used `uv sync`
    successfully on the revision-1 attempt, so this is observed rather than
    assumed.
  open_questions: []
sources:
- location: >-
    ADR-0016 (orchestrator/docs/decisions/0016) and its Stage-5 recipe
    docs/operations/dependency-remediation.md, which names PR #50 as the live
    worked example. Devon approved executing it on 2026-08-07 and granted per-run
    consent for the assistant to drive the browser gates in his authenticated
    session - so the intake and both /review approvals on this package are
    recorded against his identity while being performed by the assistant. Noted
    here because /review reads the actor from the forward-auth header (ADR-0014)
    and the ledger cannot express the distinction.
