    A pull request against AlobarQuest/intent-packages reformatting seven markdown
    files under docs/superpowers/.
  destination: AlobarQuest/intent-packages
  recipient: devon
  definition_of_done: >-
    The pull request exists, its diff is confined to those seven files, and the
    repository's named check is green on its head. Merging is a separate human act
    and is not part of this package.
  operator_responsibilities:
  - A merge into a production system must trace to recorded permission - either express
    permission given at the time of the merge, or a standing pre-authorization - recorded
    as evidence bound to this work unit. A merge that cannot be traced to one of those
    is a defect, whoever performed it. Outside production this constraint does not
    apply.
