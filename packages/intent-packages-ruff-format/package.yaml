# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: >-
    A pull request against AlobarQuest/intent-packages reformats exactly the seven
    markdown files ruff 0.16 flags, changes no other file, and the repository's
    named check concludes success on the pull-request head.
  evidence_type: automated_check
  evidence: >-
    ci: the target repository's named check on the pull-request head, observed
    from GitHub by the orchestrator rather than asserted by the caller.
  approver: policy
- id: AC-002
  condition: a reviewer confirms this package was ready before execution began
  evidence_type: human_review
  evidence: >-
    human: Devon's approval of this package at intake, recorded against the
    package revision.
  approver: devon
authority:
