risk:
  failure_modes:
  - >-
    The formatter touches a file beyond the seven. Measured against a clean clone
    at 1714a8f on 2026-08-07: `uvx ruff@0.16.1 format .` reports "7 files
    reformatted, 103 files left unchanged", and the ordered command list run twice
    in one checkout leaves the same seven files and `make check` green at 691
    collected / 691 passed. Any wider diff is visible before any merge, and the
    stop condition below refuses it.
  - >-
    The named check fails on the pull-request head. Nothing is affected; App Brain
    records this repository as inert, so an unmerged pull request changes nothing.
  max_impact: low
  stop_conditions:
  - The diff touches any file outside docs/superpowers/.
  - The diff changes anything other than whitespace inside fenced code blocks.
  rollback: >-
    Revert the pull request, or close it unmerged. Nothing outside the repository
    changes either way.
  escalation_target: devon
