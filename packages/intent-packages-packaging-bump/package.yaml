# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
#
# THIS PACKAGE DECLARES EXACTLY ONE CRITERION, AND THE ABSENCE OF THE USUAL AC-002
# HUMAN-REVIEW CRITERION IS DELIBERATE. ADR-0020 permits the factory to land its own
# pull request only when every criterion resolved deterministically from observed
# evidence "with no human adjudication", and the orchestrator's
# `verifier_decided_completion` disqualifies the UNIT - not merely the criterion - on
# any non-verifier adjudication recorded against it, including one for a criterion
# that was retained rather than mapped. A human-review criterion on this package would
# therefore be a live way to make the landing refuse, for a restatement of a judgment
# Devon's approval of this package at intake already carries.
acceptance:
- id: AC-001
  condition: >-
    A pull request against AlobarQuest/intent-packages moves uv.lock's `packaging`
    entry from 26.2 to 26.3, changes no other file, and the repository's named check
    concludes success on the pull-request head.
  evidence_type: automated_check
  evidence: >-
    ci: the target repository's `Lint, type-check, and test` job on the pull-request
    head, observed from GitHub by the orchestrator rather than asserted by the caller.
  approver: policy

# allowed_commands is an ORDERED list the worker re-executes at finalize, not a
# permission set: put mutators first and the verifier last, or the recorded
# evidence attests to a tree that is not the one pushed. `make check` must never
# appear in this repo's envelope. Use `uv venv --clear`, never bare `uv venv`.
#
# `merge_to_main` stays under requires_approval, where ADR-0001 puts it. It is not
# projected into the unit's capabilities by name; the decomposition author projects it
# as `github.pr.merge`, and the approval it requires is the human authority approval
# bound to that envelope's exact fingerprint.
authority:
  allowed:
  - repository_read
  - repository_write
  - test_execution
  requires_approval:
  - merge_to_main
  prohibited:
  - secret_write
  budgets:
    max_attempts: 3
    max_llm_calls: 120
deliverables:
  artifacts:
  - >-
    A pull request against AlobarQuest/intent-packages whose diff is uv.lock's
    `packaging` entry and nothing else, landed on `main` by the factory.
  destination: AlobarQuest/intent-packages
  recipient: devon
  definition_of_done: >-
    The pull request exists, its diff is confined to uv.lock, and the repository's
    named check is green on its head. The landing itself is NOT an acceptance
    criterion and cannot be: it necessarily happens after the unit completes, so no
    criterion could carry evidence of it. It is authorized instead by the unit's
    authority envelope, which grants `github.pr.merge`, and by the human approval
    bound to that envelope's fingerprint.
  operator_responsibilities:
  - A merge into a production system must trace to recorded permission - either express
    permission given at the time of the merge, or a standing pre-authorization - recorded
    as evidence bound to this work unit. A merge that cannot be traced to one of those
    is a defect, whoever performed it. Outside production this constraint does not
    apply.
  - >-
    The recorded permission for THIS merge is the human authority approval bound to
    the unit's exact authority fingerprint - the envelope that grants
    `github.pr.merge`. It is a standing pre-authorization in ADR-0020's sense: given
    before the work existed, to a named capability, for one unit.
dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0020 - the factory closes its own loop. Accepted 2026-08-08. Without it this
    package's landing is prohibited in nine places in the orchestrator's source tree.
  required_people_systems: []
  required_capabilities:
  - merge_to_main
  blocking_conditions:
  - >-
    The unit's authority envelope must grant `github.pr.merge` at `allowed` - the
    projection of the `merge_to_main` term above into the unit capability vocabulary.
    No envelope in production has ever carried it; the capability name was declared
    cross-repo by WS-P3.7 Increment 3 and grants nothing on its own.
risk:
  failure_modes:
  - >-
    The mutator yields no diff and the unit dies on `no changes to submit`. Measured
    against a clean `git archive origin/main` extraction at dab83d6 on 2026-08-10: the
    ordered command list run twice in one checkout moves `packaging` 26.2 -> 26.3 on
    the first pass, is a byte-identical no-op on the second, and `uv lock --check`
    exits 0 both times.
  - >-
    The named check fails on the pull-request head. Measured on the same mutated tree
    with Python 3.12.13, the version CI pins: `make check` rc=0, ruff clean, 111 files
    already formatted, pyright 0 errors, 694 collected and 694 passed.
  - >-
    The landing turns out not to be inert. App Brain records this repository's default
    branch as `inert`, and the orchestrator refuses to land into a repository the
    estate calls anything else - read from the estate at the moment of the act, never
    from a list of repository names.
  max_impact: low
  stop_conditions:
  - The diff touches any file other than uv.lock.
  - The diff moves any locked package other than `packaging`.
  - >-
    Any acceptance criterion resolves on anything but observed
    `verifier.github.named_check` evidence, or any human adjudication is recorded
    against the unit. Either makes the landing refuse, and correctly.
  rollback: >-
    `git revert` the landed commit in AlobarQuest/intent-packages. App Brain records
    landing on that repository's default branch as `inert`, so nothing redeploys and
    there is no image to re-point. There is no rule to withdraw: the permission to
    land was per-unit, in one envelope, and it is spent.
  escalation_target: devon
verification:
  independent_review: []
  non_mechanical: []
follow_up:
  required: false
  revisit_when: null
  signals: []
  owner: null
applicable_standards:
  project: '1.0'
