schema_version: 1
package_id: intent-packages-packaging-bump
title: Bump packaging to 26.3 in intent-packages
revision: 1
status: approved
created_by: factory-create
owner: devon
created_at: '2026-08-10T12:36:08Z'
supersedes: null
reach:
- source_repository
profile: dependency-update
profile_fields:
  target_repo: AlobarQuest/intent-packages
  package: packaging
  from_version: '26.2'
  to_version: '26.3'
outcome:
  what: >-
    intent-packages' uv.lock moves `packaging` from 26.2 to 26.3. `packaging` is a
    TRANSITIVE dependency - it is absent from pyproject.toml, reached through pytest -
    so the mutator is `uv lock --upgrade-package 'packaging==26.3'` and the entire
    diff is six lines of uv.lock: the version, the sdist URL and hash, and the wheel
    URL and hash. No declared constraint changes, no source file changes, and no lint
    or type surface is touched. The pull request the factory opens is then LANDED BY
    THE FACTORY under ADR-0020, with no person acting at the merge.
  why: >-
    This is WS-P3.7 exit criterion 5: the first irreversible act the factory takes
    without a human at the merge. ADR-0020 permits it for a bounded class - every
    acceptance criterion resolved deterministically from OBSERVED evidence, with no
    human adjudication, into a repository where landing on the default branch deploys
    nothing. The subject is chosen so that the only unproven thing about the run is the
    landing itself. AlobarQuest/intent-packages is the one repository in the estate
    where a unit has already completed on observed `verifier.github.named_check`
    evidence (WS-P2.36, unit a1493627), and App Brain records landing on its default
    branch as `inert`. A transitive lockfile-only bump keeps the blast radius at its
    floor: the alternative available upgrade, ruff 0.16.1 -> 0.16.2, is a declared
    floor in two sections whose bump makes CI run a new linter over the whole tree -
    the shape that cost pull request 50 a package revision on 2026-08-07.
  beneficiary: >-
    The estate. Every routine change that follows can be landed by the factory rather
    than queued behind a human touch that ADR-0020 records as adding nothing he can
    meaningfully exercise.
  success_signal: >-
    A commit reaches AlobarQuest/intent-packages `main`, placed there by the factory,
    whose diff is confined to uv.lock's `packaging` entry - with the orchestrator
    holding its own record of the landing and no person having acted at the merge.
scope:
  included:
  - >-
    Run `uv lock --upgrade-package 'packaging==26.3'` in a checkout of
    AlobarQuest/intent-packages so uv.lock's `packaging` entry moves 26.2 -> 26.3,
    then `uv lock --check` to prove the lockfile is consistent with pyproject.toml.
  excluded:
  - >-
    The other upgrade available in this repository on 2026-08-10, ruff 0.16.1 ->
    0.16.2. It is a declared `>=` floor in both `[project.optional-dependencies].dev`
    and `[dependency-groups].dev`, and moving it makes the named check run a new
    linter over the entire tree - a wider surface than the first autonomous landing
    should carry. It is left to Dependabot's own lane.
  - >-
    Any edit to pyproject.toml. `packaging` is transitive; declaring it would be a
    larger change than the one being made and would outlive this package.
  non_goals:
  - >-
    Any behaviour change. Nothing imports `packaging` in this repository's source; it
    arrives through pytest.
  assumptions:
  - >-
    `uv` is present on the runner without a project virtualenv. Proven by control on
    2026-08-10 rather than assumed: both commands were run against a tree extracted
    with `git archive origin/main` (no .venv) under `PATH=~/.local/bin:/usr/bin:/bin`,
    and both succeeded - neither command needs a synced environment, which is why this
    envelope carries no `uv sync`.
  - >-
    `packaging` 26.3 remains the newest release satisfying this project's constraints.
    The mutator pins the exact version in its specifier, so a 26.4 published mid-run
    cannot move the lock past the version this package declares.
  open_questions: []
sources:
- location: >-
    ADR-0020 (orchestrator/docs/decisions/0020-the-factory-closes-its-own-loop.md,
    accepted 2026-08-08) and the WS-P3.7 exit-criterion-5 handoff
    (~/docs/software-delivery-system/2026-08-10-wsp37-criterion5-handoff.md), which
    chose this target repository and this change and recorded the measurements behind
    both. Devon's sentence governing the workstream: "Yes, I want the factory to close
    its own loop." Devon granted per-run consent on 2026-08-10 for the assistant to
    perform two gates on his behalf: the approval of this package through the audited
    intent_packages CLI, and the intake and decomposition-proposal approval in
    /review. Both are therefore recorded against his identity while being performed by
    the assistant, and neither the lineage ledger nor /review can express the
    distinction - /review reads the actor from the forward-auth header (ADR-0014), and
    `approve --approver devon` records the identity it is given. The authority approval
    that binds this unit's envelope - the gate that grants `github.pr.merge` - is NOT
    covered by that consent and is performed by Devon himself.
  authority_level: authoritative
  required_version: null
  trust: trusted_instruction
  sensitivity: internal
