outcome:
  what: "The orchestrator can map protocol-relevant lifecycle, evidence, adjudication, waiver, claim, context, package-intake, decomposition, and outcome facts into valid factory-event/v1 envelopes with idempotent local publication or export status."
  why: "Phase 3 needs externally observable audit events for protocol evidence while preserving the orchestrator database as canonical lifecycle truth and without starting factory-runner dispatch, production deployment, or Phase-5 verification."
  beneficiary: "Devon, future factory workers, future verifiers, and audit/reporting consumers that need observable protocol facts without taking lifecycle authority away from the orchestrator."
  success_signal: "Approved WS-3.3 protocol evidence can be projected to schema-valid factory-event/v1 records, actor IDs are registered or explicitly rejected/mapped, repeated publication is idempotent, failures are inspectable and retryable, and no external event record can mutate orchestrator lifecycle state."
scope:
  included:
    - "Re-establish the merged WS-3.3 baseline before design or implementation, including clean repository status, safe fast-forward to main, closed WS-3.1/WS-3.2/WS-3.3 hash verification, intent-package validation, orchestrator make check, security-standards factory-events checks, current foundation matrix result, and project-standards enrollment status for orchestrator."
    - "Author and obtain Devon approval of this exact WS-3.4 intent package revision and hash before changing orchestrator or security-standards application code."
    - "Write a WS-3.4 design specification in AlobarQuest/orchestrator and, only if the approved design requires schema or registry changes, a companion security-standards design note."
    - "Resolve the required WS-3.4 design decisions explicitly: package boundary, touched repositories, publication mechanism, mapping table, deterministic event ID strategy, actor mapping, field population, publishable-event set, failed publication storage and retry, inspection surface, Evidence Pack event-ID display, live-store avoidance for tests, Phase-4/Phase-5 seams, and WS-3.3 migration strategy."
    - "Run and record an adversarial architecture review of the design before implementation planning."
    - "Write and obtain approval for a task-level implementation plan before application-code changes."
    - "Implement deterministic mapping from canonical orchestrator local events and evidence-related rows to factory-event/v1 envelopes."
    - "Preserve orchestrator local events, evidence, adjudications, waivers, claims, context snapshots, package intake, decomposition, work-unit state, and status-ledger projection inputs as the only canonical lifecycle facts."
    - "Validate every exported or published event against security-standards/schema/factory-event.v1.schema.json and registered actor IDs in security-standards/registry."
    - "Reject or explicitly map unknown human, worker, system, verifier, historical, and fixture actors according to the approved design."
    - "Populate work_package, input_revision, target, actor, action, result, evidence references, authority_grant, correlation_id, timestamp, and source.ref from canonical source facts where available, and report absent facts honestly."
    - "Provide idempotent publication or export semantics keyed by canonical source fact identity so retry after partial failure cannot duplicate the same external event."
    - "Store or derive local publication status for pending, published or exported, skipped, rejected, and failed facts in a way Devon can inspect without making external events canonical."
    - "Expose API and CLI behavior, or a generated report if the design proves it is sufficient, for Devon to inspect evidence-event publication status."
    - "Optionally include external event IDs in Evidence Pack projections if the approved design judges that useful; Evidence Pack remains a read-only projection."
    - "Fail closed on publication failure: record attributable failure status and allow retry without mutating lifecycle state, completing work units, approving acceptance criteria, dispatching workers, or bypassing human authority."
    - "Use disposable local stores, export files, or test fakes for acceptance; do not mutate the live factory-events store during tests."
    - "Keep seams stable for later Phase-4 factory-runner dispatch and Phase-5 independent verifier consumption without implementing either."
  excluded:
    - "Factory runner, automatic dispatch, GitHub Actions worker execution, workflow_dispatch, or worker scheduling."
    - "Production deployment automation, Coolify mutation, or live infrastructure mutation."
    - "Phase-5 independent verifier logic, automatic acceptance-criterion adjudication, or release approval."
    - "Linear, Todoist, GitHub, or any tracker becoming canonical lifecycle state."
    - "Automatic merge or any worker, agent, API, CLI, CI, or UI path that merges pull requests."
    - "Autonomous intent approval, autonomous decomposition approval, worker-controlled canonical completion, or external-event-controlled lifecycle mutation."
    - "Brain learning, knowledge promotion, production observation loop, additional agent personas, generalized visual workflow builder, or listing-specific intent profile."
    - "Broad refactors of change-manager, intent-packages, security-standards, project-standards, or brain."
    - "Project-standards onboarding changes unless this package is revised and approved to include them."
    - "Writing secrets, live DSNs, BWS token material, or production event-store credentials into tracked files."
  non_goals:
    - "Completing Phase 4 or Phase 5."
    - "Turning factory-event/v1 or the append-only factory-events store into lifecycle authority."
    - "Making change-manager the generic orchestrator or moving drift and sensitive-infrastructure authority out of change-manager."
    - "Changing intent-package approval, hash, or lifecycle ownership."
  assumptions:
    - "WS-3.1, WS-3.2, and WS-3.3 are merged, closed, and verified on main before this package is approved."
    - "security-standards owns factory-event/v1 schema, factory_events envelope/store helpers, actor registry, capability registry, append-only store, and nightly projection machinery."
    - "intent-packages remains canonical for package content, revision numbering, hash behavior, package lifecycle, and approval ledger."
    - "orchestrator remains canonical for work-unit lifecycle truth and evidence facts."
    - "PostgreSQL remains the orchestrator concurrency and migration target for acceptance tests."
    - "Devon alone approves exact package revisions, approves sensitive transitions, reviews PRs, and merges PRs."
  open_questions: []
