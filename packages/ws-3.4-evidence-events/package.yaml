acceptance:
  - id: AC-001
    condition: "The merged WS-3.3 baseline is re-established before implementation begins, including clean repository status, fast-forwarded main branches where clean, WS-3.1/WS-3.2/WS-3.3 hash verification, intent-packages validate --all, intent-packages make check, orchestrator make check, security-standards factory-events and registry checks, the current foundation matrix result, and orchestrator project-standards enrollment status."
    evidence_type: automated_test
    evidence: "gate: baseline command transcript records exact repository state and command results before application-code changes"
    approver: policy
  - id: AC-002
    condition: "An approved WS-3.4 design specification explicitly resolves all thirteen required design decisions and preserves the package scope guards."
    evidence_type: human_review
    evidence: "human: Devon reviews and approves the design specification before implementation planning"
    approver: devon
  - id: AC-003
    condition: "An adversarial architecture review is run before implementation and blocking findings are resolved or this package is revised."
    evidence_type: human_review
    evidence: "human: design review record lists findings, resolutions, and any accepted residual risk"
    approver: devon
  - id: AC-004
    condition: "A task-level implementation plan is approved before orchestrator or security-standards application code changes."
    evidence_type: human_review
    evidence: "human: Devon approves the implementation plan after reviewing task boundaries and verification steps"
    approver: devon
  - id: AC-005
    condition: "Approved WS-3.3 protocol evidence and lifecycle facts can be mapped deterministically to valid factory-event/v1 envelopes."
    evidence_type: automated_test
    evidence: "gate: mapper tests cover representative WS-3.1, WS-3.2, and WS-3.3 source facts and validate each envelope against security-standards schema"
    approver: policy
  - id: AC-006
    condition: "The mapping table includes protocol-relevant local event actions and evidence-related rows for evidence submissions, adjudications, waivers, claim and reclaim lifecycle facts, context preflight decisions, authority-update decisions, package intake, decomposition decisions, completion, revision-required, and failure outcomes where in scope."
    evidence_type: automated_test
    evidence: "gate: mapping coverage tests and architecture review confirm every approved publishable source action has an explicit factory-event/v1 action/result or explicit skip reason"
    approver: policy
  - id: AC-007
    condition: "Every exported or published event validates against security-standards/schema/factory-event.v1.schema.json."
    evidence_type: automated_test
    evidence: "gate: schema-validation tests fail on malformed envelopes and pass on generated envelopes"
    approver: policy
  - id: AC-008
    condition: "Actor IDs are registered in the security-standards agent registry or are explicitly rejected or mapped according to the approved design, preserving the raw source actor in evidence when mapped."
    evidence_type: automated_test
    evidence: "gate: actor-validation tests cover registered actors, unknown actors, historical actors, and mapped source actors"
    approver: policy
  - id: AC-009
    condition: "Event IDs are deterministic and idempotent for each canonical source fact, and retry after partial failure cannot duplicate external events."
    evidence_type: automated_test
    evidence: "gate: idempotency tests cover repeated export, interrupted publication, and retry after failure"
    approver: policy
  - id: AC-010
    condition: "Publication failure is attributable and inspectable locally without mutating work-unit lifecycle state, completing work, approving criteria, dispatching workers, or bypassing human authority."
    evidence_type: automated_test
    evidence: "gate: failure-path tests assert lifecycle rows are unchanged while publication status captures actor, source fact, error, attempt, and retry eligibility"
    approver: policy
  - id: AC-011
    condition: "Published or exported envelopes preserve work_package, input_revision, target, actor, action, result, evidence references, authority_grant, correlation_id, source references, and timestamp facts where available, and report absent fields honestly."
    evidence_type: automated_test
    evidence: "gate: field-population tests compare generated envelopes to canonical orchestrator rows for revisions, units, events, evidence, adjudications, waivers, claims, and context snapshots"
    approver: policy
  - id: AC-012
    condition: "API and CLI behavior, or an approved generated report, exposes pending, exported or published, skipped, rejected, and failed evidence-event publication status for Devon inspection."
    evidence_type: automated_test
    evidence: "gate: API/CLI/report tests cover filters, source references, event IDs where available, failure details, and retry eligibility"
    approver: policy
  - id: AC-013
    condition: "Evidence Pack remains a read-only projection and, if external event IDs are included in WS-3.4, they are displayed as publication facts rather than editable lifecycle state."
    evidence_type: automated_test
    evidence: "gate: Evidence Pack tests or architecture guards prove publication status display is read-only and not a mutation surface"
    approver: policy
  - id: AC-014
    condition: "The implementation uses disposable local stores, export files, or fakes for acceptance tests and does not mutate the live factory-events store."
    evidence_type: automated_test
    evidence: "gate: tests set isolated FACTORY_EVENTS_HOME or equivalent and assert no live-store path is touched"
    approver: policy
  - id: AC-015
    condition: "Existing WS-3.1, WS-3.2, and WS-3.3 transition, claim, evidence, intake, decomposition, context, reclaim, status-ledger, API, CLI, UI, migration, and architecture tests continue to pass."
    evidence_type: automated_test
    evidence: "gate: full local orchestrator make check passes against the local PostgreSQL endpoint"
    approver: policy
  - id: AC-016
    condition: "Any security-standards changes required by the approved design are minimal, schema/registry-compatible, and pass security-standards make check plus focused factory-events and registry tests."
    evidence_type: automated_test
    evidence: "gate: security-standards make check and focused factory-events/agent-registry tests pass, or the evidence index states security-standards was not touched"
    approver: policy
  - id: AC-017
    condition: "No automatic merge, factory dispatch, production deploy, tracker-canonical path, Phase-5 verifier path, worker-controlled completion, or broad out-of-scope refactor exists in the WS-3.4 diff."
    evidence_type: automated_test
    evidence: "scan: scope-guard tests, repository search assertions, and final whole-branch review pass"
    approver: policy
  - id: AC-018
    condition: "Devon reviews the PR after the exact named Quality check succeeds; the worker may prepare a ready-for-review PR, but Devon alone merges."
    evidence_type: human_review
    evidence: "human: Devon confirms review and merge decision; merge remains outside worker authority"
    approver: devon
