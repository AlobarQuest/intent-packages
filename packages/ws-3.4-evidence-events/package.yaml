risk:
  failure_modes:
    - "External event publication is accidentally treated as lifecycle authority."
    - "Event IDs are non-deterministic or keyed too broadly, causing duplicate records on retry."
    - "Unknown actors are silently laundered without preserving raw source identity."
    - "Publication failures block or mutate work-unit lifecycle instead of remaining observable retry state."
    - "The mapping omits protocol-relevant evidence or context facts needed by Phase 5."
    - "Tests accidentally write to the live factory-events store."
    - "Security-standards schema changes expand the event envelope more than WS-3.4 needs."
  max_impact: "Local orchestrator and optional security-standards code changes plus disposable local event-store/export artifacts; no production infrastructure, live event-store mutation, or automatic merge."
  stop_conditions:
    - "A baseline check is red for an in-scope reason."
    - "A required design decision cannot be resolved inside the approved WS-3.4 boundary."
    - "Implementation would make external factory-event records canonical lifecycle truth."
    - "Implementation would require secrets, live DSNs, production deployment, Coolify mutation, factory-runner dispatch, workflow_dispatch, automatic merge, tracker-canonical state, or Phase-5 verifier logic."
    - "Disposable-store isolation cannot be proven for tests."
  rollback: "Before merge, revert or abandon WS-3.4 branches and leave this package unapproved, rejected, or superseded as appropriate. After merge, use a forward migration or follow-up package to disable publication/export surfaces while preserving canonical orchestrator rows and local events; do not delete canonical evidence or lifecycle records."
