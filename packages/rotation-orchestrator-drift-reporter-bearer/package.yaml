    its hashed entry in the orchestrator's credentials setting, and its eight scheduled readers
    with the observation each posts.
  authority_level: authoritative
  required_version: '2026-10-18'
  trust: trusted_instruction
  sensitivity: internal
- location: >-
    orchestrator docs/operations/rotation-executor.md, "The orchestrator's bearers", "Scheduled
    readers", and the two sections on a stalled rotation and a failed restart.
  authority_level: authoritative
  required_version: '2026-10-18'
  trust: trusted_instruction
  sensitivity: internal
constraints:
  time_budget: >-
    The mint unit in one live_estate window; the retire unit in a later window, once every
    scheduled reader has posted since the keeper's revision. The two Sunday readers
    (verify-backup.sh, hetzner-snapshot.sh) can make that up to eight days, past the overlap's
    until; the weekly readers hold retire regardless (ADR-0055 amendment 9).
  technology: The rotation executor at the orchestrator revision installed in the VM.
  policy_legal: null
  privacy_security: >-
    No bearer value appears in a transcript, a tool argument, a log or evidence. Values are
    identified by sha256 prefix and length only; the hashes the orchestrator stores are never
    printed either.
  compatibility: >-
    The executor refuses any setting the orchestrator's boot would refuse, applying the same
    rules before it writes.
  quality_accessibility: null
  operational: >-
    No unit sets touches_no_hosted_service, so every claim asks the live_estate change window
    (02:00 to 06:00 America/New_York). Never restart while a dispatched run is live; the
    executor checks before each write and each restart.
  other: []

# ac_id means two different things and nothing checks the difference:
#   - a decomposition proposal's ac_mappings[].ac_id / retained_acs[].ac_id want
#     the criterion's database UUID
#   - evidence and adjudication want the human string below, e.g. AC-001
# Getting it wrong is a bare package_acceptance_criterion_not_found with no hint.
acceptance:
- id: AC-001
  condition: >-
    A new bearer is minted, and its fingerprint differs from the keeper's current value.
  evidence_type: external_attestation
  evidence: >-
    external: the mint step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-002
  condition: >-
    The new bearer is staged in Rotation / Work.
  evidence_type: external_attestation
  evidence: >-
    external: the stage step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-003
  condition: >-
    Both Coolify rows of ORCHESTRATOR_M2M_CREDENTIALS carry the new bearer's hash for
    orchestrator-drift-reporter with the old one as previous, the orchestrator restarted, and its
    identities route shows the new hash loaded.
  evidence_type: external_attestation
  evidence: >-
    external: the host step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-004
  condition: >-
    The new bearer answers 200 at the status ledger, beside a random bearer refused 401 by the
    same probe.
  evidence_type: external_attestation
  evidence: >-
    external: the verify_new step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-005
  condition: >-
    The old bearer is quarantined in Rotation / Work and the keeper reads back the new bearer.
  evidence_type: external_attestation
  evidence: >-
    external: the store step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-006
  condition: >-
    The keeper reads back the new bearer and the orchestrator accepts it by probe beside a
    refused random bearer; the scheduled readers are counted, and switch on their next runs.
  evidence_type: external_attestation
  evidence: >-
    external: the mint unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-007
  condition: >-
    Every destination still holds the new bearer, re-read and re-probed, and every scheduled
    reader has posted its observation since the keeper's revision.
  evidence_type: external_attestation
  evidence: >-
    external: the retire unit's verify_consumers step's rotation-step/1 evidence, filed by the
    rotation executor.
  approver: devon
- id: AC-008
  condition: >-
    The entry's previous hash was the quarantined bearer's, the setting was written without it
    in both rows, and the orchestrator restarted and loaded it.
  evidence_type: external_attestation
  evidence: >-
    external: the retire_old step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
- id: AC-009
  condition: >-
    The old bearer is refused 401 and the new one answers 200, each beside a refused random
    bearer, and the staging and quarantine secrets are deleted.
  evidence_type: external_attestation
  evidence: >-
    external: the confirm_dead step's rotation-step/1 evidence, filed by the rotation executor.
  approver: devon
authority:
  allowed:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  - infra_mutation
  requires_approval: []
  prohibited:
  - repository_write
  - outward_publish
  - email_send
  budgets:
    max_attempts: 3
    max_llm_calls: null
deliverables:
  artifacts:
  - A rotated bearer in the keeper, and terminal work units carrying each step's evidence.
  destination: the production ledger
  recipient: devon
  definition_of_done: >-
    Both units are completed, every acceptance criterion carries evidence and an adjudication,
    and security-drift reports no rotation finding for orchestrator-drift-reporter-bearer.
  operator_responsibilities:
  - Devon approves this revision, the change record, the decomposition, and each /review gate.
dependencies:
  predecessor_packages: []
  external_decisions:
  - >-
    ADR-0055 amendment 9: decision 5 for the drift-reporter's readers (observations, Devon
    2026-10-16), weekly readers gating retire (2026-10-18), and "Decision 3 revised" (the
    observer first without an overlap, then this bearer with one, 2026-10-18).
  required_people_systems:
  - The rotation executor in the rotation-executor VM
  - The orchestrator and production Coolify
  - Bitwarden Secrets Manager
  required_capabilities:
  - credential_create
  - credential_revoke
  - secret_read
  - secret_write
  - infra_mutation
  blocking_conditions:
  - The executor refuses a unit at its checks; the refusal names the reason.
  - >-
    The observer's mint unit hasn't completed: the observer would still hold this bearer's old
    hash as current, and the executor refuses the host as boot would.
  - A dispatched run is live; the executor waits rather than restart.
risk:
  failure_modes:
  - >-
    A contract refusal fails a unit partway; the executor resumes from BWS and the identities
    route on a retry after a requeue.
  - >-
    A mint unit stalls after host with no attempts left: finish or undo it within the seven days
    the old value stays accepted, as the runbook's "If a rotation stalls after host" says.
  - >-
    A Sunday reader doesn't post: retire waits past until, and every reader still on the old
    value gets 401 once the overlap ends; the reader is found by its missing observation.
  - >-
    The restarted orchestrator doesn't boot: Coolify keeps no old container, so the orchestrator
    is down until the change is undone by hand in both rows and restarted (measured on a
    throwaway application, 2026-10-15).
  max_impact: >-
    The orchestrator down until a hand undo and restart, if a restart fails to boot; or the
    scripts refused if a stalled rotation passes its seven days. Other identities' entries are
    never changed.
  stop_conditions:
  - A value appears anywhere it should not.
  - The orchestrator doesn't come back after a restart.
  rollback: >-
    Before retire_old: set the entry's token_hash back to previous.token_hash and delete
    previous, in both rows, restart, and delete the staging secret; the keeper still holds the
    old value until store. After retire_old the recovery is forward: run the rotation again.
  escalation_target: devon
verification:
  independent_review:
  - Devon adjudicates each criterion against its evidence at /review.
  non_mechanical: []
follow_up:
  required: false
  revisit_when: The next rotation of orchestrator-drift-reporter-bearer, which arrives as a new revision.
  signals: []
  owner: devon
applicable_standards:
  project: '1.0'
  security: '1.0'
