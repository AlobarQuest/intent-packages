  - 'runtime-fetch repo="vps-backup" ref="verify-backup.sh"'
outcome:
  what: >-
    The orchestrator drift-reporter bearer (registry id orchestrator-drift-reporter-bearer, key
    id orchestrator-drift-reporter, agent drift-reconciler) is replaced by a bearer the executor
    mints, the orchestrator accepts only the new one, and the keeper holds it.
  why: >-
    It held one value with the observer bearer. The observer rotated first without an overlap,
    which left this bearer the only holder of the old value; this rotation, with the usual
    overlap, ends that value (ADR-0055 amendment 9, "Decision 3 revised", Devon 2026-10-18).
  beneficiary: >-
    Devon, whose infra-drift, factory-events and vps-backup scripts stop posting with a value
    set by hand and once shared with the observe-and-report lanes.
  success_signal: >-
    Both units complete with each step's evidence filed, the keeper holds a value different from
    the one it started with, the orchestrator's identities route shows the new hash with no
    previous, the old value probes 401 and the new one 200 beside a refused random bearer, no
    staging or quarantine secret is left in Rotation / Work, and the next security-drift run
    reports no rotation finding for orchestrator-drift-reporter-bearer.
scope:
  included:
  - The orchestrator adapter's two units, worked by the rotation executor.
  excluded:
  - >-
    Every other entry in ORCHESTRATOR_M2M_CREDENTIALS. The executor rewrites only the
    orchestrator-drift-reporter entry and refuses to rotate its own.
  - >-
    The observer bearer, rotated by its own package before this one, and change-manager's
    bearers.
  - Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - Changing which scripts use the drift-reporter bearer, or its attribution.
  assumptions:
  - >-
    The rotation executor's timer is enabled in the VM at a revision carrying the orchestrator
    adapter, with coolify_url, orchestrator_application and admin_secrets.orchestrator set.
  - >-
    The keeper is in Rotation / Keepers, where the broad machine account behind
    BWS_ACCESS_TOKEN_VPS_BACKUP and BWS_ACCESS_TOKEN_INFRA_DRIFT reads it by a direct grant and
    the root reads and writes it, each confirmed with an empty HOME after the move.
  - >-
    rotation-orchestrator-observer-bearer's mint unit has completed, so no other served entry
    holds this bearer's old hash as current and the ordinary overlap passes the boot rule. This
    revision is approved, and the registry entry marked rotated_by_sds, only after that.
  open_questions: []
