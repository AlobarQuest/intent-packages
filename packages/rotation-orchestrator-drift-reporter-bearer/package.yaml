profile: non-software-operational
profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its
    orchestrator adapter, from the rotation-executor VM. The decomposition is the adapter's fixed
    plan: unit mint (mint, stage, host, verify_new, store, verify_consumers), then unit retire
    (verify_consumers, retire_old, confirm_dead), with Devon's completion of the first unit
    between them. Each unit restarts the orchestrator, so each is claimed only in the live_estate
    window, and the executor confirms no dispatched run is live before each write and each
    restart. The executor mints a random bearer itself; host rewrites ORCHESTRATOR_M2M_CREDENTIALS
    in both Coolify rows from what the running orchestrator loaded (GET /api/v1/m2m-identities),
    changing only the orchestrator-drift-reporter entry: its new hash, with the old hash as
    previous for seven days. It writes Coolify with the token in Rotation / Coolify, read only
    while a step hosts or retires, and only the application and variable the approved
    destination names. There is no human act: the bearer's eight scheduled readers fetch the
    keeper by UUID when they run, and each is verified by the observation its registry row names
    (GET /api/v1/observations, by source and subject); the retire unit waits unclaimed until
    every one has posted since the keeper's revision, which for the two Sunday readers can be
    past the overlap's until. Evidence carries fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    The orchestrator — its M2M identities route, which shows the hash each entry loaded, the
    status ledger as the probe (200 for an accepted bearer, 401 for a refused one), and its
    observations route, read for each scheduled reader's post
  - Production Coolify — the orchestrator application's ORCHESTRATOR_M2M_CREDENTIALS rows and restart
  - >-
    Bitwarden Secrets Manager — the keeper in Rotation / Keepers, the staging and quarantine
    secrets in Rotation / Work, and the Coolify token in Rotation / Coolify
  standing: true
  credential_id: orchestrator-drift-reporter-bearer
  occurrence: '2026-10-18-requested'
  destinations:
  - 'bws-secret uuid="8998c4ea-453c-4ae1-9b5c-b49500b8dacc"'
  - 'coolify-env-hash instance="prod" resource_type="application" uuid="eqj5l7k705fhi12x9i74fqf0" key="ORCHESTRATOR_M2M_CREDENTIALS" entry="orchestrator-drift-reporter"'
  - 'provider name="orchestrator"'
  - 'runtime-fetch repo="infraops-mcp-server" ref="scripts/drift-audit.sh"'
  - 'runtime-fetch repo="security-standards" ref="scripts/factory-events-nightly.sh"'
