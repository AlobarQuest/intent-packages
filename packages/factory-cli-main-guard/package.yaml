  required_capabilities: []
  blocking_conditions: []
risk:
  failure_modes:
  - >-
    The coding action refactors the CLI, "fixes" `cli.py` too, or touches files
    beyond the guard and its test. Visible in the diff before any merge; the
    stop conditions refuse it.
  - >-
    The added test asserts only the exit code, which the broken behaviour
    already satisfies - a test that proves nothing. The stop conditions refuse
    it; the acceptance condition requires the output assertion.
  - >-
    The named check fails on the pull-request head. The pull request is not
    merged; nothing is affected, because a pull request is inert here.
  max_impact: low
  stop_conditions:
  - >-
    The diff touches any file other than `src/intent_packages/factory_cli.py`
    and one test file under `tests/`.
  - >-
    The added test contains no assertion on the text the entry point emits.
  rollback: >-
    Close the pull request without merging. Nothing outside the repository has
    changed. If merged and later regretted, revert the commit - which removes
    the guard again, today's state.
  escalation_target: devon
