profile: non-software-operational
profile_fields:
  owner: devon
  operating_procedure: >-
    The rotation executor (orchestrator src/rotation_worker/) works this rotation with its change-
    manager adapter, from the rotation-executor VM. The decomposition is the adapter's fixed plan:
    unit mint (mint, stage, host, verify_new, store, verify_consumers), then unit retire
    (verify_consumers, retire_old, confirm_dead), with Devon's completion of the first unit between
    them. Each unit restarts change-manager, so each is claimed only in the live_estate window, and
    a unit that writes waits unclaimed while any registered change-manager reader's Healthchecks
    check shows as started, then asks again before writing and before restarting. The executor mints
    a random bearer itself; host writes M2M_TOKEN_PROPOSE in both Coolify rows as the propose
    entry's new hash with the old hash as previous for seven days, built from the old and new values
    alone, because nothing reports what change-manager loaded. Before it writes, it reads the other
    three change-manager keepers and refuses a value any of them holds, since a shared previous
    stops change-manager booting. It confirms each write by probing GET /api/landing-policy (200 for
    an accepted bearer, 401 for a refused one, beside a random bearer), and writes Coolify with the
    token in Rotation / Coolify, read only while a step hosts or retires, and only the application
    and variable the approved destination names. There is no human act: each of the bearer's four
    scheduled readers fetches the keeper by UUID when it runs and is verified by its Healthchecks
    check (run-bump-proposer.sh (06:50, writing runs only, Healthchecks check sds-bump-proposer);
    run-change-proposer.sh (hourly, writing runs only, Healthchecks check sds-change-proposer); run-
    rotation-proposer.sh (06:30, writing runs only, Healthchecks check sds-rotation-proposer); run-
    work-carrier.sh (07:05, registering runs only, Healthchecks check sds-work-carrier)); the retire
    unit waits unclaimed until every one has run since the keeper's revision. Evidence carries
    fingerprints, probe status codes and notes only.
  external_systems:
  - >-
    change-manager — GET /api/landing-policy as the probe (200 for an accepted bearer, 401 for a
    refused one), behind Cloudflare with a named User-Agent
  - Production Coolify — the change-manager application's M2M_TOKEN_PROPOSE rows and restart
  - >-
    Bitwarden Secrets Manager — this keeper and the other three change-manager keepers in
    Rotation / Keepers, the staging and quarantine secrets in Rotation / Work, and the Coolify
    token in Rotation / Coolify
  - Healthchecks — the started state of every registered change-manager reader's check, and the
    last runs of sds-bump-proposer, sds-change-proposer, sds-rotation-proposer, sds-work-carrier
  standing: true
  credential_id: change-manager-propose-bearer
  occurrence: '2026-10-20-requested'
  destinations:
  - 'bws-secret uuid="acccb346-4baa-43ec-a1d4-b4a400c048ee"'
  - 'coolify-env-hash instance="prod" resource_type="application" uuid="re45tafypao3nly3qa9a79dp" key="M2M_TOKEN_PROPOSE" entry="propose"'
  - 'provider name="change-manager"'
  - 'runtime-fetch repo="orchestrator" ref="scripts/run-bump-proposer.sh"'
  - 'runtime-fetch repo="orchestrator" ref="scripts/run-change-proposer.sh"'
  - 'runtime-fetch repo="orchestrator" ref="scripts/run-rotation-proposer.sh"'
  - 'runtime-fetch repo="orchestrator" ref="scripts/run-work-carrier.sh"'
outcome:
  what: >-
    The change-manager propose bearer (registry id change-manager-propose-bearer, scope propose,
    variable M2M_TOKEN_PROPOSE) is replaced by a bearer the executor mints, change-manager accepts
    only the new one, and the keeper holds it.
  why: >-
    It is the third of change-manager's four bearers on the rotation executor, after the observe and
    read bearers (ADR-0055 increment 6). Its value was set by hand when the scope was created.
  beneficiary: >-
    Devon, whose lanes (sds-bump-proposer, sds-change-proposer, sds-rotation-proposer, sds-work-
    carrier) call change-manager with a bearer the executor rotates rather than one set by hand.
  success_signal: >-
    Both units complete with each step's evidence filed, the keeper holds a value different from
    the one it started with, the old value probes 401 and the new one 200 beside a refused random
    bearer, change-manager serves with M2M_TOKEN_PROPOSE holding the new hash and no previous, no
    staging or quarantine secret is left in Rotation / Work, and the next security-drift run
    reports no rotation finding for change-manager-propose-bearer.
scope:
  included:
  - The change-manager adapter's two units, worked by the rotation executor.
  excluded:
  - >-
    change-manager's other three bearer variables (M2M_TOKEN, M2M_TOKEN_OBSERVE, M2M_TOKEN_READ).
    The executor writes only M2M_TOKEN_PROPOSE, and reads the other keepers only to refuse a shared
    value.
  - The observe, read and full bearers, each rotated by its own package.
  - Recording the rotation in security-drift's rotation state, which is HQ's act after the run.
  non_goals:
  - Changing which lanes use the propose bearer, or change-manager's scopes.
  assumptions:
  - >-
    The rotation executor's timer is enabled in the VM at a revision carrying the change-manager
    adapter (orchestrator 3e94dc3 or later), with coolify_url and admin_secrets set.
  - >-
    All four change-manager keepers are in Rotation / Keepers, where the broad machine account
    behind BWS_ACCESS_TOKEN_VPS_BACKUP and BWS_ACCESS_TOKEN_INFRA_DRIFT reads each by a direct
    grant and the root reads and writes them, each confirmed with an empty HOME after the move
    (2026-10-19).
  - >-
    The executor reaches production Coolify over the tailnet, whose VPS node key no longer
    expires (2026-10-19).
  open_questions: []
