risk:
  failure_modes:
    - "The caller workflow resolves to a stale factory-runner revision, so the run is green but posts no Evidence Pack, and the absence reads as a capability defect rather than a configuration one. This is not hypothetical: the target's caller was pinned fifteen commits behind at the start of this work and was re-pinned before dispatch precisely to prevent it."
    - "The authority envelope cannot accomplish its own outcome, so a well-behaved agent obeys its authority, changes nothing, exits successfully, and the run dies at the change-detection guard — consuming a package revision and the named human approval bound to it, neither of which can be taken back."
    - "An envelope command that succeeds during the coding phase fails when factory-runner re-executes the ordered list at finalize, so the unit can never open a pull request however many attempts it is granted."
    - "The declared budget is lower than the run's real consumption, so the unit halts at its cap. Budget enforcement is live for the first time in this run, and a breach is not recoverable within the unit."
    - "The unit's pull request collides with the open Dependabot pull request offering the same dependency."
    - "Dispatch is left enabled after the window."
    - "A pull request is merged by automation, or a GitHub App permission grants a merge path."
  max_impact: "One unwanted change-manager pull request that Devon closes. Dispatch cannot merge, cannot mutate production infrastructure, cannot write secrets, and is bounded to repo.edit, dependency-update, and AlobarQuest/change-manager."
  stop_conditions:
    - "Stop and report rather than improvise if any step reveals a defect in the factory process — admission, routing, idempotency, circuit-breaker, command enforcement, result classification, evidence, or lifecycle behaviour differing from the approved contract."
    - "The dispatch record names any repository other than AlobarQuest/change-manager."
    - "The work unit reaches a dispatchable state without a named human authority approval."
    - "The approved package hash changes without a new revision and renewed approval."
    - "Any change would create an automatic merge, automatic Brain approval, tracker canonicalization, or graduation automation."
  rollback: "Disable dispatch by setting ORCHESTRATOR_DISPATCH_ENABLED false and restarting; close the unwanted pull request; cancel the work unit. This package's dispatch mutates only a change-manager feature branch, never its default branch, and never production infrastructure."
  escalation_target: devon
verification:
  independent_review:
    - "The WS-5.1 verifier adjudicates the unit's evidence independently of the worker that produced it."
    - "change-manager's own named check gates its own pull request."
    - "Devon reviews the pull request before merging it."
  non_mechanical:
    - "Whether one successful run is sufficient evidence that the dispatched lane works, or whether it only proves the lane worked once."
    - "Whether the as-of-submit Evidence Pack comment is useful enough to leave as-is, or whether the limitation should be scheduled."
    - "Whether the httpx2 update is desirable right now, which is a judgment no check can make."
follow_up:
