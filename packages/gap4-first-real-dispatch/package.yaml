    - "The as-of-submit limitation misled a reviewer about the state of the pull request"
    - "Budget enforcement halted a unit that should have been allowed to finish"
    - "A capability that shipped and deployed turned out not to work under real traffic"
  owner: devon
applicable_standards:
  project: "1.0"
  code: "1.0"
  security: "1.0"
