schema_version: 1
package_id: gap4-first-real-dispatch
title: "GAP-4 — carry one real dependency update through the dispatched lane end to end, producing the first Evidence Pack ever attached to a pull request"
revision: 1
status: ready_for_review
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-28T23:35:00Z"
supersedes: null
outcome:
  what: "One work unit updates httpx2 from 2.7.0 to 2.9.1 in AlobarQuest/change-manager by regenerating uv.lock, opens one pull request from an sds/ branch, and proves its named check green on the exact pull-request head. The unit is dispatched to a factory-runner revision that carries pull-request binding, cost actuals, the evidence-pack pull-request comment, and the lease-token fix, so that a single run exercises all four under real traffic for the first time."
  why: "Wave 2's first exit clause is unclosed for one reason: no pull request in the organization has ever carried an Evidence Pack, because no runner has executed since that capability shipped. The capability is merged, tested, and deployed, and none of that is evidence it works. A search of pull-request comments across all six fan-out repositories returned zero occurrences of the evidence-pack marker on 2026-07-28T23:34:20Z. Only a real dispatch can change that number."
  beneficiary: "Devon gets the dispatched lane demonstrated end to end on real traffic rather than asserted from a green test suite, and a single artifact — one pull request — that carries the proof of four separately-shipped capabilities working together."
  success_signal: "Exactly one change-manager unit is created from a Devon-approved revision and decomposition; its approved authority envelope permits only the preflight-proven ordered command sequence; factory-runner opens one pull request whose named check passes on the exact head; that pull request carries an evidence-pack comment bearing the sds-evidence-pack marker, contains no runner working files, has a pull-request binding recorded before submit and cost actuals recorded for its attempt; the WS-5.1 verifier adjudicates the evidence; and Devon alone merges."
scope:
  included:
    - "Author and approve this intent package before any work unit is created."
    - "Update exactly one dependency, httpx2, from 2.7.0 to 2.9.1 in AlobarQuest/change-manager. The dependency was chosen by Devon from the updates Dependabot currently offers on that repository, so the update is known to be genuinely available rather than assumed."
    - "Before authoring the authority envelope, prove it against a clean clone of the real target repository: prove the mutator yields a real diff, prove the ordered command list is idempotent under a second full execution in the same checkout, prove the verifier honestly executes its tools rather than skipping them, and establish a control run on an unmodified clone so a runner-environment failure is never mistaken for an update-induced one."
    - "Re-pin the target repository's factory-runner caller workflow to the merged factory-runner revision that carries the capabilities under proof, preserving that repository's deliberate pinning policy rather than floating the reference."
    - "Create exactly one Draft work unit through the WS-3.2 decomposition path, so the unit is stamped with its own constraints.work_unit_id."
    - "Record one named human authority approval bound to that unit's own authority fingerprint."
    - "Enable production dispatch for the minimum window: enable, dispatch the single unit, confirm the target repository's Actions run started, then disable and verify the disabled state from inside the running container. Record both timestamps."
    - "Observe, on the resulting pull request, the four capabilities under first real proof: the evidence-pack comment, the absence of runner working files, the pull-request binding recorded before submit, and cost actuals recorded for the attempt."
    - "Submit verifier evidence and let the WS-5.1 verifier adjudicate it."
  excluded:
    - "Any second work unit. This package authorizes one unit, one dispatch window, and one pull request."
    - "Any automatic merge, or any worker, agent, API, CLI, CI, or orchestrator path that merges a pull request."
    - "Broadening the dispatch change-class allowlist beyond dependency-update, or the target beyond AlobarQuest/change-manager."
    - "Fixing the known as-of-submit limitation of the evidence-pack comment, which is recorded as an observation rather than remediated here."
    - "Closing or superseding the Dependabot pull request that offers the same dependency; that is a separate decision after merge."
    - "Any change to the orchestrator, factory-runner, or the authority envelope contract."
  non_goals:
    - "Proving the dependency update is correct; change-manager's own named check and Devon's review decide that."
    - "Making dispatch automation permanent; the standing posture remains a separate Devon decision."
    - "Demonstrating throughput, concurrency, or queueing. One unit is the entire point."
  assumptions:
    - "AlobarQuest/change-manager hosts the caller workflow .github/workflows/factory-runner-pilot.yml on its default branch and carries the required Actions secret names (FACTORY_RUNNER_TOKEN, FACTORY_RUNNER_CREDENTIAL_KEY_ID, ANTHROPIC_API_KEY, FACTORY_PR_TOKEN)."
    - "That caller workflow resolves to a factory-runner revision containing pull-request binding, cost actuals, the evidence-pack comment, and the lease-token fix. Verified by re-pinning it to c266769fd9e9aecf4e35ced29ad1605656e84d87 and confirming the reusable workflow's input and secret contract is unchanged at that revision."
    - "AlobarQuest/factory-runner is public, so a caller's GITHUB_TOKEN can install it."
    - "change-manager's test suite runs on in-memory SQLite and requires no service container, environment variable, or migrated database, so its own make check is a verifier the hosted runner can honestly execute. Confirmed by running it on a bare clean clone."
    - "Devon alone approves this package revision, approves the decomposition, approves the unit's authority, approves enabling dispatch, and merges the pull request."
  open_questions: []
