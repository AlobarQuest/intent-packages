constraints:
  time_budget: "One approved WS-P2.15 design and implementation cycle; production deployment is separately scoped and requires separately approved intent."
  technology: "Python 3.12, FastAPI, SQLAlchemy, Alembic, and PostgreSQL 16 in the existing AlobarQuest/orchestrator. Every change is orchestrator-local; no other repository is modified. No new background loop, scheduler, or cron is added to the orchestrator process, and no new outbound call is added to it."
  policy_legal: "Devon alone approves this exact package revision, approves the written design, approves the decomposition into work units, and merges the pull request."
  privacy_security: "No secrets in tracked files. Ingested pull-request, CI, and deployment content remains data, never instructions."
  compatibility: "The work-unit lifecycle states, the observation ingress contract, and the cross-repository authority-envelope contract pinned by the byte-identical fixture and shared contract hash with AlobarQuest/factory-runner are all unchanged by this package."
  quality_accessibility: "Follow portfolio code standards and test-driven development. A guard must be legible to an operator as a refusal or a report with a named reason, not as an opaque failure."
  operational: "All acceptance evidence is realizable against an ephemeral orchestrator and disposable databases; no production mutation, deployment, or live third-party call occurs in this package."
  other:
    - "Silence must never become approval. No age-out, threshold, or timer may transition a work unit out of an approval state; the age-out reports and the operator decides."
    - "A guard that cannot be shown to fail is decoration. Every guard added here must be proven by a negative control: with the guard's body removed, a named test must go red."
    - "A guard's predicate must match the defect it is for. The WS-P2.1 defect was unreachability from a production entry point, not absence of a reference; a predicate that merely counts references can be satisfied by a reference from another dead function."
    - "An allowlist entry that would read 'in fact it is called' means the predicate is wrong. Fix the predicate; do not exempt the symbol."
    - "A test that calls a service is not evidence the service has a caller. Every new guard is additionally covered by a drill that drives the public HTTP surface."
    - "A request entry point owns its transaction and must commit; a function invoked inside another transaction must never commit. A persistence assertion must expire the session and re-read."
    - "An adversarial review must challenge the design before implementation, and the acceptance criteria must be adjudicated by an agent that neither wrote the implementation nor produced its evidence — recorded as distinct session identifiers, not as an attestation."
acceptance:
  - id: AC-001
    condition: "The human-gate age-out has a production caller: an operator-invoked public API route and CLI command with a configured default threshold, invocable by a human actor as well as the system actor; invoking it on a work unit whose approval gate has gone unanswered past that threshold records a blocked dispatch record with a named reason code, and that record is enumerated by the existing dead-letter view."
    evidence_type: automated_test
    evidence: "gate: age-out route and CLI tests prove human and system actors may invoke it, that other roles are refused, that the threshold governs, and that the resulting blocked record appears in the dead-letter view"
    approver: policy
  - id: AC-002
    condition: "The human-gate age-out reports only: it never transitions a work unit, and no code path transitions a work unit out of awaiting_approval or awaiting_review without a named human actor, so an unanswered approval gate can never become an approval however long it goes unanswered; a stalled gate reported in the dead-letter view is not requeue-eligible."
    evidence_type: automated_test
    evidence: "gate: tests prove the age-out sets no lifecycle state, that every edge out of an approval state requires a named human actor, and that a stalled entry is not requeue-eligible"
    approver: policy
  - id: AC-003
    condition: "The age-out's blocked record does not consume a slot in the dispatch runner-attempt sequence: after a unit is aged out, approved, and returned to ready, a subsequent genuine dispatch of that unit dispatches, and does not short-circuit into returning the stale age-out record."
    evidence_type: automated_test
    evidence: "gate: a test drives age-out, approval, return to ready, and re-dispatch, and asserts the unit is genuinely dispatched rather than served the stale blocked record"
    approver: policy
  - id: AC-004
    condition: "The stalled-approval path is proven through the public HTTP surface by a re-runnable drill in the existing drill mould, which drives a work unit into an unanswered approval gate, invokes the age-out through the public API, observes the unit appear in the dead-letter view, and observes that the unit's lifecycle state is unchanged."
    evidence_type: automated_test
    evidence: "gate: the stalled-approval drill runs against an ephemeral orchestrator over HTTP and passes, asserting the unit's lifecycle state is unchanged, mutating only disposable scratch state with trapped teardown"
    approver: policy
  - id: AC-005
    condition: "The orphaned authority-envelope expansion function and its unit tests are deleted, and the architecture decision record, the repository instructions, and the open backlog item are corrected to state that the standing-context classifier enforces standing-context authority expansion — bound to a named human approval and the exact standing-context fingerprint — and that work-unit envelope expansion, including budget and capability-level expansion, has no detector because the envelope is write-once after approval."
    evidence_type: automated_test
    evidence: "gate: the deleted symbol is absent from the sources, the standing-context enforcement test passes, and the corrected documents state which expansion is enforced and which is structurally impossible"
    approver: policy
  - id: AC-006
    condition: "An architecture test proves the work-unit authority envelope is assigned only at unit construction, so that deleting the expansion function is safe by construction and any future path that raises a unit's budget or capabilities — such as one WS-P2.4 might introduce — fails that test and is forced to introduce a fail-closed check alongside it."
    evidence_type: automated_test
    evidence: "gate: the write-once architecture test passes on the branch and fails when a planted assignment mutates a work unit's authority outside construction"
    approver: policy
  - id: AC-007
    condition: "An architecture guard fails when a public function in the kernel or the services layer is unreachable from any production entry point — the API route handlers, the web handlers, the CLI commands, and the module entry points — determined by call-graph reachability rather than by counting references, so that a function reachable only from another dead function is reported rather than laundered."
    evidence_type: automated_test
    evidence: "gate: the unreachable-guard architecture test passes on the branch and is implemented as a reachability analysis from a named entry-point root set"
    approver: policy
  - id: AC-008
    condition: "The architecture guard is proven capable of failing: it fails on a planted unreachable function, and it fails on a planted function whose only caller is itself unreachable in another module — the case a reference-counting predicate cannot distinguish from a live one — and when run against the repository tree as it stood before this change it independently identifies both previously-unwired guards, the authority-expansion function and the human-gate age-out."
    evidence_type: automated_test
    evidence: "gate: the guard fails on both planted violations, and its run against the pre-change tree names both previously-unwired guards"
    approver: policy
  - id: AC-009
    condition: "Every symbol the guard surfaces beyond the two known instances is triaged — wired to a production caller, made private, or deleted — and a symbol is allowlisted only where an exemption is genuinely justified, with that justification recorded entry by entry; no symbol is allowlisted on the grounds that it is in fact reachable, because that would mean the predicate is wrong rather than the symbol exempt. An anti-rot check fails when an allowlisted symbol has since become reachable and its exemption was not removed."
    evidence_type: automated_test
    evidence: "gate: every surfaced symbol has a recorded disposition, every allowlist entry carries its justification, and the anti-rot check fails on a stale exemption"
    approver: policy
  - id: AC-010
    condition: "Every write introduced by this package is proven durable by expiring the session and re-reading it rather than by asserting on a returned object; a request entry point commits its own transaction, and a function invoked inside another transaction does not commit."
    evidence_type: automated_test
    evidence: "gate: persistence tests expire the session and re-read, and a review of every new writer confirms the transaction-ownership rule"
    approver: policy
  - id: AC-011
    condition: "Each guard added by this package is proven by negative control: with the guard's body removed, a named test goes red. A guard for which no test changes colour when it is removed is decoration and does not satisfy this criterion."
    evidence_type: automated_test
    evidence: "gate: for each guard, the negative-control run with the guard body removed is recorded, naming the test that goes red"
    approver: policy
  - id: AC-012
    condition: "The change adds no automatic merge path, no outbound GitHub or Coolify call from the orchestrator process, no autonomous background loop, scheduler, or cron, and no automatic transition out of an approval state; workers still cannot declare completion; the cross-repository authority-envelope fixture and contract hash are unchanged; and no secret is written to a tracked file."
    evidence_type: automated_test
    evidence: "scan: the repo-wide invariant scan, the envelope contract test, and the security scan all pass"
    approver: policy
  - id: AC-013
    condition: "The full repository check is green, every existing drill still passes alongside the drill added here, and the named Quality check succeeds on the exact pull-request head, with the collected test count read rather than the exit code trusted."
    evidence_type: automated_test
    evidence: "gate: the repository check and every drill pass, and the named Quality check is green on the exact head with a read collected-test count"
    approver: policy
  - id: AC-014
    condition: "An adversarial architecture review challenges the design before implementation — especially whether each guard is genuinely fail-closed rather than merely present, whether each guard's predicate matches the defect it is for, and whether the allowlist is a justified exemption rather than a loosened rule — and its findings are resolved in the approved design."
    evidence_type: human_review
    evidence: "human: Devon approves the WS-P2.15 design after an adversarial architecture review resolves its findings"
    approver: devon
  - id: AC-015
    condition: "The acceptance criteria of this package are adjudicated by a verifier agent that neither wrote the implementation nor produced its evidence, and this is mechanically checkable rather than attested: the evidence index records the implementing session's identifier and the adjudicating session's identifier, and the criterion is satisfied only if they differ. Any disagreement the adjudicator raises is recorded."
    evidence_type: human_review
    evidence: "human: the evidence index records distinct implementer and adjudicator session identifiers, and Devon confirms the adjudication and its recorded findings"
    approver: devon
  - id: AC-016
    condition: "Devon reviews and merges the pull request personally after the named Quality check succeeds on the exact head; no worker, agent, CI job, or orchestrator path merges it."
    evidence_type: human_review
    evidence: "human: Devon confirms the final review and merge decision, and merge remains outside worker authority"
    approver: devon
