package_id: ws-p2.15-fail-closed-lifecycle-guards
title: "WS-P2.15 — fail-closed lifecycle guards: wire or remove the declared guards, and make an unreachable guard detectable"
revision: 1
status: draft
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-12T00:00:00Z"
supersedes: null
profile: software-delivery
profile_fields:
  repo: AlobarQuest/orchestrator
  branch: sds/wsp215-fail-closed-lifecycle-guards
  deploy_target: null
  required_checks:
    - Quality
  rollback_plan: "Before deployment, revert or abandon the WS-P2.15 branch and close the draft pull request while retaining this approved package, its evidence, and the review findings. Every change is orchestrator-local and is exercised only in disposable local or ephemeral databases; production deployment is separately scoped, so there is no production change to roll back here."
outcome:
  what: "Two declared lifecycle guards that nothing forces the system to discharge are wired or removed — the human-gate age-out gains a production caller so that an unanswered approval gate becomes visible to the operator without any path by which silence becomes approval, and the orphaned authority-envelope expansion function is deleted and replaced by a structural guarantee that makes its absence safe. A new architecture guard then makes the whole class detectable, failing when a public function in the kernel or the services layer is unreachable from any production entry point, and the nine further symbols its first run surfaces are each triaged rather than exempted."
  why: "WS-P2.1 shipped a feature that was dead in production while every unit test passed: the pull-request binding writers had no production caller at all, and the writer beneath them flushed without committing. An obligation nobody is forced to discharge is not a guarantee, and a guard nobody calls is not protection; both are indistinguishable from a healthy system from the outside, and both survive a green suite indefinitely. This workstream closes the orchestrator-local instances of that pattern and, more importantly, makes the pattern itself detectable, because there are demonstrably others — the adversarial review of this package's own first revision found eleven candidate symbols where the handoff knew of two."
  beneficiary: "Devon as the operator, who must be able to trust that a declared guard is a real one, and who currently has no surface that reports an approval gate nobody answered; and the software delivery system, which gains a detector for the defect class that cost it a whole workstream to learn."
  success_signal: "An unanswered human approval gate past its threshold appears in the dead-letter view as a blocked dispatch record while the work unit is never transitioned, so silence can never become approval, and the operator can invoke that pass without a production credential change; the orphaned expansion function is deleted, the documentation states truthfully which expansion is enforced and which is structurally impossible, and an architecture test makes the work-unit authority envelope provably write-once so a future budget-raising path cannot appear unguarded; and a new architecture guard, keyed on reachability from a production entry point rather than on mere reference, fails on a planted violation including the dead-cross-module-caller case, independently rediscovers both previously-unwired guards from the pre-change tree, and has an allowlist whose every entry is justified because the other candidates were fixed rather than exempted."
scope:
  included:
    - "Author and approve this intent package before any design or work unit is created."
    - "Give the already-implemented human-gate age-out function a production caller: an operator-invoked public API route and CLI command, together with a configured default threshold."
    - "Allow the human actor as well as the system actor to invoke that pass, because it is a read-and-report operation rather than a dispatch, and because the standing production machine credential is worker-role — a system-only route is a route the operator cannot invoke without a credential change that risks a fail-closed outage."
    - "Preserve, and prove by negative control, that the human-gate age-out reports only: it records a blocked dispatch record surfaced by the existing dead-letter view, it never transitions a work unit, and no path leaves an approval state without a named human actor."
    - "Ensure the age-out's blocked record cannot consume a slot in the dispatch runner-attempt sequence, so that a later genuine dispatch of the same unit cannot be silently short-circuited into returning the stale age-out record."
    - "State, in the dead-letter view's own contract and operator-facing copy, that the view now enumerates terminal failures and stalled approval gates, and that a stalled gate is reported but not requeue-eligible."
    - "Delete the orphaned authority-envelope expansion function and its unit tests, and correct the architecture decision record, the repository instructions, and the open backlog item to state truthfully that the standing-context classifier enforces standing-context authority expansion, and that work-unit envelope expansion has no detector because the envelope is write-once after approval."
    - "Add an architecture test proving the work-unit authority envelope is assigned only at unit construction, so that the deleted function's absence is safe by construction and any future budget-raising or capability-raising path — such as the one WS-P2.4 may introduce — trips the test and is forced to introduce a fail-closed check with it."
    - "Add an architecture guard that fails when a public function in the kernel or the services layer is unreachable from any production entry point — the API route handlers, the web handlers, the CLI commands, and the module entry points — computed over a call graph rather than by mere reference, so that a function reachable only from another dead function is still reported."
    - "Verify that architecture guard by planting violations and observing it fail, including the case of a function whose only caller is itself dead in another module, which is the case a reference-counting predicate cannot distinguish."
    - "Triage every symbol the guard's first run surfaces beyond the two known instances — by wiring it, making it private, or deleting it — and allowlist a symbol only where an exemption is genuinely justified, recording that justification entry by entry."
    - "Cover the age-out with a drill in the existing drill mould, driving the real public HTTP surface rather than calling services in-process, because that is what caught the WS-P2.1 defect a green unit suite did not."
    - "Prove persistence of any new write by expiring the session and re-reading, never by asserting on the object a call returned."
  excluded:
    - "The pull-request-binding submission guard and everything it depends on — enforcing the unit-envelope capability vocabulary at ingress, changing AlobarQuest/factory-runner to record its pull-request binding before submitting, and the deployment ordering between them. The adversarial review of this package's first revision established that the guard cannot be built safely without all three: every dispatched unit's envelope allows the pull-request capability while no worker writes a binding, so the guard would halt the factory; and no code validates capability names, so units authored in the registry vocabulary would evade it entirely. That work is a cross-repository package of its own and is handed off with these findings."
    - "Production deployment of the orchestrator; a separate deploy step handles it."
    - "Any automatic transition out of an approval state, any timer, and any background loop, scheduler, or cron in the orchestrator process."
    - "Any automatic merge, or any worker, agent, CI, or orchestrator path that merges a pull request."
    - "Any outbound call to GitHub or Coolify from the orchestrator process itself."
    - "Any new authority-envelope mutation path invented in order to give the deleted expansion check something to guard."
    - "Widening the architecture guard's scope beyond the kernel and services layers; route handlers, CLI commands, models, and schemas are the entry points and the framework-registered surfaces, and are roots of the reachability analysis rather than subjects of it."
    - "Factory SLOs and observability (WS-P2.2), acceptance-criterion adjudication completeness (WS-P2.3), and cost controls (WS-P2.4)."
  non_goals:
    - "Eliminating every false positive from the architecture guard; where a symbol is genuinely exempt, an explicit justified allowlist entry is the correct answer, and a looser predicate is not. But an allowlist entry that would read 'in fact it is called' is evidence the predicate is wrong, not evidence an exemption is needed."
    - "Deciding, in this package, what an operator should do about a stalled approval gate; the package makes it visible, and Devon decides."
  assumptions:
    - "The dead-letter view already enumerates blocked dispatch records, so the human-gate age-out needs a caller, a threshold, and an honest statement of the view's widened contract, rather than a new operator surface."
    - "The human-gate age-out never mutates the work unit's attempt count and records no failure signature, so it can neither burn the attempt budget nor trip the circuit breaker; its only unwanted coupling to dispatch is the runner-attempt sequence, which this package severs."
    - "The work-unit authority envelope is assigned only at unit construction today, so deleting the envelope-expansion function removes no live coverage; the retry path raises the attempt budget on the work-unit column rather than the envelope, and never consulted the deleted function."
    - "The standing-context classifier compares standing contexts, not authority envelopes: it checks capability sets and authority-profile rank, and does not check capability levels, budgets, or unknown fields. The corrected documentation must say this, because recording a false equivalence would tell a future engineer that envelope and budget expansion are checked when they are not."
    - "PostgreSQL is the concurrency and idempotency authority; persistence assertions run against PostgreSQL and re-read after expiry."
    - "Devon alone approves this package revision, approves the design, approves the decomposition, and merges the pull request."
  open_questions: []
