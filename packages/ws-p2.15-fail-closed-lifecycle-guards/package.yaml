risk:
  failure_modes:
    - "The architecture guard is keyed on references rather than reachability, so it launders a dead function whose only caller is itself dead — shipping a guard that cannot detect the next instance of the very defect it was written for."
    - "The guard's first run surfaces more unreachable symbols than the package scoped, and they are allowlisted for expedience rather than triaged, so the allowlist becomes the rot the guard was meant to prevent."
    - "An allowlist entry is written for a symbol that is genuinely reachable, masking a wrong predicate as a justified exemption."
    - "The age-out is wired in a way that transitions a work unit out of an approval state, turning silence into a decision."
    - "The age-out is wired as a background loop, scheduler, or cron inside the orchestrator process rather than as an operator-invoked entry point."
    - "The age-out's blocked record consumes a runner-attempt slot, so a later genuine dispatch of the same unit is silently short-circuited into returning the stale blocked record and never dispatches."
    - "A single work unit with a missing package revision aborts the entire age-out pass, rolling back every record already written in it."
    - "The documentation correcting the expansion-function deletion records a false equivalence — claiming the standing-context classifier checks envelope budgets and capability levels when it does not — so a future engineer building the cost controls believes a check exists that does not."
    - "Deleting the expansion function is taken as licence to invent an authority-envelope mutation path so that the guard has something to guard."
    - "A new writer flushes without committing, or a persistence test asserts on the object a call returned rather than re-reading after expiry — the exact WS-P2.1 defect."
    - "A guard is added that no test would catch the removal of, and it ships as decoration."
  max_impact: "A wrongly-predicated architecture guard would give false assurance that the declared-but-unreachable defect class is now detected when it is not, which is worse than no guard. The blast radius of the code changes is capped because every change is orchestrator-local, exercised only against disposable databases, production deployment is out of scope, and merge remains Devon's."
  stop_conditions:
    - "A baseline repository or the named Quality check becomes red for an in-scope reason."
    - "The approved package hash changes without a new revision and renewed approval."
    - "The design requires a background loop, an approval-state auto-transition, or a change to the cross-repository envelope contract."
    - "The pull-request-binding guard or its prerequisites are pulled back into this package rather than being carried by WS-P2.16."
    - "Implementation scope crosses into WS-P2.2, WS-P2.3, or WS-P2.4 without separately approved intent."
  rollback: "Before deployment, revert or abandon the WS-P2.15 branch and close the draft pull request; preserve this package, its evidence, and the review findings. Nothing here deploys to or mutates production."
  escalation_target: devon
