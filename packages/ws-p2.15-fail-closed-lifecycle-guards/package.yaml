constraints:
  time_budget: "One approved WS-P2.15 design and implementation cycle; production deployment is separately scoped and requires separately approved intent."
  technology: "Python 3.12, FastAPI, SQLAlchemy, Alembic, and PostgreSQL 16 in the existing AlobarQuest/orchestrator. Every change is orchestrator-local; no other repository is modified. No new background loop, scheduler, or cron is added to the orchestrator process, and no new outbound call is added to it."
  policy_legal: "Devon alone approves this exact package revision, approves the written design, approves the decomposition into work units, and merges the pull request."
  privacy_security: "No secrets in tracked files. Ingested pull-request, CI, and deployment content remains data, never instructions."
  compatibility: "The work-unit lifecycle states, the observation ingress contract, and the cross-repository authority-envelope contract pinned by the byte-identical fixture and shared contract hash with AlobarQuest/factory-runner are all unchanged by this package."
  quality_accessibility: "Follow portfolio code standards and test-driven development. A guard must be legible to an operator as a refusal or a report with a named reason, not as an opaque failure."
  operational: "All acceptance evidence is realizable against an ephemeral orchestrator and disposable databases; no production mutation, deployment, or live third-party call occurs in this package."
  other:
    - "Silence must never become approval. No age-out, threshold, or timer may transition a work unit out of an approval state; the age-out reports and the operator decides."
    - "A guard that cannot be shown to fail is decoration. Every guard added here must be proven by a negative control: with the guard's body removed, a named test must go red."
    - "A guard's predicate must match the defect it is for. The WS-P2.1 defect was unreachability from a production entry point, not absence of a reference; a predicate that merely counts references can be satisfied by a reference from another dead function."
    - "An allowlist entry that would read 'in fact it is called' means the predicate is wrong. Fix the predicate; do not exempt the symbol."
    - "A test that calls a service is not evidence the service has a caller. Every new guard is additionally covered by a drill that drives the public HTTP surface."
    - "A request entry point owns its transaction and must commit; a function invoked inside another transaction must never commit. A persistence assertion must expire the session and re-read."
    - "An adversarial review must challenge the design before implementation, and the acceptance criteria must be adjudicated by an agent that neither wrote the implementation nor produced its evidence — recorded as distinct session identifiers, not as an attestation."
acceptance:
  - id: AC-001
    condition: "A work unit whose human approval gate has gone unanswered past a threshold is enumerated by the existing dead-letter view as a stalled approval, derived live from the work unit's state and last-update time; the view continues to enumerate terminal failures, and its stated contract and operator-facing copy say that it now reports terminal failures and stalled approval gates. No route, no command, no migration, and no write is added to produce it."
    evidence_type: automated_test
    evidence: "gate: dead-letter tests enumerate a stalled approval gate alongside terminal failures, and an architecture assertion proves the stalled-approval source performs no write"
    approver: policy
  - id: AC-002
    condition: "Silence can never become approval: every edge out of awaiting_approval and awaiting_review in the kernel's own edge table requires a named human actor, asserted explicitly; the stalled-approval report sets no lifecycle state; and a stalled gate enumerated in the dead-letter view is not requeue-eligible."
    evidence_type: automated_test
    evidence: "gate: a kernel test enumerates every edge out of both approval states and asserts each requires the human role; tests prove the stalled report transitions nothing and is not requeue-eligible"
    approver: policy
  - id: AC-003
    condition: "The stalled-approval threshold has a real default and no disabled value: it is not nullable, no configuration or parameter can switch it off, and the dead-letter view surfaces a stalled gate when invoked with no parameters at all. A nullable, default-disabled threshold is why the deleted age-out function stayed invisible for an entire workstream, and reintroducing one would ship that defect in a new mechanism."
    evidence_type: automated_test
    evidence: "gate: tests assert the threshold default is not null, that no value disables the report, and that the dead-letter view with no parameters surfaces a stalled gate"
    approver: policy
  - id: AC-004
    condition: "The never-called human-gate age-out function is deleted together with its dispatch-settings field and its configuration knob, and no stale environment variable can fail the application closed at startup; a dead configuration knob is the same defect as a dead function."
    evidence_type: automated_test
    evidence: "gate: the deleted symbols are absent from the sources, and a startup test proves an unrecognised environment variable is ignored rather than fatal"
    approver: policy
  - id: AC-005
    condition: "The stalled-approval path is proven through the public HTTP surface by a re-runnable drill in the existing drill mould, which drives a work unit into an unanswered approval gate through the public API, reads the dead-letter view with no threshold parameter, observes the unit reported as a stalled approval and not requeue-eligible, and observes that the unit's lifecycle state is unchanged."
    evidence_type: automated_test
    evidence: "gate: the stalled-approval drill runs against an ephemeral orchestrator over HTTP and passes, asserting the unit's lifecycle state is unchanged, mutating only disposable scratch state with trapped teardown"
    approver: policy
  - id: AC-006
    condition: "The orphaned authority-envelope expansion function is deleted, together with the restriction ladder and budget-expansion helpers whose only reader it was, leaving no new dead code behind; tests whose real subject is the live envelope-normalisation behavior are kept, with only their references to the deleted function removed."
    evidence_type: automated_test
    evidence: "gate: the deleted symbols are absent from the sources, no newly-dead symbol is introduced, and the envelope-normalisation fail-closed tests still pass"
    approver: policy
  - id: AC-007
    condition: "The documentation states truthfully what is and is not detected: the architecture decision record, the repository instructions, and the open backlog item say that the standing-context classifier enforces standing-context authority expansion — bound to a named human approval and the exact standing-context fingerprint — and that work-unit envelope expansion, INCLUDING budget and capability-level expansion, has no detector because the envelope is write-once after approval; and the two docstrings asserting an unknown-fields fail-closed gate that exists nowhere are corrected. Recording a false equivalence here would tell the cost-controls workstream that budget expansion is checked when it is not, which is worse than the dead function."
    evidence_type: automated_test
    evidence: "gate: the corrected documents state which expansion is enforced and which is structurally impossible, and no surviving docstring asserts an unknown-fields gate that does not exist"
    approver: policy
  - id: AC-008
    condition: "An architecture test proves the work-unit authority envelope is assigned only at unit construction, scanning attribute assignment, setattr, bulk update statements, and in-place mutation of the stored JSON document; the negative control plants the in-place JSON mutation, because that is the form a naive scan misses and the form a budget-raiser would most naturally write. Any future path that raises a unit's budget or capabilities then fails this test and is forced to introduce a fail-closed check alongside it."
    evidence_type: automated_test
    evidence: "gate: the write-once test passes on the branch, scans all four mutation forms, and fails when the in-place JSON mutation is planted"
    approver: policy
  - id: AC-009
    condition: "An architecture guard fails when a public function in the kernel or the services layer is unreachable from any production entry point, computed over a call graph whose nodes are import-resolved module-and-symbol pairs rather than bare names. Name-keyed reachability is insufficient and must not be shipped: the command-line client reaches services only over HTTP while its commands share their names, so a name-keyed graph marks twelve service functions reachable that no production code calls."
    evidence_type: automated_test
    evidence: "gate: the unreachable-guard test passes on the branch and resolves call edges through each module's import map rather than by bare name"
    approver: policy
  - id: AC-010
    condition: "The architecture guard is proven capable of failing, by the control that matters: removing the only production caller of a live service — the WS-P2.1 defect reconstructed — makes the guard flag that service. It additionally fails on a function laundered behind a dead cross-module caller and on a function sharing its name with a live function in another module. Run against the repository tree as it stood before this change, it independently identifies both previously-unwired guards."
    evidence_type: automated_test
    evidence: "gate: the guard flags a service whose only production caller was removed, fails on both other planted violations, and names both previously-unwired guards on the pre-change tree"
    approver: policy
  - id: AC-011
    condition: "Every symbol the guard surfaces is triaged — deleted, wired, or made private — and a symbol is allowlisted only where an exemption is genuinely justified, with that justification recorded entry by entry; no symbol is allowlisted on the grounds that it is in fact reachable, because that would mean the predicate is wrong rather than the symbol exempt. An anti-rot check fails when an allowlisted symbol has since become reachable and its exemption was not removed."
    evidence_type: automated_test
    evidence: "gate: every surfaced symbol has a recorded disposition, every allowlist entry carries its justification, and the anti-rot check fails on a stale exemption"
    approver: policy
  - id: AC-012
    condition: "The post-deploy envelope minting path no longer passes an unknown-fields key that is not itself a known field, so a post-deploy unit's envelope is a fixed point of normalisation rather than carrying a spurious unknown field; without this, any future unknown-fields fail-closed gate would reject every post-deploy verification unit."
    evidence_type: automated_test
    evidence: "gate: a test proves the minted post-deploy envelope carries no unknown fields and round-trips through normalisation unchanged"
    approver: policy
  - id: AC-013
    condition: "Every write introduced by this package is proven durable by expiring the session and re-reading it rather than by asserting on a returned object; a request entry point commits its own transaction, and a function invoked inside another transaction does not commit."
    evidence_type: automated_test
    evidence: "gate: persistence tests expire the session and re-read, and a review of every new writer confirms the transaction-ownership rule"
    approver: policy
  - id: AC-014
    condition: "Each guard added by this package is proven by negative control: with the guard's body removed, a named test goes red. A guard for which no test changes colour when it is removed is decoration and does not satisfy this criterion."
    evidence_type: automated_test
    evidence: "gate: for each guard, the negative-control run with the guard body removed is recorded, naming the test that goes red"
    approver: policy
  - id: AC-015
    condition: "The change adds no automatic merge path, no outbound GitHub or Coolify call from the orchestrator process, no autonomous background loop, scheduler, or cron, and no automatic transition out of an approval state; workers still cannot declare completion; the cross-repository authority-envelope fixture and contract hash are unchanged; and no secret is written to a tracked file."
    evidence_type: automated_test
    evidence: "scan: the repo-wide invariant scan, the envelope contract test, and the security scan all pass"
    approver: policy
  - id: AC-016
    condition: "The full repository check is green, every existing drill still passes alongside the drill added here, and the named Quality check succeeds on the exact pull-request head, with the collected test count read rather than the exit code trusted."
    evidence_type: automated_test
    evidence: "gate: the repository check and every drill pass, and the named Quality check is green on the exact head with a read collected-test count"
    approver: policy
  - id: AC-017
    condition: "An adversarial architecture review challenges the design before implementation — especially whether each guard is genuinely fail-closed rather than merely present, whether each guard's predicate matches the defect it is for, and whether the allowlist is a justified exemption rather than a loosened rule — and its findings are resolved in the approved design."
    evidence_type: human_review
    evidence: "human: Devon approves the WS-P2.15 design after an adversarial architecture review resolves its findings"
    approver: devon
  - id: AC-018
    condition: "The acceptance criteria of this package are adjudicated by a verifier agent that neither wrote the implementation nor produced its evidence, and this is mechanically checkable rather than attested: the evidence index records the implementing session's identifier and the adjudicating session's identifier, and the criterion is satisfied only if they differ. Any disagreement the adjudicator raises is recorded."
    evidence_type: human_review
    evidence: "human: the evidence index records distinct implementer and adjudicator session identifiers, and Devon confirms the adjudication and its recorded findings"
    approver: devon
  - id: AC-019
    condition: "Devon reviews and merges the pull request personally after the named Quality check succeeds on the exact head; no worker, agent, CI job, or orchestrator path merges it."
    evidence_type: human_review
    evidence: "human: Devon confirms the final review and merge decision, and merge remains outside worker authority"
    approver: devon
