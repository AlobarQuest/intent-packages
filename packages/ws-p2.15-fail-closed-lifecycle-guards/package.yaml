schema_version: 1
package_id: ws-p2.15-fail-closed-lifecycle-guards
title: "WS-P2.15 — fail-closed lifecycle guards: remove the guards nothing discharges, and make an unreachable guard detectable"
revision: 1
status: draft
created_by: claude-code-interactive
owner: devon
created_at: "2026-07-12T00:00:00Z"
supersedes: null
profile: software-delivery
profile_fields:
  repo: AlobarQuest/orchestrator
  branch: sds/wsp215-fail-closed-lifecycle-guards
  deploy_target: null
  required_checks:
    - Quality
  rollback_plan: "Before deployment, revert or abandon the WS-P2.15 branch and close the draft pull request while retaining this approved package, its evidence, and the review findings. Every change is orchestrator-local and is exercised only in disposable local or ephemeral databases; production deployment is separately scoped, so there is no production change to roll back here."
outcome:
  what: "Two declared lifecycle guards that nothing forces the system to discharge are removed and replaced by mechanisms that cannot be silently skipped — an unanswered human approval gate becomes visible as a derived read in the existing dead-letter view, with no write, no route, and no threshold that can be switched off, while the never-called age-out function and its dead configuration knob are deleted; and the orphaned authority-envelope expansion function is deleted and replaced by a structural guarantee, an architecture test proving the envelope is write-once, so that a future budget-raising path cannot appear unguarded. A new architecture guard then makes the whole class detectable, failing when a public function in the kernel or the services layer is unreachable from any production entry point over an import-resolved call graph, and every symbol it surfaces is triaged rather than exempted."
  why: "WS-P2.1 shipped a feature that was dead in production while every unit test passed: the pull-request binding writers had no production caller at all, and the writer beneath them flushed without committing. An obligation nobody is forced to discharge is not a guarantee, and a guard nobody calls is not protection; both are indistinguishable from a healthy system from the outside, and both survive a green suite indefinitely. This workstream closes the orchestrator-local instances of that pattern and, more importantly, makes the pattern itself detectable, because there are demonstrably others — the adversarial review of this package's own first revision found eleven candidate symbols where the handoff knew of two."
  beneficiary: "Devon as the operator, who must be able to trust that a declared guard is a real one, and who currently has no surface that reports an approval gate nobody answered; and the software delivery system, which gains a detector for the defect class that cost it a whole workstream to learn."
  success_signal: "An unanswered human approval gate past its threshold appears in the dead-letter view with no parameters supplied and no value able to switch it off, while the work unit is never transitioned and every edge out of an approval state is proven to require a named human actor, so silence can never become approval; the orphaned expansion function and the never-called age-out are both deleted along with the dead code and dead configuration they leave behind, the documentation states truthfully which expansion is enforced and which is structurally impossible, and an architecture test makes the envelope provably write-once against all four mutation forms; and the new architecture guard flags a live service whose only production caller has been removed — the WS-P2.1 defect reconstructed, which a name-keyed graph misses and an import-resolved graph catches — independently rediscovers both previously-unwired guards from the pre-change tree, and carries exactly one allowlist entry because the other findings were fixed rather than exempted."
scope:
  included:
    - "Author and approve this intent package before any design or work unit is created."
    - "Surface an unanswered human approval gate as a DERIVED READ in the existing dead-letter view — a predicate over work-unit state and last-update time — rather than as a written record. A stalled gate is a fact about the present, not an event that happened, and the dead-letter view is already defined as derived live from the source tables with nothing to drift out of sync. This adds no route, no CLI command, no migration, and no write."
    - "Delete the already-implemented but never-called human-gate age-out function, together with its dispatch-settings field and its configuration knob. Wiring it is unshippable: its blocked record cannot use a zero runner-attempt because the database forbids it, and any other runner-attempt silently consumes a dispatch slot, so a later genuine dispatch of the same unit would be short-circuited into returning the stale record and never dispatch. A dead configuration knob is the same defect as a dead function."
    - "Give the stalled-approval threshold a real default and no disabled value, because a nullable, default-disabled threshold is exactly why the age-out stayed invisible for an entire workstream; prove by test that the dead-letter view surfaces a stalled gate with no parameters supplied."
    - "State, in the dead-letter view's own contract and operator-facing copy, that the view now enumerates terminal failures and stalled approval gates, and that a stalled gate is reported but not requeue-eligible."
    - "Prove against the kernel's own edge table that every transition out of an approval state requires a named human actor, so that silence can never become approval — a property this package must assert explicitly, because the derived read adds no code that would otherwise carry it."
    - "Delete the orphaned authority-envelope expansion function, the restriction ladder whose only readers are that function, and the budget-expansion helpers it alone used; delete only the assertion lines that reference it from tests whose real subject is the live envelope-normalisation behavior, keeping those tests."
    - "Correct the architecture decision record, the repository instructions, and the open backlog item to state truthfully that the standing-context classifier enforces standing-context authority expansion, and that work-unit envelope expansion — including budget and capability-level expansion — has no detector because the envelope is write-once after approval; and correct the two docstrings that assert an unknown-fields fail-closed gate which does not exist anywhere."
    - "Add an architecture test proving the work-unit authority envelope is assigned only at unit construction, scanning attribute assignment, setattr, bulk update statements, and in-place mutation of the stored JSON document, so that any future budget-raising or capability-raising path — such as the one WS-P2.4 may introduce — trips the test and is forced to introduce a fail-closed check with it."
    - "Add an architecture guard that fails when a public function in the kernel or the services layer is unreachable from any production entry point, computed over a call graph whose nodes are import-resolved module-and-symbol pairs rather than bare names, so that a service function is not marked reachable merely because a command-line client proxying it over HTTP happens to share its name."
    - "Verify that architecture guard by removing the only production caller of a live service and observing the guard flag it — the WS-P2.1 defect reconstructed — and additionally by planting a function laundered behind a dead cross-module caller and a function sharing its name with a live function in another module."
    - "Fix the post-deploy envelope minting path, which passes an unknown-fields key that is not itself a known field and so mints every post-deploy unit with a spurious unknown field; harmless only while nothing reads unknown fields, and a landmine under the very message this package sends to WS-P2.4."
    - "Triage every symbol the guard's first run surfaces beyond the two known instances — by wiring it, making it private, or deleting it — and allowlist a symbol only where an exemption is genuinely justified, recording that justification entry by entry."
    - "Cover the age-out with a drill in the existing drill mould, driving the real public HTTP surface rather than calling services in-process, because that is what caught the WS-P2.1 defect a green unit suite did not."
    - "Prove persistence of any new write by expiring the session and re-reading, never by asserting on the object a call returned."
  excluded:
    - "The pull-request-binding submission guard and everything it depends on — enforcing the unit-envelope capability vocabulary at ingress, changing AlobarQuest/factory-runner to record its pull-request binding before submitting, and the deployment ordering between them. The adversarial review of this package's first revision established that the guard cannot be built safely without all three: every dispatched unit's envelope allows the pull-request capability while no worker writes a binding, so the guard would halt the factory; and no code validates capability names, so units authored in the registry vocabulary would evade it entirely. That work is a cross-repository package of its own and is handed off with these findings."
    - "Production deployment of the orchestrator; a separate deploy step handles it."
    - "Any automatic transition out of an approval state, any timer, and any background loop, scheduler, or cron in the orchestrator process."
    - "Any automatic merge, or any worker, agent, CI, or orchestrator path that merges a pull request."
    - "Any outbound call to GitHub or Coolify from the orchestrator process itself."
    - "Any new authority-envelope mutation path invented in order to give the deleted expansion check something to guard."
    - "Widening the architecture guard's scope beyond the kernel and services layers; route handlers, CLI commands, models, and schemas are the entry points and the framework-registered surfaces, and are roots of the reachability analysis rather than subjects of it."
    - "Factory SLOs and observability (WS-P2.2), acceptance-criterion adjudication completeness (WS-P2.3), and cost controls (WS-P2.4)."
  non_goals:
    - "Eliminating every false positive from the architecture guard; where a symbol is genuinely exempt, an explicit justified allowlist entry is the correct answer, and a looser predicate is not. But an allowlist entry that would read 'in fact it is called' is evidence the predicate is wrong, not evidence an exemption is needed."
    - "Deciding, in this package, what an operator should do about a stalled approval gate; the package makes it visible, and Devon decides."
  assumptions:
    - "The dead-letter view already enumerates blocked dispatch records, so the human-gate age-out needs a caller, a threshold, and an honest statement of the view's widened contract, rather than a new operator surface."
    - "The human-gate age-out never mutates the work unit's attempt count and records no failure signature, so it can neither burn the attempt budget nor trip the circuit breaker; its only unwanted coupling to dispatch is the runner-attempt sequence, which this package severs."
    - "The work-unit authority envelope is assigned only at unit construction today, so deleting the envelope-expansion function removes no live coverage; the retry path raises the attempt budget on the work-unit column rather than the envelope, and never consulted the deleted function."
    - "The standing-context classifier compares standing contexts, not authority envelopes: it checks capability sets and authority-profile rank, and does not check capability levels, budgets, or unknown fields. The corrected documentation must say this, because recording a false equivalence would tell a future engineer that envelope and budget expansion are checked when they are not."
    - "PostgreSQL is the concurrency and idempotency authority; persistence assertions run against PostgreSQL and re-read after expiry."
    - "Devon alone approves this package revision, approves the design, approves the decomposition, and merges the pull request."
  open_questions: []
