    - "Whether the architecture guard's predicate would have caught the WS-P2.1 defect, and whether it would catch a defect hidden behind a dead cross-module caller."
    - "Whether the allowlist is a set of justified exemptions or a quietly loosened rule."
    - "Whether the stalled-approval surface is one an operator would actually notice, rather than one that is merely queryable."
    - "Whether the drills would fail if the guard were removed, or would pass regardless."
follow_up:
  required: true
  revisit_when: "When WS-P2.16 schedules the pull-request-binding chain, and after the first quarterly run of the drills."
  signals:
    - "An allowlist entry in the architecture guard that nobody can justify on re-reading"
    - "A stalled approval that the dead-letter view reported and nobody acted on"
    - "Another declared guard discovered to have no production entry path"
    - "Pressure to loosen the guard's predicate rather than triage what it finds"
  owner: devon
