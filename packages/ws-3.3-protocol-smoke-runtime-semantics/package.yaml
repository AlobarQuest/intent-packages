outcome:
  what: "The orchestrator proves the runtime protocol end to end through public API and CLI behavior, including standing-context preflight, authority-update semantics, lease recovery, and a read-only status-ledger projection."
  why: "Phase 3 needs proof that approved package intake and approved decomposition can feed realistic human, worker, and verifier protocol paths before factory-runner dispatch or external event publication is built."
  beneficiary: "Devon, future factory workers, verifiers, and software and non-software workflows that rely on the orchestrator as canonical lifecycle owner."
  success_signal: "Approved package fixtures can be intaken, decomposed, claimed, executed, blocked, resumed, submitted, verified, retried, reclaimed after lease expiry, and inspected through a status ledger without any worker becoming canonical completion authority."
scope:
  included:
    - "Re-establish the merged WS-3.2 baseline, including intent-package validation, orchestrator local make check, closed WS-3.1 and WS-3.2 hash verification, and the current foundation matrix result."
    - "Author and approve this WS-3.3 intent package before changing orchestrator application code."
    - "Write an approved WS-3.3 design specification in AlobarQuest/orchestrator before implementation planning."
    - "Resolve the required design decisions explicitly in the specification: fixture strategy, preflight gate placement, standing-context fields and sources, context storage, same-scope versus authority-expanding update rules, skill-subscription modeling level, status-ledger shape and surfaces, human-worker versus factory-runner boundary, WS-3.4 preparation, and migration strategy."
    - "Run an adversarial architecture review of the WS-3.3 design before implementation planning."
    - "Write and approve a task-level implementation plan before implementation."
    - "Implement a protocol smoke suite that exercises claim, renew, start, block, unblock or resume, request approval, approval, submit evidence, verify or review, revision-required, failed, retry, and complete paths using public API and CLI behavior where possible."
    - "Start smoke fixtures from approved package intake and approved decomposition rather than handcrafted work units, except for narrowly scoped legacy WS-3.1 regression coverage."
    - "Prove lease-expiry recovery for a kill or crash style claimed-unit scenario, including safe reclaim after expiry, rejection before expiry, attempt count preservation, stale credential rejection, old token rejection, and old owner mutation rejection."
    - "Preserve WS-3.1 claim concurrency behavior and attempt-aware lifecycle guards."
    - "Define WS-3.3 standing context as code standards version, security standards version, project standards or foundation contract where available, agent identity and authority profile, skill bundle or worker runtime version, and package-declared required context."
    - "Require worker preflight before claim, before execute, or both as recommended in the approved design, and fail closed when required context is missing, stale, or authority-expanding."
    - "Record standing-context versions in claim, execution, evidence, or local protocol events as specified by the approved design so later verification can identify which context the worker used."
    - "Implement same-scope skill or standing-context update semantics separately from authority-expanding update semantics."
    - "Allow same-scope context or skill updates to flow under an existing human approval only when the approved package and authority envelope permit it."
    - "Require a new named human approval or readiness invalidation before execution continues when an update expands authority."
    - "Append attributable local events for preflight decisions, subscription or update decisions, protocol transitions, evidence submission, recovery actions, and status-ledger derivation inputs."
    - "Implement a status-ledger projection derived from canonical orchestrator events and current tables, including current claim, lease expiry, last heartbeat or event time, current unit state, blockers, pending human approvals, latest evidence submission, and last failure where available."
    - "Expose enough API and CLI status-ledger behavior for Devon to inspect worker or agent state without making Linear, Todoist, GitHub, or another tracker canonical."
    - "Register and decompose both closed Phase-2 control packages as real local protocol fixtures, acceptance examples, or explicitly deferred examples with rationale in the approved design."
    - "Keep local event names and payloads stable enough for WS-3.4 external factory-event/v1 publication, without publishing external events in WS-3.3."
  excluded:
    - "Factory runner, automatic dispatch, GitHub Actions worker execution, and workflow_dispatch integration."
    - "Production deployment automation, Coolify mutation, or live infrastructure mutation."
    - "Phase-5 independent verifier logic or automatic acceptance-criterion adjudication beyond the minimum protocol smoke verifier paths."
    - "External factory-event/v1 publication, event-store writes outside the orchestrator database, or WS-3.4 evidence publication."
    - "Linear, Todoist, GitHub, or any tracker becoming canonical lifecycle state."
    - "Automatic merge or any worker, agent, API, CLI, CI, or UI path that merges pull requests."
    - "Autonomous intent approval, autonomous decomposition approval, or worker-controlled canonical completion."
    - "Brain learning, knowledge promotion, production observation loop, additional agent personas, generalized skill marketplace, generalized visual workflow builder, or listing-specific intent profile."
    - "Broad refactors of change-manager, intent-packages, security-standards, brain, or project-standards."
    - "Project-standards onboarding work beyond consuming the merged foundation baseline already present before this package."
  non_goals:
    - "Completing all remaining Phase 3 workstreams."
    - "Building factory-runner dispatch under the name of smoke testing."
    - "Making the status ledger a second lifecycle authority."
    - "Changing change-manager's role as drift and sensitive-infrastructure authority."
  assumptions:
    - "WS-3.1 and WS-3.2 are merged, closed, and verified on main before this package is approved."
    - "intent-packages remains canonical for package content, revision numbering, hash behavior, package lifecycle, and approval ledger."
    - "The orchestrator remains the canonical lifecycle owner for work units."
    - "PostgreSQL remains the concurrency and migration target for orchestrator acceptance tests."
    - "Devon alone approves exact package revisions, approves decomposition, moves PRs out of draft when applicable, and merges PRs."
  open_questions: []
