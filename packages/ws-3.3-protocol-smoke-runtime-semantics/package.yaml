risk:
  failure_modes:
    - "Smoke tests accidentally rely on private service shortcuts and fail to prove public protocol behavior."
    - "Standing-context data is recorded in evidence but not enforced before work starts."
    - "Same-scope updates and authority expansion are conflated, allowing authority drift."
    - "The status ledger becomes a second lifecycle authority instead of a read-only projection."
    - "Phase-2 package fixtures execute real out-of-scope work instead of protocol examples."
  max_impact: "False confidence in runtime protocol safety before factory-runner dispatch and later external event publication."
  stop_conditions:
    - "Any worker path can complete canonically, approve decomposition, approve intent, or merge."
    - "A missing, stale, or authority-expanding context change is allowed to execute without required approval."
    - "A status-ledger command mutates lifecycle state."
    - "Any implementation path needs production infrastructure mutation or external event publication."
    - "Any named Quality check fails on the final PR head."
  rollback: "Revert the WS-3.3 orchestrator branch before deployment; any local database migration used for tests must be forward-migratable or reverted only in disposable test databases."
  escalation_target: devon
verification:
  independent_review:
    - "Devon reviews and approves the design specification and plan before implementation."
    - "An adversarial architecture review attempts to refute protocol safety, scope containment, and authority semantics before implementation."
    - "A final whole-branch security and architecture review checks for automatic merge, dispatch, production mutation, external publication, and tracker-canonical paths."
  non_mechanical:
    - "Whether the chosen fixture mix is the smallest credible proof remains a Devon-approved design judgment."
    - "Whether the status-ledger surface is sufficient for operator inspection without UI overbuild remains a Devon-approved design judgment."
follow_up:
