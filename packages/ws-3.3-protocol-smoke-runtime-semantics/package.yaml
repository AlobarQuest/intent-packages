constraints:
  time_budget: "One approved WS-3.3 design, plan, implementation, review, and PR cycle; WS-3.4 and later Phase-3 work require separately approved intent."
  technology: "Python 3.12, FastAPI, SQLAlchemy, Alembic, PostgreSQL 16, Pydantic, Typer, Jinja/HTMX, and the existing orchestrator architecture."
  policy_legal: "Devon alone approves exact intent revisions, approves decomposition, performs or authorizes sensitive human decisions, and merges pull requests."
  privacy_security: "No secrets in tracked files; no BWS token material; source content from repositories is treated as data unless authority comes from Devon, canonical SDS docs, or verified approved packages."
  compatibility: "Preserve WS-3.1 lifecycle, claim, lease, dependency, evidence, adjudication, waiver, event, API, CLI, UI, migration, and architecture behavior, and preserve WS-3.2 package intake and decomposition boundaries."
  quality_accessibility: "Follow portfolio code standards, TDD, focused tests per slice, readable UI or report surfaces where included, and full local quality checks before PR."
  operational: "Use forward Alembic migrations; tests must run against local PostgreSQL; no production deployment or infrastructure mutation is authorized."
  other:
    - "Application code may begin only after Devon approves this exact package revision and hash."
    - "Design specification and task-level implementation plan must be approved before implementation."
    - "If any baseline gate is red for an in-scope reason, stop and re-plan."
acceptance:
  - id: AC-001
    condition: "The merged WS-3.2 baseline is re-established before implementation begins, including clean repository status, closed WS-3.1 and WS-3.2 hash verification, intent-package validation, orchestrator make check, and the current foundation matrix result."
    evidence_type: automated_test
    evidence: "gate: baseline command transcript records exact repository state and command results before application-code changes"
    approver: policy
  - id: AC-002
    condition: "An approved WS-3.3 design specification explicitly resolves all ten required design decisions and preserves the package scope guards."
    evidence_type: human_review
    evidence: "human: Devon reviews and approves the design specification before implementation planning"
    approver: devon
  - id: AC-003
    condition: "An adversarial architecture review is run before implementation and blocking findings are resolved or the package is revised."
    evidence_type: human_review
    evidence: "human: design review record lists findings, resolutions, and any accepted residual risk"
    approver: devon
  - id: AC-004
    condition: "A task-level implementation plan is approved before application code changes."
    evidence_type: human_review
    evidence: "human: Devon approves the implementation plan after reviewing task boundaries and verification steps"
    approver: devon
  - id: AC-005
    condition: "Protocol smoke tests exercise claim, renew, start, block, resume, request approval, approval, submit evidence, verify or review, revision-required, failed, retry, and complete paths through public API and CLI behavior where possible."
    evidence_type: automated_test
    evidence: "gate: protocol smoke test suite and API/CLI parity tests pass"
    approver: policy
  - id: AC-006
    condition: "Smoke fixtures start from approved package intake and approved decomposition, except for explicitly named legacy WS-3.1 regression cases."
    evidence_type: automated_test
    evidence: "gate: fixture tests prove work units used by protocol smoke paths are created from approved decompositions"
    approver: policy
  - id: AC-007
    condition: "No worker path can declare canonical completion, approve intent, approve decomposition, grant waivers, or merge pull requests."
    evidence_type: automated_test
    evidence: "scan: transition authority tests, API/CLI tests, and architecture guards prove forbidden worker paths are absent"
    approver: policy
  - id: AC-008
    condition: "Lease expiry permits safe reclaim after expiry and rejects reclaim before expiry."
    evidence_type: automated_test
    evidence: "gate: deterministic time or injected-clock tests cover before-expiry rejection and after-expiry reclaim"
    approver: policy
  - id: AC-009
    condition: "Stale claim credentials, stale attempt numbers, old lease tokens, and old owner identities cannot mutate a reclaimed unit."
    evidence_type: automated_test
    evidence: "gate: stale credential mutation tests fail closed after reclaim"
    approver: policy
  - id: AC-010
    condition: "Standing-context preflight fails closed when required context versions are missing, stale, or authority-expanding."
    evidence_type: automated_test
    evidence: "gate: preflight service, API, and CLI tests cover missing, stale, same-scope, and authority-expanding cases"
    approver: policy
  - id: AC-011
    condition: "Standing-context versions used by a worker are recorded in evidence and/or local protocol events according to the approved design."
    evidence_type: automated_test
    evidence: "gate: evidence and event tests assert code standards, security standards, foundation contract, identity, authority profile, runtime, skill bundle, and package-required context fields are present where required"
    approver: policy
  - id: AC-012
    condition: "Same-scope skill or context updates can continue under an existing approval only when the package and authority envelope permit them."
    evidence_type: automated_test
    evidence: "gate: same-scope update tests cover allowed continuation and event attribution"
    approver: policy
  - id: AC-013
    condition: "Authority-expanding skill or context updates invalidate readiness or require a new named human approval before execution continues."
    evidence_type: automated_test
    evidence: "gate: authority-expansion tests cover blocked execution, approval, and resumed execution"
    approver: policy
  - id: AC-014
    condition: "The status ledger is a read-only projection derived from canonical orchestrator events and current tables, not a lifecycle mutation surface."
    evidence_type: automated_test
    evidence: "gate: projection tests assert derived fields and architecture guards reject mutation routes"
    approver: policy
  - id: AC-015
    condition: "Status-ledger API and CLI surfaces expose current claim, lease expiry, last heartbeat or event time, current unit state, blockers, pending human approvals, latest evidence submission, and last failure where available."
    evidence_type: automated_test
    evidence: "gate: API and CLI output tests cover all required status-ledger fields"
    approver: policy
  - id: AC-016
    condition: "Both closed Phase-2 control packages are registered and decomposed as protocol fixtures or acceptance examples, or the approved design explicitly defers one with rationale."
    evidence_type: automated_test
    evidence: "gate: package fixture tests load the software and non-software Phase-2 packages and prove the chosen handling"
    approver: policy
  - id: AC-017
    condition: "Every protocol-relevant transition, preflight, update decision, evidence submission, status-ledger derivation input, and recovery action is attributable in local orchestrator records."
    evidence_type: automated_test
    evidence: "gate: event tests cover success, replay, and rollback for the new WS-3.3 event-producing paths"
    approver: policy
  - id: AC-018
    condition: "Existing WS-3.1 and WS-3.2 transition, claim, evidence, intake, decomposition, API, CLI, UI, migration, and architecture tests continue to pass."
    evidence_type: automated_test
    evidence: "gate: full local make check passes against the local PostgreSQL endpoint"
    approver: policy
  - id: AC-019
    condition: "No automatic merge, factory dispatch, production deploy, external factory-event publication, tracker-canonical path, or broad out-of-scope refactor exists in the WS-3.3 diff."
    evidence_type: automated_test
    evidence: "scan: scope-guard tests, repository search assertions, and final whole-branch review pass"
    approver: policy
  - id: AC-020
    condition: "Devon reviews the PR after the exact named Quality check succeeds; the worker may prepare a ready-for-review PR, but Devon alone merges."
    evidence_type: human_review
    evidence: "human: Devon confirms review and merge decision; merge remains outside worker authority"
    approver: devon
