name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package (dev extra)
        run: pip install -e ".[dev]"

      - name: Validate all packages
        run: PYTHONPATH=src python3 -m intent_packages validate --all

      - name: Tests (assert non-zero collected)
        run: |
          set +e
          PYTHONPATH=src python3 -m pytest -q -rN 2>&1 | tee pytest-out.txt
          ec=${PIPESTATUS[0]}
          set -e
          if [ "$ec" -ne 0 ]; then echo "ERROR: pytest failed (exit $ec)"; exit "$ec"; fi
          grep -Eq '[1-9][0-9]* passed' pytest-out.txt || { echo "ERROR: no tests ran"; exit 1; }

      - name: Lint
        run: ruff check .
