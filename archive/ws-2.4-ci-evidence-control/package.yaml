outcome:
  what: "Intent-package operators have a durable rule for deciding whether a CI-backed acceptance criterion actually passed."
  why: "The original WS-2.4 software pilot silently treated a failed, non-gating workflow as satisfied; the contract needs an explicit operator rule before Phase 2 can close."
  beneficiary: "Devon and future orchestrator/verifier implementations."
  success_signal: "The rule is merged through a PR whose Quality and validate workflows both pass on the exact PR revision, and no named check is inferred or waived."
scope:
  included:
    - "Add an operator document defining exact-revision CI evidence, named-check success, non-gating semantics, historical-run treatment, and failure handling."
    - "Deliver the document through the normal intent-packages PR and CI path."
  excluded:
    - "Adding evidence fields, waiver fields, CLI commands, or orchestrator behavior."
    - "Changing the lifecycle, schema, profiles, validator, or production systems."
  non_goals:
    - "Retroactively changing the result of ws-2.4-brain-approver-gate AC-003."
    - "Claiming that documentation mechanically enforces the rule."
  assumptions:
    - "Quality and validate are the two workflows configured for intent-packages."
  open_questions: []
