  operational: "Both named GitHub Actions workflows must pass on the exact PR head revision."
  other: []
acceptance:
  - id: AC-001
    condition: "The operator document states that only successful checks on the exact PR revision under verification count as CI acceptance evidence."
    evidence_type: human_review
    evidence: "human: whole-document review confirms exact-revision and named-check semantics are explicit"
    approver: devon
  - id: AC-002
    condition: "The document states that non-gating does not mean passed, historical failures remain historical, and later runs cannot repair an earlier AC."
    evidence_type: human_review
    evidence: "human: literal review finds all three rules without relying on implication"
    approver: devon
  - id: AC-003
    condition: "Quality and validate both pass on the pull request's exact head revision."
    evidence_type: automated_test
    evidence: "gate: GitHub check runs for Quality and validate both conclude success on the PR head SHA"
    approver: policy
  - id: AC-004
    condition: "An unmet CI-backed AC is documented as blocking completion unless the package is formally corrected and reapproved."
    evidence_type: human_review
    evidence: "human: operator document explicitly prohibits silent waiver and defines the blocked/correction path"
    approver: devon
  - id: AC-005
    condition: "Devon reviews and merges the PR; the worker does not merge it."
    evidence_type: human_review
    evidence: "human: Devon confirms review and merge after all named checks pass"
    approver: devon
